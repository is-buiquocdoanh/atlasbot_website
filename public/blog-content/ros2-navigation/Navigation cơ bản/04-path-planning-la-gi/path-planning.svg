<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Arial, sans-serif">
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Dijkstra vs A* — vùng khám phá</text>

  <text x="200" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#DC2626">Dijkstra — mở rộng đều mọi hướng</text>
  <rect x="60" y="75" width="280" height="220" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1"/>
  <circle cx="90" cy="280" r="110" fill="#FEE2E2" opacity="0.6"/>
  <circle cx="90" cy="280" r="6" fill="#2563EB"/>
  <text x="90" y="300" text-anchor="middle" font-size="8" fill="#1E3A8A">start</text>
  <circle cx="320" cy="100" r="6" fill="#16A34A"/>
  <text x="320" y="90" text-anchor="middle" font-size="8" fill="#166534">đích</text>
  <text x="90" y="230" text-anchor="middle" font-size="8" fill="#7F1D1D">vùng khám phá</text>
  <text x="90" y="243" text-anchor="middle" font-size="8" fill="#7F1D1D">lan toả đều</text>

  <text x="600" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">A* — thiên vị về hướng đích</text>
  <rect x="460" y="75" width="280" height="220" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1"/>
  <path d="M 490 280 Q 600 250 720 100 Q 620 220 490 280 Z" fill="#DCFCE7" opacity="0.7"/>
  <circle cx="490" cy="280" r="6" fill="#2563EB"/>
  <text x="490" y="300" text-anchor="middle" font-size="8" fill="#1E3A8A">start</text>
  <circle cx="720" cy="100" r="6" fill="#16A34A"/>
  <text x="720" y="90" text-anchor="middle" font-size="8" fill="#166534">đích</text>
  <text x="590" y="200" text-anchor="middle" font-size="8" fill="#166534">vùng khám phá hẹp hơn,</text>
  <text x="590" y="213" text-anchor="middle" font-size="8" fill="#166534">hướng thẳng về đích</text>

  <rect x="90" y="320" width="620" height="65" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="345" text-anchor="middle" font-size="12" font-family="monospace" fill="#111827">f(ô) = g(ô) + h(ô)  —  h(ô) = 0 thì A* = Dijkstra</text>
  <text x="400" y="368" text-anchor="middle" font-size="10" fill="#6B7280">g = chi phí đã đi · h = heuristic ước lượng khoảng cách còn lại tới đích</text>
</svg>
