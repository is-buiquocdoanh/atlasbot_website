<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Arial, sans-serif">
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Occupancy Grid — lưới xác suất 3 trạng thái</text>

  <g>
    <!-- grid of cells -->
    <rect x="60" y="60" width="300" height="220" fill="none" stroke="#9CA3AF" stroke-width="1"/>
    <!-- free cells -->
    <rect x="60" y="60" width="300" height="220" fill="#FFFFFF"/>
    <!-- occupied wall -->
    <rect x="60" y="60" width="300" height="20" fill="#111827"/>
    <rect x="60" y="260" width="300" height="20" fill="#111827"/>
    <rect x="60" y="60" width="20" height="220" fill="#111827"/>
    <rect x="340" y="60" width="20" height="220" fill="#111827"/>
    <!-- obstacle inside -->
    <rect x="180" y="140" width="40" height="40" fill="#111827"/>
    <!-- unknown region -->
    <rect x="240" y="180" width="80" height="60" fill="#9CA3AF" opacity="0.5"/>
    <!-- grid lines -->
    <g stroke="#E5E9EF" stroke-width="0.5">
      <line x1="100" y1="60" x2="100" y2="280"/>
      <line x1="140" y1="60" x2="140" y2="280"/>
      <line x1="180" y1="60" x2="180" y2="280"/>
      <line x1="220" y1="60" x2="220" y2="280"/>
      <line x1="260" y1="60" x2="260" y2="280"/>
      <line x1="300" y1="60" x2="300" y2="280"/>
      <line x1="60" y1="100" x2="360" y2="100"/>
      <line x1="60" y1="140" x2="360" y2="140"/>
      <line x1="60" y1="180" x2="360" y2="180"/>
      <line x1="60" y1="220" x2="360" y2="220"/>
      <line x1="60" y1="260" x2="360" y2="260"/>
    </g>
  </g>

  <rect x="440" y="70" width="300" height="45" rx="6" fill="#F3F5F8" stroke="#111827" stroke-width="1.3"/>
  <text x="460" y="98" font-size="12" font-family="monospace" fill="#111827">0</text>
  <rect x="480" y="80" width="16" height="16" fill="#FFFFFF" stroke="#9CA3AF"/>
  <text x="520" y="98" font-size="11" fill="#374151">free — đi qua được</text>

  <rect x="440" y="130" width="300" height="45" rx="6" fill="#F3F5F8" stroke="#111827" stroke-width="1.3"/>
  <text x="460" y="158" font-size="12" font-family="monospace" fill="#111827">100</text>
  <rect x="480" y="140" width="16" height="16" fill="#111827"/>
  <text x="520" y="158" font-size="11" fill="#374151">occupied — có vật cản</text>

  <rect x="440" y="190" width="300" height="45" rx="6" fill="#F3F5F8" stroke="#111827" stroke-width="1.3"/>
  <text x="460" y="218" font-size="12" font-family="monospace" fill="#111827">-1</text>
  <rect x="480" y="200" width="16" height="16" fill="#9CA3AF" opacity="0.6"/>
  <text x="520" y="218" font-size="11" fill="#374151">unknown — chưa quét tới</text>

  <rect x="90" y="315" width="620" height="55" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="338" text-anchor="middle" font-size="11" font-family="monospace" fill="#111827">my_map.pgm (ảnh xám) + my_map.yaml (resolution, origin)</text>
  <text x="400" y="358" text-anchor="middle" font-size="9" fill="#6B7280">mở được bằng bất kỳ trình xem ảnh nào, kể cả Paint/GIMP</text>
</svg>
