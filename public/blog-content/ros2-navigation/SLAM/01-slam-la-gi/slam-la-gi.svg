<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Arial, sans-serif">
  <defs>
    <marker id="slArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="800" height="420" fill="#FFFFFF"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">SLAM — vòng phụ thuộc con gà quả trứng</text>

  <circle cx="250" cy="150" r="90" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="250" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A8A">Cần Bản đồ</text>
  <text x="250" y="158" text-anchor="middle" font-size="10" fill="#374151">để định vị</text>
  <text x="250" y="174" text-anchor="middle" font-size="10" fill="#374151">chính xác</text>

  <circle cx="550" cy="150" r="90" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="550" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Cần Vị trí</text>
  <text x="550" y="158" text-anchor="middle" font-size="10" fill="#374151">chính xác để</text>
  <text x="550" y="174" text-anchor="middle" font-size="10" fill="#374151">dựng bản đồ</text>

  <path d="M 320 110 A 200 80 0 0 1 480 110" fill="none" stroke="#111827" stroke-width="2" marker-end="url(#slArrow)"/>
  <path d="M 480 190 A 200 80 0 0 1 320 190" fill="none" stroke="#111827" stroke-width="2" marker-end="url(#slArrow)"/>
  <text x="400" y="80" text-anchor="middle" font-size="10" fill="#6B7280">SLAM giải đồng thời cả hai</text>

  <rect x="60" y="270" width="330" height="130" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="225" y="295" text-anchor="middle" font-size="12" font-weight="700" fill="#92400E">Front-end — Scan Matching</text>
  <text x="225" y="320" text-anchor="middle" font-size="10" fill="#374151">khớp scan mới với bản đồ cục bộ</text>
  <text x="225" y="338" text-anchor="middle" font-size="10" fill="#374151">chạy mỗi khi có dữ liệu mới</text>
  <text x="225" y="360" text-anchor="middle" font-size="9" fill="#7F1D1D">nhanh nhưng trôi dần</text>
  <text x="225" y="378" text-anchor="middle" font-size="9" fill="#7F1D1D">nếu không có back-end</text>

  <rect x="410" y="270" width="330" height="130" rx="10" fill="#FFEDD5" stroke="#F97316" stroke-width="2"/>
  <text x="575" y="295" text-anchor="middle" font-size="12" font-weight="700" fill="#9A3412">Back-end — Tối ưu toàn cục</text>
  <text x="575" y="320" text-anchor="middle" font-size="10" fill="#374151">nhìn lại toàn bộ quỹ đạo</text>
  <text x="575" y="338" text-anchor="middle" font-size="10" fill="#374151">loop closure → kéo về đúng vị trí</text>
  <text x="575" y="360" text-anchor="middle" font-size="9" fill="#166534">sửa sai trôi tích luỹ</text>
  <text x="575" y="378" text-anchor="middle" font-size="9" fill="#166534">nhưng chạy chậm hơn</text>
</svg>
