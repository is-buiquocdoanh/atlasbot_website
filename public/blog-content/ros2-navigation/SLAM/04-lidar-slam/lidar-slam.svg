<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Arial, sans-serif">
  <defs>
    <marker id="lsArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">ICP — xoay và dịch cho tới khi khớp</text>

  <text x="180" y="60" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">Trước (chưa khớp)</text>
  <g fill="#2563EB">
    <circle cx="100" cy="120" r="3"/><circle cx="130" cy="100" r="3"/><circle cx="160" cy="130" r="3"/>
    <circle cx="190" cy="105" r="3"/><circle cx="220" cy="140" r="3"/>
  </g>
  <text x="160" y="150" text-anchor="middle" font-size="8" fill="#1E3A8A">scan mới</text>
  <g fill="#F97316">
    <circle cx="115" cy="180" r="3"/><circle cx="145" cy="165" r="3"/><circle cx="175" cy="190" r="3"/>
    <circle cx="205" cy="170" r="3"/><circle cx="235" cy="200" r="3"/>
  </g>
  <text x="175" y="220" text-anchor="middle" font-size="8" fill="#9A3412">bản đồ tham chiếu</text>

  <line x1="300" y1="140" x2="360" y2="140" stroke="#111827" stroke-width="2" marker-end="url(#lsArrow)"/>
  <text x="330" y="128" text-anchor="middle" font-size="8" fill="#6B7280">lặp (R,t)</text>

  <text x="580" y="60" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">Sau (đã khớp)</text>
  <g fill="#2563EB" opacity="0.7">
    <circle cx="500" cy="180" r="3"/><circle cx="530" cy="165" r="3"/><circle cx="560" cy="190" r="3"/>
    <circle cx="590" cy="170" r="3"/><circle cx="620" cy="200" r="3"/>
  </g>
  <g fill="#F97316" opacity="0.7">
    <circle cx="502" cy="181" r="2.5"/><circle cx="532" cy="166" r="2.5"/><circle cx="561" cy="191" r="2.5"/>
    <circle cx="591" cy="171" r="2.5"/><circle cx="621" cy="201" r="2.5"/>
  </g>
  <text x="560" y="225" text-anchor="middle" font-size="8" fill="#166534">chồng khít — (R,t) hội tụ</text>

  <rect x="90" y="260" width="620" height="120" rx="10" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="285" text-anchor="middle" font-size="12" font-family="monospace" fill="#111827">R × scan_mới + t ≈ bản_đồ_tham_chiếu</text>
  <text x="400" y="310" text-anchor="middle" font-size="10" fill="#374151">ICP: ghép cặp điểm gần nhất → tối thiểu hoá khoảng cách → lặp lại</text>
  <text x="400" y="330" text-anchor="middle" font-size="10" fill="#374151">Correlative Scan Matching: thử lưới giả thuyết (R,t) → chọn điểm cao nhất</text>
  <text x="400" y="352" text-anchor="middle" font-size="9" fill="#7F1D1D">ICP dễ kẹt cực trị cục bộ nếu điểm khởi tạo xa lời giải đúng</text>
</svg>
