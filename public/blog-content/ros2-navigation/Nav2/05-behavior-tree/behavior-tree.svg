<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Arial, sans-serif">
  <defs>
    <marker id="btArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="800" height="420" fill="#FFFFFF"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Behavior Tree — Fallback ngoài, Sequence trong</text>

  <rect x="290" y="55" width="220" height="50" rx="8" fill="#EDE9FE" stroke="#9333EA" stroke-width="2"/>
  <text x="400" y="86" text-anchor="middle" font-size="12" font-weight="700" fill="#6B21A8">Fallback (?)</text>

  <line x1="350" y1="105" x2="250" y2="140" stroke="#111827" stroke-width="1.5" marker-end="url(#btArrow)"/>
  <line x1="450" y1="105" x2="600" y2="140" stroke="#111827" stroke-width="1.5" marker-end="url(#btArrow)"/>

  <rect x="90" y="145" width="320" height="60" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="250" y="170" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">PipelineSequence (→)</text>
  <text x="250" y="188" text-anchor="middle" font-size="9" fill="#374151">thử phương án chính trước</text>

  <line x1="180" y1="205" x2="180" y2="235" stroke="#111827" stroke-width="1.5" marker-end="url(#btArrow)"/>
  <line x1="320" y1="205" x2="320" y2="235" stroke="#111827" stroke-width="1.5" marker-end="url(#btArrow)"/>

  <rect x="90" y="240" width="160" height="50" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3"/>
  <text x="170" y="270" text-anchor="middle" font-size="9" font-family="monospace" fill="#111827">ComputePathToPose</text>

  <rect x="260" y="240" width="150" height="50" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3"/>
  <text x="335" y="270" text-anchor="middle" font-size="9" font-family="monospace" fill="#111827">FollowPath</text>

  <rect x="470" y="145" width="260" height="60" rx="8" fill="#FFEDD5" stroke="#F97316" stroke-width="2"/>
  <text x="600" y="170" text-anchor="middle" font-size="11" font-weight="700" fill="#9A3412">ReactiveFallback</text>
  <text x="600" y="188" text-anchor="middle" font-size="9" fill="#374151">nếu Sequence chính thất bại</text>

  <line x1="540" y1="205" x2="540" y2="235" stroke="#111827" stroke-width="1.5" marker-end="url(#btArrow)"/>
  <line x1="660" y1="205" x2="660" y2="235" stroke="#111827" stroke-width="1.5" marker-end="url(#btArrow)"/>

  <rect x="480" y="240" width="120" height="50" rx="6" fill="#FFFFFF" stroke="#F97316" stroke-width="1.3"/>
  <text x="540" y="270" text-anchor="middle" font-size="9" font-family="monospace" fill="#111827">Spin</text>

  <rect x="610" y="240" width="120" height="50" rx="6" fill="#FFFFFF" stroke="#F97316" stroke-width="1.3"/>
  <text x="670" y="270" text-anchor="middle" font-size="9" font-family="monospace" fill="#111827">Wait</text>

  <rect x="90" y="320" width="620" height="75" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="345" text-anchor="middle" font-size="10" fill="#111827">Sequence: dừng ngay khi 1 con FAILURE · Fallback: dừng ngay khi 1 con SUCCESS</text>
  <text x="400" y="365" text-anchor="middle" font-size="9" fill="#6B7280">Định nghĩa bằng XML — sửa cấu trúc không cần build lại code</text>
</svg>
