<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Arial, sans-serif">
  <defs>
    <marker id="rvArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Chuỗi thử recovery trước khi báo lỗi</text>

  <rect x="40" y="65" width="150" height="70" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  <text x="115" y="105" text-anchor="middle" font-size="11" font-weight="700" fill="#7F1D1D">Bị kẹt</text>

  <line x1="190" y1="100" x2="230" y2="100" stroke="#111827" stroke-width="2" marker-end="url(#rvArrow)"/>

  <rect x="235" y="65" width="140" height="70" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="305" y="105" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">Spin</text>

  <line x1="375" y1="100" x2="410" y2="100" stroke="#111827" stroke-width="2" marker-end="url(#rvArrow)"/>
  <text x="392" y="90" text-anchor="middle" font-size="8" fill="#7F1D1D">vẫn kẹt</text>

  <rect x="415" y="65" width="140" height="70" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="485" y="105" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">BackUp</text>

  <line x1="555" y1="100" x2="590" y2="100" stroke="#111827" stroke-width="2" marker-end="url(#rvArrow)"/>
  <text x="572" y="90" text-anchor="middle" font-size="8" fill="#7F1D1D">vẫn kẹt</text>

  <rect x="595" y="65" width="140" height="70" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="665" y="105" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">Wait</text>

  <line x1="115" y1="135" x2="115" y2="200" stroke="#111827" stroke-width="2"/>
  <line x1="115" y1="200" x2="665" y2="200" stroke="#111827" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="665" y1="200" x2="665" y2="230" stroke="#111827" stroke-width="2" marker-end="url(#rvArrow)"/>
  <text x="400" y="215" text-anchor="middle" font-size="9" fill="#6B7280">thử lại planner/controller sau mỗi bước recovery</text>

  <rect x="565" y="235" width="200" height="55" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  <text x="665" y="260" text-anchor="middle" font-size="10" font-weight="700" fill="#7F1D1D">Hết lần thử →</text>
  <text x="665" y="278" text-anchor="middle" font-size="10" font-weight="700" fill="#7F1D1D">FAILURE lên ứng dụng</text>

  <rect x="90" y="320" width="620" height="55" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="345" text-anchor="middle" font-size="10" fill="#111827">Recovery thay đổi TÌNH HUỐNG (góc nhìn, không gian, thời gian) — không sửa logic planner/controller</text>
  <text x="400" y="365" text-anchor="middle" font-size="9" fill="#6B7280">Phần lớn tình huống kẹt thực tế chỉ là tạm thời</text>
</svg>
