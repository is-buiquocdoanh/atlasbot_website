<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Arial, sans-serif">
  <rect width="800" height="420" fill="#FFFFFF"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Costmap — 3 lớp chồng lên nhau</text>

  <rect x="200" y="55" width="400" height="80" rx="8" fill="#F3F5F8" stroke="#6B7280" stroke-width="1.5"/>
  <text x="400" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Static Layer</text>
  <text x="400" y="100" text-anchor="middle" font-size="9" fill="#374151">từ occupancy grid (bản đồ SLAM) — chậm thay đổi</text>
  <rect x="230" y="110" width="340" height="15" fill="#111827"/>

  <text x="400" y="155" text-anchor="middle" font-size="14" fill="#6B7280">+</text>

  <rect x="200" y="165" width="400" height="80" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="400" y="190" text-anchor="middle" font-size="11" font-weight="700" fill="#7F1D1D">Obstacle Layer</text>
  <text x="400" y="210" text-anchor="middle" font-size="9" fill="#374151">LiDAR thời gian thực — người, vật mới xuất hiện</text>
  <rect x="380" y="220" width="25" height="15" fill="#DC2626"/>

  <text x="400" y="265" text-anchor="middle" font-size="14" fill="#6B7280">+</text>

  <rect x="200" y="275" width="400" height="80" rx="8" fill="#FFEDD5" stroke="#F97316" stroke-width="1.5"/>
  <text x="400" y="300" text-anchor="middle" font-size="11" font-weight="700" fill="#9A3412">Inflation Layer</text>
  <text x="400" y="320" text-anchor="middle" font-size="9" fill="#374151">phồng chi phí quanh vật cản, giảm dần theo khoảng cách</text>
  <radialGradient id="infl" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#DC2626" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#DC2626" stop-opacity="0"/>
  </radialGradient>
  <circle cx="392" cy="335" r="30" fill="url(#infl)"/>

  <rect x="640" y="165" width="130" height="190" rx="8" fill="#EDE9FE" stroke="#9333EA" stroke-width="1.3"/>
  <text x="705" y="190" text-anchor="middle" font-size="10" font-weight="700" fill="#6B21A8">cost cuối</text>
  <text x="705" y="205" text-anchor="middle" font-size="9" fill="#6B21A8">= MAX các lớp</text>
  <text x="705" y="235" text-anchor="middle" font-size="8" fill="#374151">Local costmap:</text>
  <text x="705" y="250" text-anchor="middle" font-size="8" fill="#374151">3x3m, tần số cao</text>
  <text x="705" y="275" text-anchor="middle" font-size="8" fill="#374151">Global costmap:</text>
  <text x="705" y="290" text-anchor="middle" font-size="8" fill="#374151">toàn bản đồ</text>
</svg>
