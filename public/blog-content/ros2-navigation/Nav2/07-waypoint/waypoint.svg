<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Arial, sans-serif">
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">waypoint_follower vs NavigateThroughPoses</text>

  <text x="200" y="65" text-anchor="middle" font-size="12" font-weight="700" fill="#2563EB">waypoint_follower (lặp NavigateToPose)</text>
  <circle cx="80" cy="150" r="8" fill="#2563EB"/>
  <text x="80" y="130" text-anchor="middle" font-size="8" fill="#1E3A8A">dừng hẳn</text>
  <line x1="88" y1="150" x2="180" y2="150" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="190" cy="150" r="8" fill="#2563EB"/>
  <text x="190" y="130" text-anchor="middle" font-size="8" fill="#1E3A8A">dừng hẳn</text>
  <line x1="198" y1="150" x2="290" y2="150" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="300" cy="150" r="8" fill="#2563EB"/>
  <text x="300" y="130" text-anchor="middle" font-size="8" fill="#1E3A8A">dừng hẳn</text>
  <text x="190" y="180" text-anchor="middle" font-size="8" fill="#6B7280">mỗi điểm = 1 nhiệm vụ độc lập, hoàn thành mới đi tiếp</text>

  <text x="600" y="65" text-anchor="middle" font-size="12" font-weight="700" fill="#16A34A">NavigateThroughPoses</text>
  <circle cx="480" cy="230" r="8" fill="#16A34A"/>
  <path d="M 480 230 Q 550 200 600 230 T 720 230" fill="none" stroke="#16A34A" stroke-width="2.5"/>
  <circle cx="600" cy="230" r="6" fill="#16A34A" opacity="0.6"/>
  <text x="600" y="215" text-anchor="middle" font-size="8" fill="#166534">điểm mốc, không dừng hẳn</text>
  <circle cx="720" cy="230" r="8" fill="#16A34A"/>
  <text x="600" y="260" text-anchor="middle" font-size="8" fill="#6B7280">đường đi liên tục qua tất cả điểm cùng lúc</text>

  <rect x="90" y="300" width="620" height="75" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="325" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">waypoint_task_executor: hành động tại mỗi điểm dừng</text>
  <text x="400" y="347" text-anchor="middle" font-size="9" fill="#374151">WaitAtWaypoint (mặc định) — tuỳ biến thành xác nhận thủ công, gửi tín hiệu ứng dụng</text>
  <text x="400" y="365" text-anchor="middle" font-size="9" fill="#6B7280">Route: Sequential · Loop · Confirm — cần thêm lớp ứng dụng quản lý</text>
</svg>
