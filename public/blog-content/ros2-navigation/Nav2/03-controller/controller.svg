<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Arial, sans-serif">
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">DWB vs MPPI — đơn vị lấy mẫu khác nhau</text>

  <text x="200" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#2563EB">DWB — lấy mẫu vận tốc</text>
  <circle cx="200" cy="250" r="8" fill="#2563EB"/>
  <g stroke="#9CA3AF" stroke-width="1.3">
    <line x1="200" y1="250" x2="150" y2="180"/>
    <line x1="200" y1="250" x2="180" y2="150"/>
    <line x1="200" y1="250" x2="220" y2="140"/>
    <line x1="200" y1="250" x2="260" y2="160"/>
    <line x1="200" y1="250" x2="270" y2="200"/>
  </g>
  <line x1="200" y1="250" x2="210" y2="145" stroke="#16A34A" stroke-width="2.5"/>
  <text x="230" y="130" text-anchor="middle" font-size="8" fill="#166534">vận tốc chọn (điểm cao nhất)</text>
  <text x="200" y="285" text-anchor="middle" font-size="8" fill="#6B7280">mẫu (v,ω) khả thi, mô phỏng ngắn</text>

  <text x="600" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#16A34A">MPPI — lấy mẫu quỹ đạo</text>
  <circle cx="450" cy="280" r="8" fill="#2563EB"/>
  <g stroke="#9CA3AF" stroke-width="1" opacity="0.6" fill="none">
    <path d="M 450 280 Q 550 220 650 100"/>
    <path d="M 450 280 Q 560 240 680 130"/>
    <path d="M 450 280 Q 540 200 620 90"/>
    <path d="M 450 280 Q 570 260 700 160"/>
  </g>
  <path d="M 450 280 Q 555 225 655 105" stroke="#16A34A" stroke-width="2.5" fill="none"/>
  <text x="600" y="200" text-anchor="middle" font-size="8" fill="#166534">quỹ đạo tổng hợp (weighted avg)</text>
  <text x="600" y="330" text-anchor="middle" font-size="8" fill="#6B7280">hàng trăm quỹ đạo, lặp tối ưu nhiều vòng</text>

  <rect x="90" y="345" width="620" height="45" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="372" text-anchor="middle" font-size="10" fill="#111827">DWB: CPU thuần (Raspberry Pi 4) · MPPI: cần GPU/nhiều nhân (Jetson Orin Nano)</text>
</svg>
