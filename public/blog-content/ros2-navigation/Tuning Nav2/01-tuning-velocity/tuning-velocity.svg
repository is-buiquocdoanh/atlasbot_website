<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Arial, sans-serif">
  <rect width="800" height="380" fill="#FFFFFF"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">max_vel_x — trần mềm, không phải trần cứng phần cứng</text>

  <line x1="80" y1="200" x2="720" y2="200" stroke="#9CA3AF" stroke-width="2"/>
  <text x="80" y="220" font-size="9" fill="#6B7280">0</text>

  <line x1="500" y1="150" x2="500" y2="250" stroke="#DC2626" stroke-width="2"/>
  <text x="500" y="140" text-anchor="middle" font-size="10" font-weight="700" fill="#DC2626">v_max thật (từ RPM động cơ)</text>

  <line x1="420" y1="170" x2="420" y2="230" stroke="#16A34A" stroke-width="2.5"/>
  <text x="420" y="160" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">max_vel_x đề xuất (~85%)</text>

  <rect x="90" y="260" width="280" height="90" rx="8" fill="#FFEDD5" stroke="#F97316" stroke-width="1.5"/>
  <text x="230" y="285" text-anchor="middle" font-size="10" font-weight="700" fill="#9A3412">max_vel_x quá cao</text>
  <text x="230" y="305" text-anchor="middle" font-size="9" fill="#7C2D12">lấy mẫu vận tốc không</text>
  <text x="230" y="320" text-anchor="middle" font-size="9" fill="#7C2D12">bao giờ đạt được thực tế,</text>
  <text x="230" y="335" text-anchor="middle" font-size="9" fill="#7C2D12">có thể gây trượt bánh</text>

  <rect x="430" y="260" width="280" height="90" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="570" y="285" text-anchor="middle" font-size="10" font-weight="700" fill="#1E3A8A">max_vel_x quá thấp</text>
  <text x="570" y="305" text-anchor="middle" font-size="9" fill="#374151">robot chậm chạp</text>
  <text x="570" y="320" text-anchor="middle" font-size="9" fill="#374151">không cần thiết dù</text>
  <text x="570" y="335" text-anchor="middle" font-size="9" fill="#374151">phần cứng còn dư khả năng</text>
</svg>
