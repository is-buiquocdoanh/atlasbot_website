<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Arial, sans-serif">
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">inflation_radius và cost_scaling_factor</text>

  <text x="200" y="60" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">cost_scaling_factor THẤP</text>
  <rect x="180" y="90" width="40" height="40" fill="#111827"/>
  <radialGradient id="lowscale" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#DC2626" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#DC2626" stop-opacity="0"/>
  </radialGradient>
  <circle cx="200" cy="110" r="90" fill="url(#lowscale)"/>
  <text x="200" y="220" text-anchor="middle" font-size="9" fill="#7F1D1D">giảm chậm — thận trọng vùng rộng</text>

  <text x="600" y="60" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">cost_scaling_factor CAO</text>
  <rect x="580" y="90" width="40" height="40" fill="#111827"/>
  <radialGradient id="highscale" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#DC2626" stop-opacity="0.9"/>
    <stop offset="60%" stop-color="#DC2626" stop-opacity="0.1"/>
    <stop offset="100%" stop-color="#DC2626" stop-opacity="0"/>
  </radialGradient>
  <circle cx="600" cy="110" r="90" fill="url(#highscale)"/>
  <text x="600" y="220" text-anchor="middle" font-size="9" fill="#166534">giảm nhanh — tận dụng lối hẹp</text>

  <rect x="90" y="255" width="620" height="70" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="280" text-anchor="middle" font-size="10" font-family="monospace" fill="#111827">cost = 253 × e^(−scale × (khoảng_cách − bán_kính))</text>
  <text x="400" y="303" text-anchor="middle" font-size="9" fill="#6B7280">inflation_radius = vùng ảnh hưởng rộng bao xa · cost_scaling_factor = giảm nhanh hay chậm</text>

  <rect x="90" y="335" width="620" height="45" rx="8" fill="#EDE9FE" stroke="#9333EA" stroke-width="1.3"/>
  <text x="400" y="362" text-anchor="middle" font-size="10" fill="#6B21A8">raytrace_range nên LỚN hơn obstacle_range — dễ xoá dấu vết cũ hơn là thêm dấu vết mới</text>
</svg>
