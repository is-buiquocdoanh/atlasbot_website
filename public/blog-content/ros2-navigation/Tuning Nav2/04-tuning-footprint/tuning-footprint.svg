<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Arial, sans-serif">
  <rect width="800" height="380" fill="#FFFFFF"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">robot_radius (tròn) vs footprint (đa giác)</text>

  <text x="200" y="65" text-anchor="middle" font-size="12" font-weight="700" fill="#DC2626">robot_radius — lãng phí không gian</text>
  <rect x="130" y="140" width="140" height="60" rx="6" fill="#2563EB" opacity="0.85"/>
  <circle cx="200" cy="170" r="80" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="200" y="270" text-anchor="middle" font-size="9" fill="#7F1D1D">vùng "thừa" bị coi là cần né</text>

  <text x="600" y="65" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">footprint — chính xác hình dạng thật</text>
  <rect x="530" y="140" width="140" height="60" rx="6" fill="#2563EB" opacity="0.85"/>
  <rect x="524" y="134" width="152" height="72" fill="none" stroke="#16A34A" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="600" y="270" text-anchor="middle" font-size="9" fill="#166534">lách qua không gian hẹp được</text>

  <rect x="90" y="300" width="620" height="65" rx="8" fill="#FFEDD5" stroke="#F97316" stroke-width="1.3"/>
  <text x="400" y="325" text-anchor="middle" font-size="10" font-weight="700" fill="#9A3412">Footprint nhỏ hơn thật nguy hiểm hơn lớn hơn thật</text>
  <text x="400" y="347" text-anchor="middle" font-size="9" fill="#7C2D12">luôn đo đạc chính xác + cộng biên độ an toàn (footprint_padding)</text>
</svg>
