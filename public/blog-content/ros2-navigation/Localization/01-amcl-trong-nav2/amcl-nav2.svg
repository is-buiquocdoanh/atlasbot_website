<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Arial, sans-serif">
  <defs>
    <marker id="anArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Set Pose — bước khởi động hay bị bỏ quên</text>

  <rect x="40" y="65" width="330" height="140" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  <text x="205" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#7F1D1D">Không set initial_pose</text>
  <g fill="#DC2626" opacity="0.6">
    <circle cx="80" cy="120" r="3"/><circle cx="140" cy="110" r="3"/><circle cx="200" cy="130" r="3"/>
    <circle cx="260" cy="115" r="3"/><circle cx="320" cy="140" r="3"/><circle cx="100" cy="160" r="3"/>
    <circle cx="180" cy="175" r="3"/><circle cx="250" cy="165" r="3"/><circle cx="310" cy="180" r="3"/>
  </g>
  <text x="205" y="195" text-anchor="middle" font-size="9" fill="#7F1D1D">hạt rải khắp bản đồ — hội tụ chậm</text>

  <rect x="430" y="65" width="330" height="140" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="595" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Có initial_pose (Set Pose)</text>
  <g fill="#16A34A" opacity="0.8">
    <circle cx="580" cy="140" r="3"/><circle cx="590" cy="135" r="3"/><circle cx="600" cy="145" r="3"/>
    <circle cx="595" cy="130" r="3"/><circle cx="585" cy="150" r="3"/>
  </g>
  <text x="595" y="195" text-anchor="middle" font-size="9" fill="#166534">hạt co cụm quanh vị trí đã biết — hội tụ nhanh</text>

  <rect x="90" y="230" width="620" height="60" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="253" text-anchor="middle" font-size="10" font-family="monospace" fill="#111827">ros2 topic pub /initialpose geometry_msgs/msg/PoseWithCovarianceStamped</text>
  <text x="400" y="273" text-anchor="middle" font-size="9" fill="#6B7280">hoặc "2D Pose Estimate" trong RViz2</text>

  <rect x="90" y="305" width="620" height="60" rx="8" fill="#EDE9FE" stroke="#9333EA" stroke-width="1.3"/>
  <text x="400" y="328" text-anchor="middle" font-size="10" font-weight="700" fill="#6B21A8">Theo dõi hội tụ: Display PoseArray trên topic /particlecloud (RViz2)</text>
  <text x="400" y="348" text-anchor="middle" font-size="9" fill="#6B7280">hạt vẫn rải rộng sau khi di chuyển = môi trường thiếu đặc trưng hoặc pose sai</text>
</svg>
