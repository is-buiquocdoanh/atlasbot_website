<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Arial, sans-serif">
  <defs>
    <marker id="rfArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">RF2O — Range Flow giữa 2 lần quét</text>

  <circle cx="200" cy="180" r="8" fill="#2563EB"/>
  <text x="200" y="205" text-anchor="middle" font-size="9" fill="#1E3A8A">t = 0</text>
  <g stroke="#2563EB" stroke-width="1.3">
    <line x1="200" y1="180" x2="120" y2="120"/>
    <line x1="200" y1="180" x2="150" y2="90"/>
    <line x1="200" y1="180" x2="280" y2="90"/>
    <line x1="200" y1="180" x2="320" y2="140"/>
  </g>
  <rect x="90" y="105" width="15" height="15" fill="#111827"/>
  <rect x="140" y="75" width="15" height="15" fill="#111827"/>
  <rect x="275" y="75" width="15" height="15" fill="#111827"/>
  <rect x="315" y="130" width="15" height="15" fill="#111827"/>

  <line x1="230" y1="180" x2="290" y2="180" stroke="#111827" stroke-width="2" marker-end="url(#rfArrow)"/>
  <text x="260" y="168" text-anchor="middle" font-size="8" fill="#6B7280">robot di chuyển</text>

  <circle cx="450" cy="200" r="8" fill="#16A34A"/>
  <text x="450" y="225" text-anchor="middle" font-size="9" fill="#166534">t = 1</text>
  <g stroke="#16A34A" stroke-width="1.3">
    <line x1="450" y1="200" x2="390" y2="130"/>
    <line x1="450" y1="200" x2="410" y2="95"/>
    <line x1="450" y1="200" x2="530" y2="95"/>
    <line x1="450" y1="200" x2="565" y2="150"/>
  </g>
  <rect x="90" y="105" width="15" height="15" fill="#111827" opacity="0.4"/>
  <rect x="140" y="75" width="15" height="15" fill="#111827" opacity="0.4"/>
  <rect x="275" y="75" width="15" height="15" fill="#111827" opacity="0.4"/>
  <rect x="315" y="130" width="15" height="15" fill="#111827" opacity="0.4"/>

  <text x="480" y="255" text-anchor="middle" font-size="9" fill="#7F1D1D">khoảng cách tới cùng vật cản thay đổi</text>
  <text x="480" y="270" text-anchor="middle" font-size="9" fill="#7F1D1D">→ suy ra (vx, vy, ω) của robot</text>

  <rect x="90" y="300" width="620" height="80" rx="10" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="325" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Độc lập hoàn toàn với cơ cấu truyền động</text>
  <text x="400" y="347" text-anchor="middle" font-size="10" fill="#374151">Không cần encoder — hữu ích chính xác khi bánh trượt (encoder "nói dối")</text>
  <text x="400" y="367" text-anchor="middle" font-size="9" fill="#6B7280">Cần môi trường đủ đặc trưng hình học để tính toán đáng tin cậy</text>
</svg>
