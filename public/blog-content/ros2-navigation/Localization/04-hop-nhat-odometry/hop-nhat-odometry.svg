<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Arial, sans-serif">
  <defs>
    <marker id="hnArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Ba nguồn, mỗi nguồn đóng góp đúng phần mạnh nhất</text>

  <rect x="40" y="65" width="210" height="100" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="145" y="90" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">Encoder</text>
  <text x="145" y="112" text-anchor="middle" font-size="9" fill="#166534">✓ x, y khi không trượt</text>
  <text x="145" y="130" text-anchor="middle" font-size="9" fill="#7F1D1D">✕ sai khi trượt bánh</text>

  <rect x="295" y="65" width="210" height="100" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="400" y="90" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">RF2O</text>
  <text x="400" y="112" text-anchor="middle" font-size="9" fill="#166534">✓ yaw, vyaw không phụ thuộc bánh</text>
  <text x="400" y="130" text-anchor="middle" font-size="9" fill="#7F1D1D">✕ cần môi trường đặc trưng</text>

  <rect x="550" y="65" width="210" height="100" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="655" y="90" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">IMU (gyro)</text>
  <text x="655" y="112" text-anchor="middle" font-size="9" fill="#166534">✓ vyaw phản ứng nhanh</text>
  <text x="655" y="130" text-anchor="middle" font-size="9" fill="#7F1D1D">✕ trôi nếu tích phân vị trí</text>

  <line x1="145" y1="165" x2="330" y2="230" stroke="#111827" stroke-width="1.5" marker-end="url(#hnArrow)"/>
  <line x1="400" y1="165" x2="400" y2="230" stroke="#111827" stroke-width="1.5" marker-end="url(#hnArrow)"/>
  <line x1="655" y1="165" x2="470" y2="230" stroke="#111827" stroke-width="1.5" marker-end="url(#hnArrow)"/>

  <rect x="290" y="235" width="220" height="65" rx="10" fill="#EDE9FE" stroke="#9333EA" stroke-width="2"/>
  <text x="400" y="262" text-anchor="middle" font-size="11" font-weight="700" fill="#6B21A8">EKF (robot_localization)</text>
  <text x="400" y="282" text-anchor="middle" font-size="9" fill="#374151">config chỉ định trường nào tin nguồn nào</text>

  <line x1="400" y1="300" x2="400" y2="325" stroke="#111827" stroke-width="2" marker-end="url(#hnArrow)"/>

  <rect x="280" y="330" width="240" height="45" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="400" y="358" text-anchor="middle" font-size="10" font-family="monospace" fill="#166534">/odometry/filtered</text>
</svg>
