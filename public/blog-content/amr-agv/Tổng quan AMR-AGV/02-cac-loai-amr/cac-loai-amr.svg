<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="Arial, sans-serif">
  <rect width="800" height="440" fill="#FFFFFF"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">5 loại AMR — phân loại theo cách chở hàng</text>

  <rect x="30" y="60" width="140" height="150" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="100" y="85" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">Conveyor-top</text>
  <rect x="55" y="100" width="90" height="16" fill="#2563EB" opacity="0.5"/>
  <rect x="55" y="120" width="90" height="45" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="100" y="185" text-anchor="middle" font-size="9" fill="#374151">bưu kiện, TMĐT</text>

  <rect x="185" y="60" width="140" height="150" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="255" y="85" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">Shelf-lifting</text>
  <rect x="210" y="95" width="90" height="55" fill="none" stroke="#16A34A" stroke-width="1.5"/>
  <line x1="210" y1="112" x2="300" y2="112" stroke="#16A34A" stroke-width="1"/>
  <line x1="210" y1="130" x2="300" y2="130" stroke="#16A34A" stroke-width="1"/>
  <rect x="230" y="155" width="50" height="25" rx="4" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
  <text x="255" y="185" text-anchor="middle" font-size="9" fill="#374151">nâng cả kệ hàng</text>

  <rect x="340" y="60" width="140" height="150" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="410" y="85" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">Tugger/Tow</text>
  <rect x="360" y="140" width="35" height="25" rx="4" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <line x1="395" y1="152" x2="415" y2="152" stroke="#D97706" stroke-width="1.5"/>
  <rect x="415" y="140" width="30" height="25" rx="3" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2" opacity="0.8"/>
  <line x1="445" y1="152" x2="460" y2="152" stroke="#D97706" stroke-width="1.5"/>
  <rect x="460" y="140" width="30" height="25" rx="3" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2" opacity="0.6"/>
  <text x="410" y="185" text-anchor="middle" font-size="9" fill="#374151">kéo xe goòng</text>

  <rect x="495" y="60" width="140" height="150" rx="10" fill="#FFEDD5" stroke="#F97316" stroke-width="2"/>
  <text x="565" y="85" text-anchor="middle" font-size="11" font-weight="700" fill="#9A3412">Forklift/Pallet</text>
  <rect x="530" y="130" width="60" height="40" rx="4" fill="#FFFFFF" stroke="#F97316" stroke-width="1.5"/>
  <line x1="520" y1="150" x2="530" y2="150" stroke="#F97316" stroke-width="3"/>
  <line x1="520" y1="160" x2="530" y2="160" stroke="#F97316" stroke-width="3"/>
  <text x="565" y="185" text-anchor="middle" font-size="9" fill="#374151">nâng pallet</text>

  <rect x="650" y="60" width="120" height="150" rx="10" fill="#EDE9FE" stroke="#9333EA" stroke-width="2"/>
  <text x="710" y="85" text-anchor="middle" font-size="11" font-weight="700" fill="#6B21A8">Mobile</text>
  <text x="710" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#6B21A8">Manipulator</text>
  <rect x="685" y="150" width="50" height="20" rx="4" fill="#FFFFFF" stroke="#9333EA" stroke-width="1.5"/>
  <line x1="700" y1="150" x2="700" y2="120" stroke="#9333EA" stroke-width="3"/>
  <line x1="700" y1="120" x2="725" y2="130" stroke="#9333EA" stroke-width="3"/>
  <text x="710" y="185" text-anchor="middle" font-size="9" fill="#374151">tay máy + đế</text>

  <rect x="90" y="240" width="620" height="150" rx="10" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="265" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Điểm chung — cùng "não", khác "thân"</text>
  <text x="400" y="290" text-anchor="middle" font-size="10" fill="#374151">Cả 5 loại đều dùng chung SLAM + Nav2 để định vị và điều hướng</text>
  <text x="400" y="310" text-anchor="middle" font-size="10" fill="#374151">Khác biệt nằm ở cơ cấu chở hàng (application layer) và cơ khí/hệ truyền động</text>
  <text x="400" y="335" text-anchor="middle" font-size="10" fill="#374151">Tải trọng tăng dần: Conveyor-top &lt; Shelf-lifting &lt; Mobile Manipulator</text>
  <text x="400" y="355" text-anchor="middle" font-size="10" fill="#374151">&lt; Tugger/Tow &lt; Forklift/Pallet (thường lớn nhất)</text>
</svg>
