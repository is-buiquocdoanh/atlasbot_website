<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Arial, sans-serif">
  <defs>
    <marker id="dlArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="800" height="420" fill="#FFFFFF"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Driver Layer — lớp phiên dịch firmware ↔ ROS2</text>

  <rect x="40" y="70" width="200" height="90" rx="10" fill="#FFEDD5" stroke="#F97316" stroke-width="2"/>
  <text x="140" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#9A3412">Firmware (MCU)</text>
  <text x="140" y="118" text-anchor="middle" font-size="9" fill="#374151">chỉ biết Serial byte</text>
  <text x="140" y="135" text-anchor="middle" font-size="9" font-family="monospace" fill="#374151">"e 1523 1489"</text>

  <line x1="240" y1="100" x2="330" y2="100" stroke="#111827" stroke-width="2" marker-end="url(#dlArrow)"/>
  <text x="285" y="90" text-anchor="middle" font-size="8" fill="#6B7280">parse</text>

  <rect x="335" y="70" width="230" height="90" rx="10" fill="#EDE9FE" stroke="#9333EA" stroke-width="2"/>
  <text x="450" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#6B21A8">Driver Layer</text>
  <text x="450" y="115" text-anchor="middle" font-size="9" fill="#374151">diff_serial_bridge</text>
  <text x="450" y="132" text-anchor="middle" font-size="9" fill="#374151">chỉ dịch — không có logic điều khiển</text>

  <line x1="565" y1="100" x2="655" y2="100" stroke="#111827" stroke-width="2" marker-end="url(#dlArrow)"/>
  <text x="610" y="90" text-anchor="middle" font-size="8" fill="#6B7280">publish</text>

  <rect x="660" y="70" width="110" height="90" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="715" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">ROS2</text>
  <text x="715" y="115" text-anchor="middle" font-size="8" fill="#374151">EncoderVals</text>
  <text x="715" y="130" text-anchor="middle" font-size="8" fill="#374151">(topic riêng)</text>

  <line x1="660" y1="190" x2="565" y2="190" stroke="#111827" stroke-width="2" marker-end="url(#dlArrow)"/>
  <text x="610" y="180" text-anchor="middle" font-size="8" fill="#6B7280">subscribe /cmd_vel</text>

  <rect x="335" y="200" width="230" height="60" rx="10" fill="#EDE9FE" stroke="#9333EA" stroke-width="2"/>
  <text x="450" y="235" text-anchor="middle" font-size="9" fill="#374151">tính PWM → đóng gói lệnh</text>

  <line x1="240" y1="230" x2="330" y2="230" stroke="#111827" stroke-width="2" marker-end="url(#dlArrow)"/>
  <text x="285" y="220" text-anchor="middle" font-size="8" fill="#6B7280">gửi</text>

  <rect x="40" y="200" width="200" height="60" rx="10" fill="#FFEDD5" stroke="#F97316" stroke-width="2"/>
  <text x="140" y="235" text-anchor="middle" font-size="9" font-family="monospace" fill="#374151">"o 100 100"</text>

  <rect x="90" y="300" width="620" height="100" rx="10" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="325" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Text đơn giản vs Binary</text>
  <text x="400" y="348" text-anchor="middle" font-size="10" fill="#374151">Text: dễ debug qua terminal, tốn băng thông hơn — hợp lý cho robot &lt;100Hz</text>
  <text x="400" y="366" text-anchor="middle" font-size="10" fill="#374151">Binary: nhanh, tiết kiệm — cần khi băng thông cao (ảnh, cảm biến tần số lớn)</text>
  <text x="400" y="388" text-anchor="middle" font-size="9" fill="#6B7280">Luôn cần: timeout + checksum để phát hiện mất gói dữ liệu</text>
</svg>
