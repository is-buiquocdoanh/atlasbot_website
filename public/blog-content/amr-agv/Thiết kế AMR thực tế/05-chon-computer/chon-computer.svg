<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Arial, sans-serif">
  <defs>
    <marker id="ccpArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="800" height="420" fill="#FFFFFF"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Câu hỏi quyết định: có cần GPU song song với SLAM/Nav2?</text>

  <rect x="300" y="60" width="200" height="55" rx="8" fill="#F3F5F8" stroke="#6B7280" stroke-width="1.5"/>
  <text x="400" y="92" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Cần AI thị giác</text>
  <text x="400" y="107" text-anchor="middle" font-size="9" fill="#6B7280">(YOLO, deep learning)?</text>

  <line x1="360" y1="115" x2="220" y2="160" stroke="#111827" stroke-width="2" marker-end="url(#ccpArrow)"/>
  <text x="270" y="135" font-size="9" fill="#7F1D1D">Không</text>
  <line x1="440" y1="115" x2="580" y2="160" stroke="#111827" stroke-width="2" marker-end="url(#ccpArrow)"/>
  <text x="530" y="135" font-size="9" fill="#166534">Có</text>

  <rect x="60" y="165" width="330" height="180" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="225" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A8A">Raspberry Pi 4</text>
  <text x="225" y="215" text-anchor="middle" font-size="10" fill="#374151">4 nhân CPU, không có CUDA</text>
  <text x="225" y="235" text-anchor="middle" font-size="10" fill="#166534">SLAM + Nav2 chạy ổn định</text>
  <text x="225" y="255" text-anchor="middle" font-size="10" fill="#166534">rẻ hơn, tiêu thụ điện thấp hơn</text>
  <text x="225" y="285" text-anchor="middle" font-size="9" fill="#6B7280">Robot Mecanum, Diff Robot</text>
  <text x="225" y="300" text-anchor="middle" font-size="9" fill="#6B7280">(showcase dự án)</text>

  <rect x="410" y="165" width="330" height="180" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="575" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Jetson Orin Nano</text>
  <text x="575" y="215" text-anchor="middle" font-size="10" fill="#374151">6 nhân CPU + GPU Ampere/CUDA</text>
  <text x="575" y="235" text-anchor="middle" font-size="10" fill="#166534">SLAM+Nav2+YOLO cùng lúc</text>
  <text x="575" y="255" text-anchor="middle" font-size="10" fill="#7F1D1D">đắt hơn, tiêu thụ điện cao hơn</text>
  <text x="575" y="285" text-anchor="middle" font-size="9" fill="#6B7280">Atlas A2 (showcase dự án)</text>

  <rect x="90" y="365" width="620" height="40" rx="8" fill="#FFEDD5" stroke="#F97316" stroke-width="1.3"/>
  <text x="400" y="390" text-anchor="middle" font-size="10" fill="#9A3412">Cả 2 đều KHÔNG thay thế MCU (STM32/ESP32) cho vòng điều khiển động cơ realtime</text>
</svg>
