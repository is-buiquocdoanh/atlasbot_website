<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Arial, sans-serif">
  <rect width="800" height="420" fill="#FFFFFF"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Cân bằng độ phân giải encoder</text>

  <text x="200" y="65" text-anchor="middle" font-size="12" font-weight="700" fill="#DC2626">Quá thấp — giật cục</text>
  <path d="M 60 200 L 100 200 L 100 150 L 140 150 L 140 190 L 180 190 L 180 130 L 220 130 L 220 170 L 260 170 L 260 110 L 300 110" fill="none" stroke="#DC2626" stroke-width="2"/>
  <text x="180" y="230" text-anchor="middle" font-size="9" fill="#7F1D1D">dữ liệu tốc độ "bậc thang"</text>

  <text x="600" y="65" text-anchor="middle" font-size="12" font-weight="700" fill="#16A34A">Vừa đủ — mượt</text>
  <path d="M 500 200 Q 540 130 580 140 T 660 100 T 740 90" fill="none" stroke="#16A34A" stroke-width="2"/>
  <text x="600" y="230" text-anchor="middle" font-size="9" fill="#166534">theo kịp chu kỳ PID</text>

  <rect x="90" y="260" width="620" height="60" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="285" text-anchor="middle" font-size="12" font-family="monospace" fill="#111827">độ phân giải hiệu dụng = xung/vòng động cơ × tỉ số truyền hộp số</text>
  <text x="400" y="305" text-anchor="middle" font-size="10" fill="#6B7280">encoder 12 xung/vòng × hộp số 1:150 = 1800 xung/vòng tại bánh xe</text>

  <rect x="90" y="330" width="620" height="75" rx="8" fill="#FFEDD5" stroke="#F97316" stroke-width="1.3"/>
  <text x="400" y="353" text-anchor="middle" font-size="11" font-weight="700" fill="#9A3412">f_ngắt = (RPM/60) × độ_phân_giải × 4  (x4 decoding)</text>
  <text x="400" y="373" text-anchor="middle" font-size="10" fill="#7C2D12">Quá cao → vượt khả năng xử lý ngắt thời gian thực của MCU</text>
  <text x="400" y="391" text-anchor="middle" font-size="10" fill="#7C2D12">120 RPM × 1800 xung/vòng × 4 ≈ 14,400 ngắt/giây</text>
</svg>
