<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Arial, sans-serif">
  <defs>
    <marker id="cmoArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="800" height="420" fill="#FFFFFF"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Quy trình chọn động cơ: 2 công thức</text>

  <rect x="60" y="60" width="330" height="140" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="225" y="85" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A8A">Bước 1 — Tốc độ tối đa</text>
  <text x="225" y="115" text-anchor="middle" font-size="12" font-family="monospace" fill="#111827">v = ω × r</text>
  <text x="225" y="140" text-anchor="middle" font-size="10" fill="#374151">120 RPM, r=0.0325m</text>
  <text x="225" y="160" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">→ v_max ≈ 0.41 m/s</text>
  <text x="225" y="182" text-anchor="middle" font-size="9" fill="#6B7280">RPM cao hơn → mô-men thường thấp hơn</text>

  <rect x="410" y="60" width="330" height="140" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="575" y="85" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Bước 2 — Mô-men cần thiết</text>
  <text x="575" y="115" text-anchor="middle" font-size="11" font-family="monospace" fill="#111827">T = (m·g·μ·r) / n</text>
  <text x="575" y="140" text-anchor="middle" font-size="10" fill="#374151">3kg, μ=0.6, 2 bánh</text>
  <text x="575" y="160" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">→ T ≈ 2.93 kgf·cm/bánh</text>
  <text x="575" y="182" text-anchor="middle" font-size="9" fill="#6B7280">so với stall torque datasheet</text>

  <line x1="400" y1="200" x2="400" y2="230" stroke="#111827" stroke-width="2" marker-end="url(#cmoArrow)"/>

  <rect x="150" y="235" width="500" height="80" rx="10" fill="#FFEDD5" stroke="#F97316" stroke-width="2"/>
  <text x="400" y="260" text-anchor="middle" font-size="12" font-weight="700" fill="#9A3412">Chọn động cơ có stall torque ≥ 2-3× T yêu cầu</text>
  <text x="400" y="282" text-anchor="middle" font-size="10" fill="#7C2D12">Biên độ dự phòng cho: leo dốc, khởi động gấp, chở tải, ma sát cao hơn giả định</text>
  <text x="400" y="300" text-anchor="middle" font-size="9" fill="#7C2D12">Stall torque = giá trị tại tốc độ 0, KHÔNG phải mô-men liên tục lúc đang chạy</text>

  <rect x="90" y="335" width="620" height="55" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="358" text-anchor="middle" font-size="10" fill="#111827">Ví dụ thực tế: động cơ GA25 120RPM trong dự án Diff Robot</text>
  <text x="400" y="376" text-anchor="middle" font-size="9" fill="#6B7280">stall torque 7.3 kgf·cm cao hơn nhiều mức yêu cầu 2.93 kgf·cm — biên độ dự phòng tốt</text>
</svg>
