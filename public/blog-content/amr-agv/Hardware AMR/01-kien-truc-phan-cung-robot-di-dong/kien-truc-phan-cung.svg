<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#FFFFFF"/>

  <!-- Center: MCU/SBC -->
  <rect x="320" y="180" width="160" height="90" rx="10" fill="#2563EB" opacity="0.08" stroke="#2563EB" stroke-width="2.5"/>
  <text x="400" y="215" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">MCU / SBC</text>
  <text x="400" y="235" text-anchor="middle" font-size="12" fill="#6B7280">Bộ xử lý trung tâm</text>
  <text x="400" y="252" text-anchor="middle" font-size="11" fill="#6B7280">(STM32 / ESP32 / Jetson...)</text>

  <!-- Nguồn (top-left) -->
  <rect x="60" y="40" width="180" height="70" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="150" y="70" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Nguồn</text>
  <text x="150" y="90" text-anchor="middle" font-size="11" fill="#6B7280">Pin Li-ion + mạch BMS</text>
  <line x1="150" y1="110" x2="150" y2="150" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow1)"/>
  <line x1="150" y1="150" x2="320" y2="205" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow1)"/>

  <!-- Cam bien (top-right) -->
  <rect x="560" y="40" width="200" height="90" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="660" y="65" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Cảm biến</text>
  <text x="660" y="85" text-anchor="middle" font-size="11" fill="#6B7280">IMU, Encoder,</text>
  <text x="660" y="102" text-anchor="middle" font-size="11" fill="#6B7280">LiDAR, Ultrasonic...</text>
  <line x1="620" y1="130" x2="460" y2="195" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow1)"/>

  <!-- Giao tiep (right) -->
  <rect x="590" y="200" width="170" height="70" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="675" y="228" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Giao tiếp</text>
  <text x="675" y="248" text-anchor="middle" font-size="11" fill="#6B7280">WiFi / UART / CAN</text>
  <line x1="590" y1="230" x2="480" y2="220" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow1)"/>

  <!-- Driver dong co (bottom) -->
  <rect x="320" y="330" width="160" height="70" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="358" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Driver động cơ</text>
  <text x="400" y="378" text-anchor="middle" font-size="11" fill="#6B7280">Mạch cầu H / ESC</text>
  <line x1="400" y1="270" x2="400" y2="325" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow1)"/>

  <!-- Dong co (further bottom, split left/right wheels) -->
  <rect x="120" y="330" width="150" height="70" rx="8" fill="#F97316" opacity="0.08" stroke="#F97316" stroke-width="2"/>
  <text x="195" y="360" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Động cơ trái</text>
  <text x="195" y="378" text-anchor="middle" font-size="11" fill="#6B7280">+ Encoder</text>
  <line x1="320" y1="365" x2="270" y2="365" stroke="#F97316" stroke-width="2" marker-end="url(#arrow1)"/>

  <rect x="530" y="330" width="150" height="70" rx="8" fill="#F97316" opacity="0.08" stroke="#F97316" stroke-width="2"/>
  <text x="605" y="360" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Động cơ phải</text>
  <text x="605" y="378" text-anchor="middle" font-size="11" fill="#6B7280">+ Encoder</text>
  <line x1="480" y1="365" x2="530" y2="365" stroke="#F97316" stroke-width="2" marker-end="url(#arrow1)"/>

  <text x="400" y="430" text-anchor="middle" font-size="12" fill="#6B7280">Sơ đồ khối phần cứng cơ bản của một robot di động tự hành</text>
</svg>
