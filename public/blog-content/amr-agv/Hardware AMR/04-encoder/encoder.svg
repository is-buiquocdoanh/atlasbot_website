<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Arial, sans-serif">
  <rect width="800" height="420" fill="#FFFFFF"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Quadrature Encoder — 2 kênh lệch pha 90°</text>

  <!-- encoder disc -->
  <circle cx="150" cy="170" r="70" fill="#F3F5F8" stroke="#111827" stroke-width="2"/>
  <g stroke="#111827" stroke-width="3">
    <line x1="150" y1="100" x2="150" y2="115"/>
    <line x1="199" y1="121" x2="189" y2="131"/>
    <line x1="220" y1="170" x2="205" y2="170"/>
    <line x1="199" y1="219" x2="189" y2="209"/>
    <line x1="150" y1="240" x2="150" y2="225"/>
    <line x1="101" y1="219" x2="111" y2="209"/>
    <line x1="80" y1="170" x2="95" y2="170"/>
    <line x1="101" y1="121" x2="111" y2="131"/>
  </g>
  <circle cx="150" cy="170" r="5" fill="#2563EB"/>
  <rect x="205" y="160" width="12" height="20" fill="#F97316"/>
  <text x="211" y="200" text-anchor="middle" font-size="8" fill="#9A3412">kênh A</text>
  <rect x="185" y="195" width="12" height="20" fill="#16A34A" transform="rotate(30 191 205)"/>
  <text x="230" y="230" text-anchor="middle" font-size="8" fill="#166534">kênh B (lệch 90°)</text>

  <!-- waveforms -->
  <text x="500" y="90" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Quay chiều thuận</text>
  <path d="M 320 110 L 320 130 L 360 130 L 360 110 L 400 110 L 400 130 L 440 130 L 440 110 L 480 110 L 480 130 L 520 130 L 520 110" fill="none" stroke="#F97316" stroke-width="2"/>
  <text x="300" y="123" text-anchor="end" font-size="9" fill="#F97316">A</text>
  <path d="M 330 150 L 330 170 L 370 170 L 370 150 L 410 150 L 410 170 L 450 170 L 450 150 L 490 150 L 490 170 L 530 170" fill="none" stroke="#16A34A" stroke-width="2"/>
  <text x="300" y="163" text-anchor="end" font-size="9" fill="#16A34A">B</text>
  <text x="420" y="195" text-anchor="middle" font-size="9" fill="#F97316">A đổi mức TRƯỚC B</text>

  <text x="500" y="240" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Quay chiều nghịch</text>
  <path d="M 320 260 L 320 280 L 360 280 L 360 260 L 400 260 L 400 280 L 440 280 L 440 260 L 480 260 L 480 280 L 520 280 L 520 260" fill="none" stroke="#F97316" stroke-width="2"/>
  <text x="300" y="273" text-anchor="end" font-size="9" fill="#F97316">A</text>
  <path d="M 310 300 L 310 320 L 350 320 L 350 300 L 390 300 L 390 320 L 430 320 L 430 300 L 470 300 L 470 320 L 510 320" fill="none" stroke="#16A34A" stroke-width="2"/>
  <text x="300" y="313" text-anchor="end" font-size="9" fill="#16A34A">B</text>
  <text x="420" y="345" text-anchor="middle" font-size="9" fill="#16A34A">B đổi mức TRƯỚC A</text>

  <rect x="90" y="365" width="620" height="40" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="390" text-anchor="middle" font-size="10" fill="#111827">So thứ tự cạnh A/B → biết ngay chiều quay, không chỉ tốc độ</text>
</svg>
