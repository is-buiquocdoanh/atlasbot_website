<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Arial, sans-serif">
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Ba loại động cơ phổ biến trong AMR</text>

  <rect x="40" y="65" width="220" height="200" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="150" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A8A">DC chổi than</text>
  <circle cx="150" cy="140" r="30" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <circle cx="150" cy="140" r="8" fill="#2563EB"/>
  <text x="150" y="188" text-anchor="middle" font-size="9" fill="#374151">PWM đơn giản</text>
  <text x="150" y="204" text-anchor="middle" font-size="9" fill="#166534">rẻ, dễ điều khiển</text>
  <text x="150" y="220" text-anchor="middle" font-size="9" fill="#7F1D1D">mòn chổi than</text>
  <text x="150" y="245" text-anchor="middle" font-size="8" fill="#6B7280">Mecanum, Diff Robot</text>

  <rect x="290" y="65" width="220" height="200" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="400" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Brushless (BLDC)</text>
  <circle cx="400" cy="140" r="30" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/>
  <path d="M 400 110 L 405 135 L 430 140 L 405 145 L 400 170 L 395 145 L 370 140 L 395 135 Z" fill="#16A34A" opacity="0.3"/>
  <text x="400" y="188" text-anchor="middle" font-size="9" fill="#374151">cần ESC chuyên dụng</text>
  <text x="400" y="204" text-anchor="middle" font-size="9" fill="#166534">hiệu suất cao, bền</text>
  <text x="400" y="220" text-anchor="middle" font-size="9" fill="#7F1D1D">driver phức tạp hơn</text>
  <text x="400" y="245" text-anchor="middle" font-size="8" fill="#6B7280">Atlas A2 (TODE + TSDA-C12D)</text>

  <rect x="540" y="65" width="220" height="200" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="650" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#92400E">Servo</text>
  <circle cx="650" cy="140" r="30" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  <path d="M 650 140 L 650 115 A 25 25 0 0 1 670 150 Z" fill="#D97706" opacity="0.4"/>
  <text x="650" y="188" text-anchor="middle" font-size="9" fill="#374151">PID vị trí tích hợp sẵn</text>
  <text x="650" y="204" text-anchor="middle" font-size="9" fill="#166534">dễ dùng, chỉ cần góc đích</text>
  <text x="650" y="220" text-anchor="middle" font-size="9" fill="#7F1D1D">thường giới hạn góc quay</text>
  <text x="650" y="245" text-anchor="middle" font-size="8" fill="#6B7280">khớp tay máy, không phải bánh xe</text>

  <rect x="90" y="290" width="620" height="70" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="315" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Không có lựa chọn "tốt nhất" tuyệt đối</text>
  <text x="400" y="337" text-anchor="middle" font-size="10" fill="#6B7280">Chỉ có lựa chọn phù hợp với ngân sách, tuổi thọ yêu cầu, và độ phức tạp driver chấp nhận được</text>
</svg>
