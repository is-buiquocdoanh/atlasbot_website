<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Arial, sans-serif">
  <rect width="800" height="420" fill="#FFFFFF"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Mạch cầu H — đảo chiều động cơ bằng 4 công tắc</text>

  <!-- H-bridge diagram -->
  <line x1="150" y1="80" x2="150" y2="280" stroke="#111827" stroke-width="2"/>
  <line x1="550" y1="80" x2="550" y2="280" stroke="#111827" stroke-width="2"/>
  <text x="150" y="70" text-anchor="middle" font-size="10" fill="#6B7280">V+</text>
  <text x="550" y="70" text-anchor="middle" font-size="10" fill="#6B7280">V+</text>

  <rect x="120" y="100" width="60" height="30" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="150" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">Q1</text>

  <rect x="120" y="220" width="60" height="30" rx="4" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  <text x="150" y="240" text-anchor="middle" font-size="11" font-weight="700" fill="#7F1D1D">Q3</text>

  <rect x="520" y="100" width="60" height="30" rx="4" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  <text x="550" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#7F1D1D">Q2</text>

  <rect x="520" y="220" width="60" height="30" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="550" y="240" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">Q4</text>

  <line x1="150" y1="130" x2="150" y2="220" stroke="#111827" stroke-width="1.5"/>
  <line x1="550" y1="130" x2="550" y2="220" stroke="#111827" stroke-width="1.5"/>

  <!-- motor in middle -->
  <circle cx="350" cy="175" r="40" fill="#F3F5F8" stroke="#111827" stroke-width="2"/>
  <text x="350" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">M</text>
  <line x1="180" y1="115" x2="310" y2="160" stroke="#2563EB" stroke-width="2" marker-end="url(#mdArrow)"/>
  <line x1="390" y1="190" x2="520" y2="235" stroke="#2563EB" stroke-width="2" marker-end="url(#mdArrow)"/>
  <text x="350" y="125" text-anchor="middle" font-size="9" fill="#2563EB">Q1+Q4 đóng → quay chiều A</text>

  <defs>
    <marker id="mdArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
  </defs>

  <line x1="150" y1="280" x2="550" y2="280" stroke="#111827" stroke-width="2"/>
  <text x="350" y="298" text-anchor="middle" font-size="10" fill="#6B7280">GND</text>

  <rect x="90" y="320" width="620" height="80" rx="8" fill="#FFEDD5" stroke="#F97316" stroke-width="1.3"/>
  <text x="400" y="345" text-anchor="middle" font-size="11" font-weight="700" fill="#9A3412">Nguy hiểm: đóng Q1+Q3 (hoặc Q2+Q4) cùng lúc = ngắn mạch</text>
  <text x="400" y="365" text-anchor="middle" font-size="10" fill="#7C2D12">Dòng tăng vọt tức thời → cháy MOSFET. IC driver có sẵn (L298N, TB6612...)</text>
  <text x="400" y="383" text-anchor="middle" font-size="10" fill="#7C2D12">đã có mạch bảo vệ chống lỗi này — nên dùng thay vì tự ráp 4 MOSFET rời</text>
</svg>
