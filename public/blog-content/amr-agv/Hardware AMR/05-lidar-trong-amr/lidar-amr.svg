<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Arial, sans-serif">
  <rect width="800" height="420" fill="#FFFFFF"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Vị trí lắp LiDAR quyết định vùng mù</text>

  <!-- robot side profile low mount -->
  <text x="200" y="65" text-anchor="middle" font-size="12" font-weight="700" fill="#2563EB">LiDAR gắn thấp</text>
  <rect x="120" y="220" width="160" height="60" rx="8" fill="#F3F5F8" stroke="#111827" stroke-width="2"/>
  <circle cx="150" cy="290" r="12" fill="#111827"/>
  <circle cx="250" cy="290" r="12" fill="#111827"/>
  <circle cx="130" cy="215" r="6" fill="#2563EB"/>
  <line x1="130" y1="215" x2="60" y2="215" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="3 2"/>
  <line x1="130" y1="215" x2="330" y2="215" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="3 2"/>
  <!-- low obstacle detected -->
  <rect x="330" y="200" width="12" height="20" fill="#16A34A"/>
  <text x="336" y="195" text-anchor="middle" font-size="8" fill="#166534">thấy</text>
  <!-- high obstacle missed -->
  <rect x="330" y="120" width="60" height="15" fill="#DC2626" opacity="0.6"/>
  <text x="360" y="112" text-anchor="middle" font-size="8" fill="#7F1D1D">vùng mù (bàn cao)</text>
  <line x1="330" y1="127" x2="270" y2="220" stroke="#DC2626" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- robot side profile high mount -->
  <text x="600" y="65" text-anchor="middle" font-size="12" font-weight="700" fill="#16A34A">LiDAR gắn cao</text>
  <rect x="520" y="220" width="160" height="60" rx="8" fill="#F3F5F8" stroke="#111827" stroke-width="2"/>
  <circle cx="550" cy="290" r="12" fill="#111827"/>
  <circle cx="650" cy="290" r="12" fill="#111827"/>
  <circle cx="600" cy="200" r="8" fill="#16A34A"/>
  <line x1="600" y1="200" x2="530" y2="200" stroke="#16A34A" stroke-width="1.5" stroke-dasharray="3 2"/>
  <line x1="600" y1="200" x2="730" y2="130" stroke="#16A34A" stroke-width="1.5" stroke-dasharray="3 2"/>
  <!-- high obstacle detected -->
  <rect x="730" y="115" width="50" height="15" fill="#16A34A"/>
  <text x="755" y="108" text-anchor="middle" font-size="8" fill="#166534">thấy</text>
  <!-- low obstacle missed -->
  <rect x="700" y="270" width="15" height="18" fill="#DC2626" opacity="0.6"/>
  <text x="707" y="305" text-anchor="middle" font-size="8" fill="#7F1D1D">vùng mù (chân bàn)</text>

  <rect x="90" y="330" width="620" height="75" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="355" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Nhiều AMR công nghiệp dùng 2 LiDAR ở 2 độ cao</text>
  <text x="400" y="377" text-anchor="middle" font-size="10" fill="#6B7280">bù trừ vùng mù cho nhau — đánh đổi chi phí gấp đôi lấy vùng phủ an toàn tốt hơn</text>
  <text x="400" y="394" text-anchor="middle" font-size="9" fill="#6B7280">LiDAR vẫn cần Bumper/Ultrasonic bổ trợ — có vùng chết sát thân và điểm mù với vật trong suốt</text>
</svg>
