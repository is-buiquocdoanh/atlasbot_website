<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Arial, sans-serif">
  <defs>
    <marker id="beArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="800" height="420" fill="#FFFFFF"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Bốn lớp phòng thủ an toàn, nối tiếp nhau</text>

  <rect x="60" y="60" width="680" height="55" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="400" y="92" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">1. LiDAR + Nav2 costmap — né vật cản từ xa (phụ thuộc phần mềm)</text>

  <line x1="400" y1="115" x2="400" y2="140" stroke="#111827" stroke-width="2" marker-end="url(#beArrow)"/>
  <text x="420" y="130" font-size="9" fill="#6B7280">nếu bỏ sót...</text>

  <rect x="60" y="145" width="680" height="55" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="400" y="177" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">2. Camera + YOLO — phân loại, điều chỉnh khoảng cách (phụ thuộc phần mềm)</text>

  <line x1="400" y1="200" x2="400" y2="225" stroke="#111827" stroke-width="2" marker-end="url(#beArrow)"/>
  <text x="420" y="215" font-size="9" fill="#6B7280">nếu vẫn va chạm...</text>

  <rect x="60" y="230" width="680" height="55" rx="8" fill="#FFEDD5" stroke="#F97316" stroke-width="2"/>
  <text x="400" y="262" text-anchor="middle" font-size="11" font-weight="700" fill="#9A3412">3. Bumper — phát hiện va chạm vật lý thực tế (một phần qua firmware)</text>

  <line x1="400" y1="285" x2="400" y2="310" stroke="#111827" stroke-width="2" marker-end="url(#beArrow)"/>
  <text x="420" y="300" font-size="9" fill="#6B7280">nếu vẫn nguy hiểm...</text>

  <rect x="60" y="315" width="680" height="55" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="400" y="347" text-anchor="middle" font-size="12" font-weight="700" fill="#7F1D1D">4. E-Stop — cắt nguồn động cơ trực tiếp (KHÔNG qua phần mềm)</text>

  <rect x="150" y="385" width="500" height="30" rx="6" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="405" text-anchor="middle" font-size="10" fill="#111827">Lớp sau chỉ cần hoạt động khi lớp trước thất bại — không thay thế nhau</text>
</svg>
