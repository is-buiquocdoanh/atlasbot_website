<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Arial, sans-serif">
  <rect width="800" height="460" fill="#FFFFFF"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">4 hệ truyền động AMR</text>

  <!-- Differential -->
  <rect x="30" y="60" width="175" height="180" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="117" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">Differential</text>
  <rect x="70" y="120" width="95" height="55" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="55" y="130" width="14" height="35" fill="#111827"/>
  <rect x="166" y="130" width="14" height="35" fill="#111827"/>
  <text x="117" y="200" text-anchor="middle" font-size="9" fill="#166534">2 động cơ</text>
  <text x="117" y="216" text-anchor="middle" font-size="9" fill="#7F1D1D">không đi ngang</text>

  <!-- Mecanum -->
  <rect x="215" y="60" width="175" height="180" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="302" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">Mecanum</text>
  <rect x="255" y="115" width="95" height="65" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
  <rect x="240" y="120" width="14" height="25" fill="#111827"/>
  <rect x="351" y="120" width="14" height="25" fill="#111827"/>
  <rect x="240" y="155" width="14" height="25" fill="#111827"/>
  <rect x="351" y="155" width="14" height="25" fill="#111827"/>
  <text x="302" y="200" text-anchor="middle" font-size="9" fill="#166534">4 động cơ, đi ngang</text>
  <text x="302" y="216" text-anchor="middle" font-size="9" fill="#7F1D1D">odometry kém hơn</text>

  <!-- Omni 3-wheel -->
  <rect x="400" y="60" width="175" height="180" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="487" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">Omni 3 bánh</text>
  <circle cx="487" cy="150" r="35" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <rect x="480" y="118" width="14" height="14" fill="#111827"/>
  <rect x="450" y="165" width="14" height="14" fill="#111827" transform="rotate(-30 457 172)"/>
  <rect x="510" y="165" width="14" height="14" fill="#111827" transform="rotate(30 517 172)"/>
  <text x="487" y="200" text-anchor="middle" font-size="9" fill="#166534">3 động cơ, đi ngang</text>
  <text x="487" y="216" text-anchor="middle" font-size="9" fill="#7F1D1D">nhạy tải lệch tâm</text>

  <!-- Ackermann -->
  <rect x="585" y="60" width="185" height="180" rx="10" fill="#FFEDD5" stroke="#F97316" stroke-width="2"/>
  <text x="677" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#9A3412">Ackermann</text>
  <rect x="637" y="120" width="80" height="55" rx="8" fill="#FFFFFF" stroke="#F97316" stroke-width="1.5"/>
  <rect x="622" y="130" width="14" height="15" fill="#111827" transform="rotate(20 629 137)"/>
  <rect x="722" y="130" width="14" height="15" fill="#111827" transform="rotate(-20 729 137)"/>
  <rect x="622" y="150" width="14" height="15" fill="#111827"/>
  <rect x="722" y="150" width="14" height="15" fill="#111827"/>
  <text x="677" y="200" text-anchor="middle" font-size="9" fill="#166534">ổn định tốc độ cao</text>
  <text x="677" y="216" text-anchor="middle" font-size="9" fill="#7F1D1D">không xoay tại chỗ</text>

  <rect x="90" y="270" width="620" height="160" rx="10" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="295" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Khi phân vân — bắt đầu từ Differential Drive</text>
  <text x="400" y="320" text-anchor="middle" font-size="10" fill="#374151">Đơn giản để debug · odometry tốt nhất · nền tảng so sánh trước khi</text>
  <text x="400" y="338" text-anchor="middle" font-size="10" fill="#374151">cân nhắc chuyển sang hệ phức tạp hơn</text>
  <text x="400" y="365" text-anchor="middle" font-size="10" fill="#6B7280">Không gian hẹp, cần đi ngang → Mecanum · Ngân sách thấp, tải nhẹ → Omni 3 bánh</text>
  <text x="400" y="383" text-anchor="middle" font-size="10" fill="#6B7280">Ngoài trời, tốc độ cao → Ackermann</text>
  <text x="400" y="410" text-anchor="middle" font-size="9" fill="#9CA3AF">Không có lựa chọn "tốt nhất" tuyệt đối — chỉ có lựa chọn khớp ràng buộc thực tế</text>
</svg>
