<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Arial, sans-serif">
  <defs>
    <marker id="cpArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="800" height="420" fill="#FFFFFF"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Node riêng tiến trình vs Composition</text>

  <!-- Left: separate processes -->
  <text x="205" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#9A3412">Mặc định — mỗi node 1 tiến trình</text>
  <rect x="60" y="75" width="140" height="70" rx="8" fill="#FFEDD5" stroke="#F97316" stroke-width="2"/>
  <text x="130" y="105" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Process A</text>
  <text x="130" y="122" text-anchor="middle" font-size="9" fill="#6B7280">camera_driver</text>

  <rect x="220" y="75" width="140" height="70" rx="8" fill="#FFEDD5" stroke="#F97316" stroke-width="2"/>
  <text x="290" y="105" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Process B</text>
  <text x="290" y="122" text-anchor="middle" font-size="9" fill="#6B7280">yolo_detector</text>

  <line x1="200" y1="110" x2="216" y2="110" stroke="#DC2626" stroke-width="2.5" marker-end="url(#cpArrow)"/>
  <text x="205" y="160" text-anchor="middle" font-size="8" fill="#7F1D1D">serialize</text>
  <text x="205" y="172" text-anchor="middle" font-size="8" fill="#7F1D1D">qua DDS</text>

  <text x="205" y="195" text-anchor="middle" font-size="9" fill="#6B7280">ảnh lớn → copy + serialize mỗi lần gửi</text>

  <!-- Right: composition -->
  <text x="595" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Composition — chung 1 tiến trình</text>
  <rect x="450" y="75" width="300" height="90" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="600" y="98" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">component_container (1 process)</text>

  <rect x="465" y="110" width="120" height="45" rx="6" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
  <text x="525" y="136" text-anchor="middle" font-size="9" fill="#111827">CameraComponent</text>

  <rect x="600" y="110" width="135" height="45" rx="6" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
  <text x="667" y="136" text-anchor="middle" font-size="9" fill="#111827">YoloComponent</text>

  <line x1="585" y1="132" x2="598" y2="132" stroke="#16A34A" stroke-width="2.5" marker-end="url(#cpArrow)"/>

  <text x="600" y="195" text-anchor="middle" font-size="9" fill="#6B7280">con trỏ bộ nhớ trực tiếp — bỏ qua serialize</text>

  <rect x="90" y="230" width="620" height="70" rx="10" fill="#F3F5F8" stroke="#6B7280" stroke-width="1.3"/>
  <text x="400" y="255" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Cùng 1 class MotorComponent — chạy được cả 2 cách</text>
  <text x="400" y="275" text-anchor="middle" font-size="10" font-family="monospace" fill="#374151">RCLCPP_COMPONENTS_REGISTER_NODE(MotorComponent) — build ra .so, không phải executable</text>

  <rect x="90" y="320" width="300" height="70" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="240" y="345" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">ros2 launch composed_bringup.py</text>
  <text x="240" y="363" text-anchor="middle" font-size="9" fill="#6B7280">gộp sẵn từ lúc khai launch file</text>

  <rect x="410" y="320" width="300" height="70" rx="8" fill="#FFFFFF" stroke="#9333EA" stroke-width="1.5"/>
  <text x="560" y="345" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">ros2 component load ...</text>
  <text x="560" y="363" text-anchor="middle" font-size="9" fill="#6B7280">nạp động vào container đang chạy</text>
</svg>
