<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Arial, sans-serif">
  <defs>
    <marker id="exArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="800" height="420" fill="#FFFFFF"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Vòng lặp Executor phía sau rclpy.spin()</text>

  <circle cx="400" cy="220" r="150" fill="none" stroke="#E5E9EF" stroke-width="1.5" stroke-dasharray="3 3"/>

  <rect x="310" y="60" width="180" height="65" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="400" y="85" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">1. Xây wait-set</text>
  <text x="400" y="103" text-anchor="middle" font-size="9" fill="#374151">hỏi rcl/DDS: cái gì sẵn sàng?</text>

  <path d="M 465 118 A 150 150 0 0 1 545 300" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#exArrow)"/>

  <rect x="540" y="270" width="180" height="65" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="630" y="295" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">2. Chọn callback</text>
  <text x="630" y="313" text-anchor="middle" font-size="9" fill="#374151">theo Callback Group</text>

  <path d="M 545 300 A 150 150 0 0 1 335 335" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#exArrow)"/>

  <rect x="80" y="270" width="180" height="65" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="170" y="295" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">3. Gọi callback</text>
  <text x="170" y="313" text-anchor="middle" font-size="9" fill="#374151">trên 1 hoặc nhiều luồng</text>

  <path d="M 255 300 A 150 150 0 0 1 335 118" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#exArrow)"/>

  <text x="400" y="225" text-anchor="middle" font-size="10" fill="#6B7280">lặp lại vô hạn = spin()</text>

  <rect x="90" y="365" width="620" height="45" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="392" text-anchor="middle" font-size="10" fill="#111827">spin_once(timeout) = chạy đúng 1 vòng — dùng khi cần chèn code khác giữa các vòng</text>
</svg>
