<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Arial, sans-serif">
  <defs>
    <marker id="lfArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="800" height="460" fill="#FFFFFF"/>
  <text x="400" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Một launch file khởi động nhiều node</text>

  <rect x="250" y="55" width="300" height="55" rx="10" fill="#EDE9FE" stroke="#9333EA" stroke-width="2"/>
  <text x="400" y="78" text-anchor="middle" font-size="12" font-weight="700" font-family="monospace" fill="#6B21A8">ros2 launch my_pkg bringup.launch.py</text>
  <text x="400" y="95" text-anchor="middle" font-size="9" fill="#6B7280">gọi generate_launch_description()</text>

  <line x1="400" y1="110" x2="400" y2="140" stroke="#111827" stroke-width="2" marker-end="url(#lfArrow)"/>

  <rect x="130" y="145" width="540" height="60" rx="8" fill="#F3F5F8" stroke="#6B7280" stroke-width="1.3"/>
  <text x="400" y="170" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">LaunchDescription([ ... ])</text>
  <text x="400" y="188" text-anchor="middle" font-size="9" fill="#6B7280">danh sách các action cần thực hiện, theo thứ tự khai báo</text>

  <line x1="230" y1="205" x2="230" y2="235" stroke="#111827" stroke-width="1.5" marker-end="url(#lfArrow)"/>
  <line x1="400" y1="205" x2="400" y2="235" stroke="#111827" stroke-width="1.5" marker-end="url(#lfArrow)"/>
  <line x1="570" y1="205" x2="570" y2="235" stroke="#111827" stroke-width="1.5" marker-end="url(#lfArrow)"/>

  <rect x="120" y="240" width="220" height="70" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="230" y="263" text-anchor="middle" font-size="11" font-weight="700" font-family="monospace" fill="#111827">Node(driver)</text>
  <text x="230" y="280" text-anchor="middle" font-size="9" fill="#6B7280">= ros2 run package executable</text>
  <text x="230" y="295" text-anchor="middle" font-size="9" fill="#6B7280">có thể kèm parameters=[...]</text>

  <rect x="360" y="240" width="220" height="70" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/>
  <text x="470" y="263" text-anchor="middle" font-size="11" font-weight="700" font-family="monospace" fill="#111827">Node(lidar)</text>
  <text x="470" y="280" text-anchor="middle" font-size="9" fill="#6B7280">node thứ 2 chạy song song</text>

  <rect x="475" y="240" width="205" height="70" rx="8" fill="#FFEDD5" stroke="#F97316" stroke-width="2" opacity="0.95"/>
  <text x="577" y="263" text-anchor="middle" font-size="11" font-weight="700" font-family="monospace" fill="#111827">IncludeLaunch...</text>
  <text x="577" y="280" text-anchor="middle" font-size="9" fill="#6B7280">nhúng nguyên launch file khác</text>
  <text x="577" y="295" text-anchor="middle" font-size="9" fill="#6B7280">vd: nav2_bringup</text>

  <rect x="90" y="335" width="620" height="90" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="358" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Đừng quên khai install</text>
  <text x="400" y="378" text-anchor="middle" font-size="10" fill="#374151">CMakeLists.txt: install(DIRECTORY launch DESTINATION share/${PROJECT_NAME})</text>
  <text x="400" y="395" text-anchor="middle" font-size="10" fill="#374151">setup.py: data_files=[("share/"+package_name+"/launch", ["launch/bringup.launch.py"])]</text>
  <text x="400" y="413" text-anchor="middle" font-size="9" fill="#6B7280">thiếu bước này → ros2 launch báo "package not found" dù file .py không sai cú pháp</text>
</svg>
