<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Arial, sans-serif">
  <defs>
    <marker id="cmArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="800" height="480" fill="#FFFFFF"/>
  <text x="400" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Thứ tự cố định trong CMakeLists.txt</text>

  <rect x="150" y="60" width="500" height="46" rx="8" fill="#F3F5F8" stroke="#6B7280" stroke-width="1.5"/>
  <text x="400" y="88" text-anchor="middle" font-size="12" font-family="monospace" fill="#111827">cmake_minimum_required() / project()</text>

  <line x1="400" y1="106" x2="400" y2="130" stroke="#111827" stroke-width="2" marker-end="url(#cmArrow)"/>

  <rect x="150" y="134" width="500" height="46" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="400" y="155" text-anchor="middle" font-size="12" font-weight="700" font-family="monospace" fill="#111827">find_package(rclcpp REQUIRED) ...</text>
  <text x="400" y="171" text-anchor="middle" font-size="9" fill="#6B7280">khai cần gì — 1 dòng / dependency</text>

  <line x1="400" y1="180" x2="400" y2="204" stroke="#111827" stroke-width="2" marker-end="url(#cmArrow)"/>

  <rect x="150" y="208" width="500" height="46" rx="8" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  <text x="400" y="229" text-anchor="middle" font-size="12" font-weight="700" font-family="monospace" fill="#111827">add_executable(hello_node src/hello_node.cpp)</text>
  <text x="400" y="245" text-anchor="middle" font-size="9" fill="#6B7280">khai biên dịch file .cpp nào thành executable nào</text>

  <line x1="400" y1="254" x2="400" y2="278" stroke="#111827" stroke-width="2" marker-end="url(#cmArrow)"/>

  <rect x="150" y="282" width="500" height="46" rx="8" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  <text x="400" y="303" text-anchor="middle" font-size="12" font-weight="700" font-family="monospace" fill="#111827">ament_target_dependencies(hello_node rclcpp)</text>
  <text x="400" y="319" text-anchor="middle" font-size="9" fill="#6B7280">tự link đúng thư viện cho executable vừa khai</text>

  <line x1="400" y1="328" x2="400" y2="352" stroke="#111827" stroke-width="2" marker-end="url(#cmArrow)"/>

  <rect x="150" y="356" width="500" height="46" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/>
  <text x="400" y="377" text-anchor="middle" font-size="12" font-weight="700" font-family="monospace" fill="#111827">install(TARGETS hello_node DESTINATION ...)</text>
  <text x="400" y="393" text-anchor="middle" font-size="9" fill="#6B7280">khai đặt binary vào đâu trong install/</text>

  <line x1="400" y1="402" x2="400" y2="426" stroke="#111827" stroke-width="2" marker-end="url(#cmArrow)"/>

  <rect x="150" y="430" width="500" height="40" rx="8" fill="#EDE9FE" stroke="#9333EA" stroke-width="2"/>
  <text x="400" y="455" text-anchor="middle" font-size="12" font-weight="700" font-family="monospace" fill="#6B21A8">ament_package()  ← luôn là dòng cuối</text>
</svg>
