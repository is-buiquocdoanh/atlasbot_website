<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Arial, sans-serif">
  <defs>
    <marker id="pyArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="800" height="460" fill="#FFFFFF"/>
  <text x="400" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Vòng đời tạo package Python (ament_python)</text>

  <rect x="40" y="70" width="150" height="60" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="115" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">ros2 pkg create</text>
  <text x="115" y="112" text-anchor="middle" font-size="9" fill="#6B7280">--build-type ament_python</text>

  <line x1="190" y1="100" x2="225" y2="100" stroke="#111827" stroke-width="2" marker-end="url(#pyArrow)"/>

  <rect x="230" y="70" width="180" height="60" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="320" y="93" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">my_py_pkg/hello_node.py</text>
  <text x="320" y="110" text-anchor="middle" font-size="9" fill="#6B7280">viết node bằng rclpy</text>

  <line x1="410" y1="100" x2="445" y2="100" stroke="#111827" stroke-width="2" marker-end="url(#pyArrow)"/>

  <rect x="450" y="70" width="150" height="60" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
  <text x="525" y="93" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">setup.py</text>
  <text x="525" y="110" text-anchor="middle" font-size="9" fill="#6B7280">entry_points console_scripts</text>

  <line x1="600" y1="100" x2="635" y2="100" stroke="#111827" stroke-width="2" marker-end="url(#pyArrow)"/>

  <rect x="640" y="70" width="120" height="60" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/>
  <text x="700" y="93" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">package.xml</text>
  <text x="700" y="110" text-anchor="middle" font-size="9" fill="#6B7280">dependency</text>

  <line x1="115" y1="130" x2="115" y2="185" stroke="#111827" stroke-width="2" marker-end="url(#pyArrow)"/>

  <rect x="40" y="190" width="720" height="70" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="400" y="215" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A8A">colcon build --packages-select my_py_pkg --symlink-install</text>
  <text x="400" y="235" text-anchor="middle" font-size="10" fill="#374151">symlink trỏ về src/ — sửa code .py xong chạy lại ngay, không cần build lại</text>

  <line x1="400" y1="260" x2="400" y2="300" stroke="#111827" stroke-width="2" marker-end="url(#pyArrow)"/>

  <rect x="120" y="305" width="260" height="60" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
  <text x="250" y="330" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">source install/setup.bash</text>
  <text x="250" y="347" text-anchor="middle" font-size="9" fill="#6B7280">nạp package mới vào môi trường shell</text>

  <line x1="380" y1="335" x2="415" y2="335" stroke="#111827" stroke-width="2" marker-end="url(#pyArrow)"/>

  <rect x="420" y="305" width="260" height="60" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
  <text x="550" y="330" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">ros2 run my_py_pkg hello_node</text>
  <text x="550" y="347" text-anchor="middle" font-size="9" fill="#6B7280">node chạy được</text>

  <rect x="90" y="395" width="620" height="45" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="422" text-anchor="middle" font-size="11" fill="#111827">entry_points trong setup.py = CMakeLists.txt của thế giới Python — cùng trả lời "chạy gì khi ros2 run"</text>
</svg>
