<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Arial, sans-serif">
  <rect width="800" height="460" fill="#FFFFFF"/>
  <text x="400" y="35" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Bên dưới lớp vỏ Action</text>

  <rect x="230" y="60" width="340" height="60" rx="10" fill="#9333EA" opacity="0.08" stroke="#9333EA" stroke-width="2.5"/>
  <text x="400" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Action API</text>
  <text x="400" y="106" text-anchor="middle" font-size="10" fill="#6B7280">ActionClient / ActionServer</text>

  <line x1="400" y1="120" x2="400" y2="150" stroke="#6B7280" stroke-width="1.5"/>

  <rect x="60" y="155" width="180" height="55" rx="8" fill="#2563EB" opacity="0.10" stroke="#2563EB" stroke-width="2"/>
  <text x="150" y="180" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Service: send_goal</text>
  <text x="150" y="197" text-anchor="middle" font-size="9" fill="#6B7280">chấp nhận/từ chối goal</text>

  <rect x="260" y="155" width="180" height="55" rx="8" fill="#2563EB" opacity="0.10" stroke="#2563EB" stroke-width="2"/>
  <text x="350" y="180" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Service: get_result</text>
  <text x="350" y="197" text-anchor="middle" font-size="9" fill="#6B7280">trả kết quả cuối</text>

  <rect x="460" y="155" width="150" height="55" rx="8" fill="#F97316" opacity="0.10" stroke="#F97316" stroke-width="2"/>
  <text x="535" y="180" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Topic: feedback</text>
  <text x="535" y="197" text-anchor="middle" font-size="9" fill="#6B7280">tiến độ liên tục</text>

  <rect x="630" y="155" width="130" height="55" rx="8" fill="#F97316" opacity="0.10" stroke="#F97316" stroke-width="2"/>
  <text x="695" y="180" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Topic: status</text>
  <text x="695" y="197" text-anchor="middle" font-size="9" fill="#6B7280">trạng thái goal</text>

  <!-- state machine -->
  <text x="400" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Máy trạng thái của 1 goal</text>

  <rect x="330" y="270" width="140" height="40" rx="8" fill="#F3F5F8" stroke="#6B7280" stroke-width="1.5"/>
  <text x="400" y="295" text-anchor="middle" font-size="11" fill="#111827">Goal gửi tới</text>

  <rect x="330" y="330" width="140" height="40" rx="8" fill="#2563EB" opacity="0.12" stroke="#2563EB" stroke-width="2"/>
  <text x="400" y="355" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">EXECUTING</text>

  <rect x="150" y="400" width="150" height="40" rx="8" fill="#16A34A" opacity="0.12" stroke="#16A34A" stroke-width="2"/>
  <text x="225" y="425" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">SUCCEEDED</text>

  <rect x="330" y="400" width="140" height="40" rx="8" fill="#DC2626" opacity="0.10" stroke="#DC2626" stroke-width="2"/>
  <text x="400" y="425" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">ABORTED</text>

  <rect x="500" y="400" width="140" height="40" rx="8" fill="#F97316" opacity="0.12" stroke="#F97316" stroke-width="2"/>
  <text x="570" y="425" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">CANCELED</text>
</svg>
