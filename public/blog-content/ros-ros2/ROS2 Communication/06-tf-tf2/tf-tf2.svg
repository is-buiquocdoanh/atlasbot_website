<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Arial, sans-serif">
  <defs>
    <marker id="tfArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"/>
    </marker>
  </defs>
  <rect width="800" height="460" fill="#FFFFFF"/>
  <text x="400" y="35" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Cây TF — mỗi khung toạ độ có đúng 1 cha</text>

  <rect x="330" y="60" width="140" height="45" rx="8" fill="#2563EB" opacity="0.12" stroke="#2563EB" stroke-width="2"/>
  <text x="400" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">map</text>

  <line x1="400" y1="105" x2="400" y2="145" stroke="#6B7280" stroke-width="2" marker-end="url(#tfArrow)"/>
  <text x="415" y="128" font-size="9" fill="#6B7280">AMCL/SLAM cập nhật</text>

  <rect x="330" y="150" width="140" height="45" rx="8" fill="#16A34A" opacity="0.12" stroke="#16A34A" stroke-width="2"/>
  <text x="400" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">odom</text>

  <line x1="400" y1="195" x2="400" y2="235" stroke="#6B7280" stroke-width="2" marker-end="url(#tfArrow)"/>
  <text x="415" y="218" font-size="9" fill="#6B7280">odometry cập nhật</text>

  <rect x="315" y="240" width="170" height="45" rx="8" fill="#F97316" opacity="0.12" stroke="#F97316" stroke-width="2"/>
  <text x="400" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">base_link</text>

  <line x1="360" y1="285" x2="230" y2="335" stroke="#6B7280" stroke-width="1.5" marker-end="url(#tfArrow)"/>
  <line x1="400" y1="285" x2="400" y2="335" stroke="#6B7280" stroke-width="1.5" marker-end="url(#tfArrow)"/>
  <line x1="440" y1="285" x2="570" y2="335" stroke="#6B7280" stroke-width="1.5" marker-end="url(#tfArrow)"/>

  <text x="290" y="315" text-anchor="middle" font-size="9" fill="#6B7280">cố định (URDF)</text>

  <rect x="150" y="340" width="160" height="45" rx="8" fill="#F3F5F8" stroke="#6B7280" stroke-width="1.5"/>
  <text x="230" y="368" text-anchor="middle" font-size="12" fill="#111827">lidar_link</text>

  <rect x="320" y="340" width="160" height="45" rx="8" fill="#F3F5F8" stroke="#6B7280" stroke-width="1.5"/>
  <text x="400" y="368" text-anchor="middle" font-size="12" fill="#111827">imu_link</text>

  <rect x="490" y="340" width="160" height="45" rx="8" fill="#F3F5F8" stroke="#6B7280" stroke-width="1.5"/>
  <text x="570" y="368" text-anchor="middle" font-size="12" fill="#111827">camera_link</text>

  <rect x="90" y="405" width="620" height="45" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="432" text-anchor="middle" font-size="11" fill="#111827">TF2 tự nhân dồn transform: lidar_link → base_link → odom → map</text>
</svg>
