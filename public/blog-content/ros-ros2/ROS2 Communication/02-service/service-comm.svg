<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Arial, sans-serif">
  <defs>
    <marker id="scArrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="800" height="460" fill="#FFFFFF"/>
  <text x="400" y="35" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Gọi đồng bộ trong callback → tự deadlock</text>

  <!-- sync/blocking scenario -->
  <text x="200" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#DC2626">✕ Đồng bộ trong callback</text>
  <rect x="60" y="85" width="280" height="60" rx="8" fill="#DC2626" opacity="0.06" stroke="#DC2626" stroke-width="1.5"/>
  <text x="200" y="112" text-anchor="middle" font-size="11" fill="#111827">callback_A() đang chạy trên executor</text>
  <text x="200" y="130" text-anchor="middle" font-size="10" fill="#6B7280">gọi service.call() — BLOCK tại đây</text>

  <path d="M 200 145 C 200 190, 340 190, 340 145" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#scArrow2)"/>
  <text x="340" y="175" text-anchor="middle" font-size="9" fill="#DC2626">chờ response...</text>

  <rect x="60" y="200" width="280" height="55" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="200" y="223" text-anchor="middle" font-size="10" fill="#111827">Response cần executor xử lý —</text>
  <text x="200" y="240" text-anchor="middle" font-size="10" fill="#111827">nhưng executor đang bận chờ ở trên!</text>

  <text x="200" y="285" text-anchor="middle" font-size="11" font-weight="700" fill="#DC2626">→ Node tự treo (deadlock)</text>

  <line x1="410" y1="60" x2="410" y2="420" stroke="#E5E9EF" stroke-width="2"/>

  <!-- async scenario -->
  <text x="610" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#16A34A">✓ Bất đồng bộ (call_async)</text>
  <rect x="470" y="85" width="280" height="60" rx="8" fill="#16A34A" opacity="0.06" stroke="#16A34A" stroke-width="1.5"/>
  <text x="610" y="112" text-anchor="middle" font-size="11" fill="#111827">callback_A() gọi call_async(req)</text>
  <text x="610" y="130" text-anchor="middle" font-size="10" fill="#6B7280">nhận Future ngay, KHÔNG chờ</text>

  <line x1="610" y1="145" x2="610" y2="185" stroke="#16A34A" stroke-width="2" marker-end="url(#scArrow2)"/>
  <text x="640" y="170" font-size="9" fill="#16A34A">tiếp tục chạy</text>

  <rect x="470" y="195" width="280" height="55" rx="8" fill="#16A34A" opacity="0.06" stroke="#16A34A" stroke-width="1.5"/>
  <text x="610" y="218" text-anchor="middle" font-size="10" fill="#111827">callback_A() kết thúc bình thường,</text>
  <text x="610" y="235" text-anchor="middle" font-size="10" fill="#111827">executor rảnh xử lý việc khác</text>

  <line x1="610" y1="250" x2="610" y2="290" stroke="#16A34A" stroke-width="2" marker-end="url(#scArrow2)"/>
  <text x="700" y="275" font-size="9" fill="#16A34A">khi response tới</text>

  <rect x="470" y="300" width="280" height="55" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="610" y="332" text-anchor="middle" font-size="10" fill="#111827">executor gọi handle_response(future)</text>

  <text x="610" y="390" text-anchor="middle" font-size="11" font-weight="700" fill="#16A34A">→ Không bao giờ tự treo</text>
</svg>
