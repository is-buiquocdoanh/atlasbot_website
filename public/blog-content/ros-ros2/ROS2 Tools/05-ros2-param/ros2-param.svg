<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Arial, sans-serif">
  <defs>
    <marker id="prArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="800" height="380" fill="#FFFFFF"/>
  <text x="400" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">ros2 param — 5 lệnh trên node đang chạy</text>

  <rect x="40" y="60" width="220" height="55" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
  <text x="150" y="83" text-anchor="middle" font-size="11" font-weight="700" font-family="monospace" fill="#111827">param list</text>
  <text x="150" y="100" text-anchor="middle" font-size="9" fill="#6B7280">node nào có param gì</text>

  <rect x="290" y="60" width="220" height="55" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
  <text x="400" y="83" text-anchor="middle" font-size="11" font-weight="700" font-family="monospace" fill="#111827">param get ...</text>
  <text x="400" y="100" text-anchor="middle" font-size="9" fill="#6B7280">đọc giá trị hiện tại</text>

  <rect x="540" y="60" width="220" height="55" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="650" y="83" text-anchor="middle" font-size="11" font-weight="700" font-family="monospace" fill="#1E3A8A">param set ...</text>
  <text x="650" y="100" text-anchor="middle" font-size="9" fill="#374151">đổi ngay lập tức</text>

  <line x1="650" y1="115" x2="650" y2="150" stroke="#111827" stroke-width="2" marker-end="url(#prArrow)"/>

  <rect x="500" y="155" width="300" height="65" rx="8" fill="#FFEDD5" stroke="#F97316" stroke-width="1.5"/>
  <text x="650" y="178" text-anchor="middle" font-size="10" font-weight="700" fill="#9A3412">Có tác dụng thật không?</text>
  <text x="650" y="196" text-anchor="middle" font-size="9" fill="#7C2D12">Chỉ nếu node có</text>
  <text x="650" y="210" text-anchor="middle" font-size="9" font-family="monospace" fill="#7C2D12">add_on_set_parameters_callback()</text>

  <rect x="130" y="245" width="240" height="70" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="250" y="270" text-anchor="middle" font-size="11" font-weight="700" font-family="monospace" fill="#166534">param dump /node &gt; backup.yaml</text>
  <text x="250" y="290" text-anchor="middle" font-size="9" fill="#374151">xuất toàn bộ state hiện tại ra YAML</text>

  <path d="M 370 265 L 430 265" stroke="#111827" stroke-width="1.5" marker-end="url(#prArrow)"/>
  <path d="M 430 300 L 370 300" stroke="#111827" stroke-width="1.5" marker-end="url(#prArrow)"/>

  <rect x="430" y="245" width="240" height="70" rx="8" fill="#EDE9FE" stroke="#9333EA" stroke-width="2"/>
  <text x="550" y="270" text-anchor="middle" font-size="11" font-weight="700" font-family="monospace" fill="#6B21A8">param load /node backup.yaml</text>
  <text x="550" y="290" text-anchor="middle" font-size="9" fill="#374151">nạp lại toàn bộ, nhanh hơn set từng cái</text>
</svg>
