<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Arial, sans-serif">
  <rect width="800" height="420" fill="#FFFFFF"/>
  <text x="400" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">ros2 topic — 6 lệnh dùng nhiều nhất</text>

  <rect x="40" y="60" width="220" height="70" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
  <text x="150" y="85" text-anchor="middle" font-size="11" font-weight="700" font-family="monospace" fill="#111827">topic list</text>
  <text x="150" y="103" text-anchor="middle" font-size="9" fill="#6B7280">liệt kê mọi topic đang có</text>

  <rect x="290" y="60" width="220" height="70" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
  <text x="400" y="85" text-anchor="middle" font-size="11" font-weight="700" font-family="monospace" fill="#111827">topic info /scan</text>
  <text x="400" y="103" text-anchor="middle" font-size="9" fill="#6B7280">kiểu message, số pub/sub</text>

  <rect x="540" y="60" width="220" height="70" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
  <text x="650" y="85" text-anchor="middle" font-size="11" font-weight="700" font-family="monospace" fill="#111827">topic echo /scan</text>
  <text x="650" y="103" text-anchor="middle" font-size="9" fill="#6B7280">in dữ liệu realtime</text>

  <rect x="40" y="150" width="220" height="70" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="150" y="175" text-anchor="middle" font-size="11" font-weight="700" font-family="monospace" fill="#1E3A8A">topic hz /scan</text>
  <text x="150" y="193" text-anchor="middle" font-size="9" fill="#374151">đo tần số publish (Hz)</text>

  <rect x="290" y="150" width="220" height="70" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="400" y="175" text-anchor="middle" font-size="11" font-weight="700" font-family="monospace" fill="#1E3A8A">topic bw /scan</text>
  <text x="400" y="193" text-anchor="middle" font-size="9" fill="#374151">đo băng thông (bytes/s)</text>

  <rect x="540" y="150" width="220" height="70" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="650" y="175" text-anchor="middle" font-size="11" font-weight="700" font-family="monospace" fill="#166534">topic pub /cmd_vel ...</text>
  <text x="650" y="193" text-anchor="middle" font-size="9" fill="#374151">giả lập publisher thủ công</text>

  <text x="400" y="255" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Quy trình debug "robot không chạy"</text>

  <rect x="40" y="270" width="170" height="50" rx="8" fill="#F3F5F8" stroke="#6B7280" stroke-width="1.3"/>
  <text x="125" y="300" text-anchor="middle" font-size="10" font-family="monospace" fill="#111827">1. topic list</text>

  <rect x="230" y="270" width="170" height="50" rx="8" fill="#F3F5F8" stroke="#6B7280" stroke-width="1.3"/>
  <text x="315" y="300" text-anchor="middle" font-size="10" font-family="monospace" fill="#111827">2. topic info</text>

  <rect x="420" y="270" width="170" height="50" rx="8" fill="#F3F5F8" stroke="#6B7280" stroke-width="1.3"/>
  <text x="505" y="300" text-anchor="middle" font-size="10" font-family="monospace" fill="#111827">3. topic echo</text>

  <rect x="610" y="270" width="150" height="50" rx="8" fill="#F3F5F8" stroke="#6B7280" stroke-width="1.3"/>
  <text x="685" y="300" text-anchor="middle" font-size="10" font-family="monospace" fill="#111827">4. topic hz</text>

  <path d="M 210 295 L 228 295" stroke="#111827" stroke-width="1.5"/>
  <path d="M 400 295 L 418 295" stroke="#111827" stroke-width="1.5"/>
  <path d="M 590 295 L 608 295" stroke="#111827" stroke-width="1.5"/>

  <rect x="90" y="350" width="620" height="45" rx="8" fill="#FFEDD5" stroke="#F97316" stroke-width="1.3"/>
  <text x="400" y="378" text-anchor="middle" font-size="10" fill="#9A3412">echo không ra gì → lỗi phía gửi · echo đúng nhưng robot vẫn đứng yên → lỗi phía nhận</text>
</svg>
