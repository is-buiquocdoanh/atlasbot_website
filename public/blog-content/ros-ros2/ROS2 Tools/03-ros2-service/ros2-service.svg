<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Arial, sans-serif">
  <defs>
    <marker id="svArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="800" height="380" fill="#FFFFFF"/>
  <text x="400" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Gọi service từ terminal — không cần viết client node</text>

  <rect x="40" y="65" width="220" height="55" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
  <text x="150" y="88" text-anchor="middle" font-size="11" font-weight="700" font-family="monospace" fill="#111827">service list</text>
  <text x="150" y="105" text-anchor="middle" font-size="9" fill="#6B7280">có service nào tên đó không?</text>

  <line x1="260" y1="92" x2="290" y2="92" stroke="#111827" stroke-width="2" marker-end="url(#svArrow)"/>

  <rect x="295" y="65" width="220" height="55" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
  <text x="405" y="88" text-anchor="middle" font-size="11" font-weight="700" font-family="monospace" fill="#111827">interface show ...</text>
  <text x="405" y="105" text-anchor="middle" font-size="9" fill="#6B7280">xem cấu trúc request/response</text>

  <line x1="515" y1="92" x2="545" y2="92" stroke="#111827" stroke-width="2" marker-end="url(#svArrow)"/>

  <rect x="550" y="65" width="210" height="55" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="655" y="88" text-anchor="middle" font-size="11" font-weight="700" font-family="monospace" fill="#1E3A8A">service call ...</text>
  <text x="655" y="105" text-anchor="middle" font-size="9" fill="#374151">gọi thật, đợi phản hồi</text>

  <line x1="655" y1="120" x2="655" y2="155" stroke="#111827" stroke-width="2" marker-end="url(#svArrow)"/>

  <rect x="420" y="160" width="340" height="90" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="590" y="185" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">response ngay trong terminal</text>
  <text x="590" y="205" text-anchor="middle" font-size="9" font-family="monospace" fill="#374151">success=True</text>
  <text x="590" y="222" text-anchor="middle" font-size="9" font-family="monospace" fill="#374151">message='Odometry reset thành công'</text>
  <text x="590" y="240" text-anchor="middle" font-size="8" fill="#6B7280">khác topic — luôn có phản hồi trực tiếp</text>

  <rect x="90" y="290" width="620" height="55" rx="8" fill="#FFEDD5" stroke="#F97316" stroke-width="1.3"/>
  <text x="400" y="313" text-anchor="middle" font-size="11" font-weight="700" fill="#9A3412">Lệnh treo, không trả về?</text>
  <text x="400" y="331" text-anchor="middle" font-size="10" fill="#7C2D12">Server (node cung cấp service) chưa chạy hoặc đang block — không phải do sai cú pháp gọi</text>
</svg>
