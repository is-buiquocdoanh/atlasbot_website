<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Arial, sans-serif">
  <defs>
    <marker id="r2Arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#FFFFFF"/>
  <text x="400" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">ROS1 (có trạm trung tâm) vs ROS2 (phân tán)</text>

  <!-- ROS1 side -->
  <text x="200" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#DC2626">ROS1</text>
  <circle cx="200" cy="130" r="34" fill="#DC2626" opacity="0.10" stroke="#DC2626" stroke-width="2"/>
  <text x="200" y="126" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">roscore</text>
  <text x="200" y="140" text-anchor="middle" font-size="9" fill="#6B7280">(bắt buộc)</text>

  <circle cx="120" cy="230" r="26" fill="#F3F5F8" stroke="#6B7280" stroke-width="1.5"/>
  <text x="120" y="234" text-anchor="middle" font-size="9" fill="#111827">Node A</text>
  <circle cx="280" cy="230" r="26" fill="#F3F5F8" stroke="#6B7280" stroke-width="1.5"/>
  <text x="280" y="234" text-anchor="middle" font-size="9" fill="#111827">Node B</text>
  <circle cx="200" cy="290" r="26" fill="#F3F5F8" stroke="#6B7280" stroke-width="1.5"/>
  <text x="200" y="294" text-anchor="middle" font-size="9" fill="#111827">Node C</text>

  <line x1="150" y1="155" x2="130" y2="205" stroke="#DC2626" stroke-width="1.5"/>
  <line x1="250" y1="155" x2="270" y2="205" stroke="#DC2626" stroke-width="1.5"/>
  <line x1="200" y1="164" x2="200" y2="264" stroke="#DC2626" stroke-width="1.5"/>

  <text x="200" y="345" text-anchor="middle" font-size="10" fill="#DC2626">roscore chết → cả hệ mất kết nối</text>

  <line x1="400" y1="60" x2="400" y2="400" stroke="#E5E9EF" stroke-width="2"/>

  <!-- ROS2 side -->
  <text x="600" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#16A34A">ROS2</text>

  <circle cx="520" cy="180" r="28" fill="#F3F5F8" stroke="#16A34A" stroke-width="2"/>
  <text x="520" y="184" text-anchor="middle" font-size="9" fill="#111827">Node A</text>
  <circle cx="680" cy="180" r="28" fill="#F3F5F8" stroke="#16A34A" stroke-width="2"/>
  <text x="680" y="184" text-anchor="middle" font-size="9" fill="#111827">Node B</text>
  <circle cx="600" cy="290" r="28" fill="#F3F5F8" stroke="#16A34A" stroke-width="2"/>
  <text x="600" y="294" text-anchor="middle" font-size="9" fill="#111827">Node C</text>

  <line x1="546" y1="192" x2="654" y2="192" stroke="#16A34A" stroke-width="1.8" marker-end="url(#r2Arrow)" marker-start="url(#r2Arrow)"/>
  <line x1="535" y1="203" x2="585" y2="270" stroke="#16A34A" stroke-width="1.8" marker-end="url(#r2Arrow)" marker-start="url(#r2Arrow)"/>
  <line x1="665" y1="203" x2="615" y2="270" stroke="#16A34A" stroke-width="1.8" marker-end="url(#r2Arrow)" marker-start="url(#r2Arrow)"/>

  <text x="600" y="345" text-anchor="middle" font-size="10" fill="#16A34A">Tự phát hiện nhau qua DDS,</text>
  <text x="600" y="360" text-anchor="middle" font-size="10" fill="#16A34A">không có điểm chết trung tâm</text>

  <rect x="120" y="395" width="560" height="40" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="420" text-anchor="middle" font-size="11" fill="#111827">Đây là lý do ROS2 phù hợp hệ thống nhiều robot và ứng dụng thời gian thực hơn ROS1</text>
</svg>
