<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Arial, sans-serif">
  <defs>
    <marker id="subArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F97316"/>
    </marker>
  </defs>
  <rect width="800" height="420" fill="#FFFFFF"/>
  <text x="400" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Subscriber — hướng sự kiện, không polling</text>

  <rect x="90" y="80" width="180" height="60" rx="10" fill="#2563EB" opacity="0.10" stroke="#2563EB" stroke-width="2.5"/>
  <text x="180" y="105" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">/cmd_vel</text>
  <text x="180" y="122" text-anchor="middle" font-size="9" fill="#6B7280">message mới tới</text>

  <line x1="270" y1="110" x2="340" y2="110" stroke="#F97316" stroke-width="2.5" marker-end="url(#subArrow)"/>

  <rect x="350" y="70" width="180" height="80" rx="10" fill="#F97316" opacity="0.08" stroke="#F97316" stroke-width="2"/>
  <text x="440" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Executor</text>
  <text x="440" y="118" text-anchor="middle" font-size="9" fill="#6B7280">(bên trong rclpy.spin)</text>
  <text x="440" y="135" text-anchor="middle" font-size="9" fill="#6B7280">phát hiện sự kiện</text>

  <line x1="440" y1="150" x2="440" y2="190" stroke="#F97316" stroke-width="2.5" marker-end="url(#subArrow)"/>

  <rect x="350" y="195" width="180" height="55" rx="8" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  <text x="440" y="227" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">listener_callback(msg)</text>

  <!-- vs polling comparison -->
  <line x1="30" y1="290" x2="770" y2="290" stroke="#E5E9EF" stroke-width="1.5"/>

  <text x="200" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#DC2626">✕ Polling (không phải cách ROS2 làm)</text>
  <text x="200" y="342" text-anchor="middle" font-size="10" fill="#6B7280">while True: kiểm tra có dữ liệu chưa?</text>
  <text x="200" y="358" text-anchor="middle" font-size="10" fill="#6B7280">→ tốn CPU liên tục dù chẳng có gì mới</text>

  <text x="600" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#16A34A">✓ Event-driven (cách ROS2 làm)</text>
  <text x="600" y="342" text-anchor="middle" font-size="10" fill="#6B7280">callback chỉ chạy khi thực sự có message</text>
  <text x="600" y="358" text-anchor="middle" font-size="10" fill="#6B7280">→ tiết kiệm tài nguyên, phản hồi tức thời</text>
</svg>
