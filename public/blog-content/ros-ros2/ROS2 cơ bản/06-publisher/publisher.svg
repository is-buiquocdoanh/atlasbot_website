<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Arial, sans-serif">
  <defs>
    <marker id="pubArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16A34A"/>
    </marker>
  </defs>
  <rect width="800" height="420" fill="#FFFFFF"/>
  <text x="400" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Timer kích hoạt Publisher định kỳ</text>

  <rect x="60" y="80" width="230" height="140" rx="10" fill="#2563EB" opacity="0.06" stroke="#2563EB" stroke-width="2"/>
  <text x="175" y="105" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Node</text>
  <rect x="90" y="120" width="170" height="45" rx="6" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
  <text x="175" y="147" text-anchor="middle" font-size="11" fill="#111827">Timer (mỗi 0.5s)</text>
  <rect x="90" y="175" width="170" height="35" rx="6" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
  <text x="175" y="197" text-anchor="middle" font-size="10" fill="#111827">timer_callback()</text>

  <line x1="175" y1="165" x2="175" y2="175" stroke="#6B7280" stroke-width="1.5"/>

  <line x1="290" y1="192" x2="360" y2="192" stroke="#16A34A" stroke-width="2.5" marker-end="url(#pubArrow)"/>
  <text x="325" y="182" text-anchor="middle" font-size="9" fill="#16A34A">.publish(msg)</text>

  <rect x="370" y="150" width="180" height="60" rx="10" fill="#F97316" opacity="0.10" stroke="#F97316" stroke-width="2.5"/>
  <text x="460" y="175" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">/cmd_vel</text>
  <text x="460" y="192" text-anchor="middle" font-size="9" fill="#6B7280">hàng đợi độ sâu 10</text>

  <line x1="560" y1="180" x2="630" y2="180" stroke="#6B7280" stroke-width="2" marker-end="url(#pubArrow)"/>
  <text x="670" y="175" text-anchor="middle" font-size="11" fill="#111827">Subscriber</text>
  <text x="670" y="192" text-anchor="middle" font-size="9" fill="#6B7280">(nếu có)</text>

  <!-- timeline -->
  <text x="400" y="260" text-anchor="middle" font-size="12" fill="#6B7280">Dòng thời gian publish</text>
  <line x1="90" y1="290" x2="710" y2="290" stroke="#6B7280" stroke-width="1.5"/>
  <circle cx="150" cy="290" r="5" fill="#16A34A"/>
  <circle cx="270" cy="290" r="5" fill="#16A34A"/>
  <circle cx="390" cy="290" r="5" fill="#16A34A"/>
  <circle cx="510" cy="290" r="5" fill="#16A34A"/>
  <circle cx="630" cy="290" r="5" fill="#16A34A"/>
  <text x="150" y="315" text-anchor="middle" font-size="9" fill="#6B7280">0.0s</text>
  <text x="270" y="315" text-anchor="middle" font-size="9" fill="#6B7280">0.5s</text>
  <text x="390" y="315" text-anchor="middle" font-size="9" fill="#6B7280">1.0s</text>
  <text x="510" y="315" text-anchor="middle" font-size="9" fill="#6B7280">1.5s</text>
  <text x="630" y="315" text-anchor="middle" font-size="9" fill="#6B7280">2.0s</text>

  <rect x="120" y="350" width="560" height="45" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="377" text-anchor="middle" font-size="11" fill="#111827">Publisher không tự gửi — phải chủ động gọi .publish() mỗi lần có dữ liệu mới</text>
</svg>
