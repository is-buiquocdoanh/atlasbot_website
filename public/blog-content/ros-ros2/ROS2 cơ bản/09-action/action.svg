<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Arial, sans-serif">
  <defs>
    <marker id="acArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#FFFFFF"/>
  <text x="400" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Action = Goal (Service) + Feedback (Topic) + Result (Service)</text>

  <text x="130" y="80" font-size="12" font-weight="700" fill="#111827">Action Client</text>
  <line x1="130" y1="95" x2="130" y2="380" stroke="#6B7280" stroke-width="1.5"/>
  <text x="670" y="80" font-size="12" font-weight="700" fill="#111827">Action Server</text>
  <line x1="670" y1="95" x2="670" y2="380" stroke="#6B7280" stroke-width="1.5"/>

  <!-- goal -->
  <line x1="130" y1="120" x2="665" y2="120" stroke="#2563EB" stroke-width="2.2" marker-end="url(#acArrow)"/>
  <text x="400" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#2563EB">Goal — "đi tới (5, 3)"</text>

  <!-- feedback stream -->
  <line x1="665" y1="165" x2="135" y2="165" stroke="#F97316" stroke-width="1.8" marker-end="url(#acArrow)"/>
  <text x="400" y="158" text-anchor="middle" font-size="10" fill="#F97316">Feedback: đã đi 20%</text>
  <line x1="665" y1="205" x2="135" y2="205" stroke="#F97316" stroke-width="1.8" marker-end="url(#acArrow)"/>
  <text x="400" y="198" text-anchor="middle" font-size="10" fill="#F97316">Feedback: đã đi 55%</text>
  <line x1="665" y1="245" x2="135" y2="245" stroke="#F97316" stroke-width="1.8" marker-end="url(#acArrow)"/>
  <text x="400" y="238" text-anchor="middle" font-size="10" fill="#F97316">Feedback: đã đi 90%</text>

  <rect x="580" y="270" width="90" height="30" rx="6" fill="#DC2626" opacity="0.10" stroke="#DC2626" stroke-width="1.5"/>
  <text x="625" y="290" text-anchor="middle" font-size="9" fill="#DC2626">có thể Cancel</text>

  <!-- result -->
  <line x1="665" y1="330" x2="135" y2="330" stroke="#16A34A" stroke-width="2.2" marker-end="url(#acArrow)"/>
  <text x="400" y="322" text-anchor="middle" font-size="11" font-weight="700" fill="#16A34A">Result — thành công</text>

  <rect x="110" y="400" width="580" height="40" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="425" text-anchor="middle" font-size="11" fill="#111827">Client KHÔNG bị chặn khi chờ — vẫn nhận feedback và có thể huỷ goal bất cứ lúc nào</text>
</svg>
