<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Arial, sans-serif">
  <defs>
    <marker id="wsArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#FFFFFF"/>
  <text x="400" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">colcon build biến src/ thành 3 thư mục khác</text>

  <rect x="90" y="70" width="150" height="70" rx="8" fill="#2563EB" opacity="0.12" stroke="#2563EB" stroke-width="2.5"/>
  <text x="165" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">src/</text>
  <text x="165" y="118" text-anchor="middle" font-size="10" fill="#6B7280">mã nguồn (bạn viết)</text>

  <line x1="240" y1="105" x2="300" y2="105" stroke="#111827" stroke-width="2.5" marker-end="url(#wsArrow)"/>
  <text x="270" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">colcon build</text>

  <rect x="310" y="60" width="150" height="60" rx="8" fill="#F3F5F8" stroke="#6B7280" stroke-width="1.5"/>
  <text x="385" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">build/</text>
  <text x="385" y="104" text-anchor="middle" font-size="9" fill="#6B7280">file trung gian</text>

  <rect x="310" y="135" width="150" height="60" rx="8" fill="#16A34A" opacity="0.12" stroke="#16A34A" stroke-width="2"/>
  <text x="385" y="163" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">install/</text>
  <text x="385" y="179" text-anchor="middle" font-size="9" fill="#6B7280">package sẵn sàng dùng</text>

  <rect x="310" y="210" width="150" height="60" rx="8" fill="#F3F5F8" stroke="#6B7280" stroke-width="1.5"/>
  <text x="385" y="238" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">log/</text>
  <text x="385" y="254" text-anchor="middle" font-size="9" fill="#6B7280">nhật ký build</text>

  <line x1="240" y1="105" x2="310" y2="90"/>
  <line x1="240" y1="120" x2="310" y2="165" stroke="#111827" stroke-width="1.5" marker-end="url(#wsArrow)"/>
  <line x1="240" y1="130" x2="310" y2="235" stroke="#111827" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- underlay/overlay -->
  <rect x="90" y="320" width="620" height="100" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="345" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">source /opt/ros/humble/setup.bash   (underlay — ROS2 hệ thống)</text>
  <text x="400" y="368" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">↓</text>
  <text x="400" y="392" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">source install/setup.bash   (overlay — package của bạn, ưu tiên hơn)</text>
</svg>
