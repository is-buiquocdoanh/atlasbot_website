<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Arial, sans-serif">
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Pipeline ROS2 + YOLO</text>

  <rect x="50" y="90" width="170" height="70" rx="8" fill="#2563EB" opacity="0.1" stroke="#2563EB" stroke-width="2"/>
  <text x="135" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">camera node</text>
  <text x="135" y="138" text-anchor="middle" font-size="9" fill="#6B7280">v4l2_camera</text>

  <line x1="220" y1="125" x2="290" y2="125" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowR)"/>
  <text x="255" y="115" text-anchor="middle" font-size="9" fill="#6B7280">/image_raw</text>
  <defs>
    <marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"/>
    </marker>
  </defs>

  <rect x="300" y="80" width="200" height="90" rx="8" fill="#16A34A" opacity="0.1" stroke="#16A34A" stroke-width="2.5"/>
  <text x="400" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">yolo_detection_node</text>
  <text x="400" y="128" text-anchor="middle" font-size="9" fill="#6B7280">cv_bridge → YOLO inference</text>
  <text x="400" y="145" text-anchor="middle" font-size="9" fill="#6B7280">→ cv_bridge</text>

  <line x1="510" y1="125" x2="580" y2="125" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowR)"/>
  <text x="545" y="115" text-anchor="middle" font-size="9" fill="#6B7280">/detections</text>

  <rect x="590" y="90" width="170" height="70" rx="8" fill="#F97316" opacity="0.1" stroke="#F97316" stroke-width="2"/>
  <text x="675" y="115" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Nav2 / giám sát</text>
  <text x="675" y="133" text-anchor="middle" font-size="9" fill="#6B7280">dùng kết quả detection</text>

  <rect x="90" y="280" width="620" height="60" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="304" text-anchor="middle" font-size="12" fill="#111827">Giới hạn tần số xử lý hoặc dùng QoS depth=1 để tránh</text>
  <text x="400" y="321" text-anchor="middle" font-size="12" fill="#111827">nghẽn callback khi inference AI chậm hơn tốc độ camera</text>
</svg>
