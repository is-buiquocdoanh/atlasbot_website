<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Arial, sans-serif">
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Object Tracking: cùng ID qua nhiều khung hình</text>

  <g font-size="10" fill="#111827">
    <rect x="70" y="90" width="180" height="150" rx="6" fill="#F3F5F8" stroke="#E5E9EF"/>
    <text x="160" y="108" text-anchor="middle" font-weight="700">Khung hình 1</text>
    <rect x="110" y="130" width="70" height="90" fill="none" stroke="#2563EB" stroke-width="2.5"/>
    <text x="145" y="123" text-anchor="middle" fill="#2563EB" font-weight="700">ID 7</text>

    <rect x="310" y="90" width="180" height="150" rx="6" fill="#F3F5F8" stroke="#E5E9EF"/>
    <text x="400" y="108" text-anchor="middle" font-weight="700">Khung hình 2</text>
    <rect x="360" y="128" width="70" height="90" fill="none" stroke="#2563EB" stroke-width="2.5"/>
    <text x="395" y="121" text-anchor="middle" fill="#2563EB" font-weight="700">ID 7</text>

    <rect x="550" y="90" width="180" height="150" rx="6" fill="#F3F5F8" stroke="#E5E9EF"/>
    <text x="640" y="108" text-anchor="middle" font-weight="700">Khung hình 3</text>
    <rect x="610" y="126" width="70" height="90" fill="none" stroke="#2563EB" stroke-width="2.5"/>
    <text x="645" y="119" text-anchor="middle" fill="#2563EB" font-weight="700">ID 7</text>
  </g>

  <path d="M 145 175 Q 250 200 395 173" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowT)"/>
  <path d="M 395 173 Q 500 195 645 171" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowT)"/>
  <defs>
    <marker id="arrowT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F97316"/>
    </marker>
  </defs>

  <rect x="90" y="290" width="620" height="55" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="312" text-anchor="middle" font-size="12" fill="#111827">Cùng 1 vật thể giữ nguyên ID xuyên suốt video —</text>
  <text x="400" y="329" text-anchor="middle" font-size="12" fill="#111827">biết được quỹ đạo và hướng di chuyển, không chỉ vị trí tức thời</text>
</svg>
