<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Arial, sans-serif">
  <rect width="800" height="420" fill="#FFFFFF"/>
  <text x="400" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">USB Camera (UVC) trên Linux</text>

  <!-- camera -->
  <rect x="90" y="150" width="130" height="90" rx="10" fill="#2563EB" opacity="0.1" stroke="#2563EB" stroke-width="2.5"/>
  <circle cx="155" cy="195" r="26" fill="#2563EB" opacity="0.2" stroke="#2563EB" stroke-width="2"/>
  <circle cx="155" cy="195" r="10" fill="#2563EB"/>
  <text x="155" y="265" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Camera USB (UVC)</text>

  <!-- arrow -->
  <line x1="230" y1="195" x2="330" y2="195" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arrowC)"/>
  <defs>
    <marker id="arrowC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- kernel driver -->
  <rect x="340" y="150" width="150" height="90" rx="10" fill="#16A34A" opacity="0.08" stroke="#16A34A" stroke-width="2"/>
  <text x="415" y="188" text-anchor="middle" font-size="12" font-weight="700" fill="#16A34A">uvcvideo</text>
  <text x="415" y="206" text-anchor="middle" font-size="10" fill="#111827">driver có sẵn</text>
  <text x="415" y="222" text-anchor="middle" font-size="10" fill="#111827">trong kernel Linux</text>

  <line x1="490" y1="195" x2="580" y2="195" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arrowC)"/>

  <!-- device node -->
  <rect x="590" y="160" width="150" height="70" rx="8" fill="#F97316" opacity="0.1" stroke="#F97316" stroke-width="2"/>
  <text x="665" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#F97316" font-family="monospace">/dev/video0</text>
  <text x="665" y="210" text-anchor="middle" font-size="10" fill="#111827">OpenCV / ROS2 đọc từ đây</text>

  <rect x="90" y="330" width="620" height="45" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="350" text-anchor="middle" font-size="12" fill="#111827">Không cần cài driver riêng — cắm vào là hệ thống tự tạo</text>
  <text x="400" y="367" text-anchor="middle" font-size="12" fill="#111827">thiết bị /dev/videoN ngay lập tức</text>
</svg>
