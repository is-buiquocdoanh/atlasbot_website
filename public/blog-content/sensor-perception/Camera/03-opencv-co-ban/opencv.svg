<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Arial, sans-serif">
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Pipeline xử lý ảnh cơ bản với OpenCV</text>

  <g font-size="11" fill="#111827">
    <rect x="50" y="120" width="140" height="70" rx="8" fill="#2563EB" opacity="0.1" stroke="#2563EB" stroke-width="2"/>
    <text x="120" y="150" text-anchor="middle" font-weight="700">Khung hình</text>
    <text x="120" y="168" text-anchor="middle" fill="#6B7280">BGR thô</text>

    <line x1="190" y1="155" x2="230" y2="155" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowO)"/>

    <rect x="240" y="120" width="140" height="70" rx="8" fill="#16A34A" opacity="0.1" stroke="#16A34A" stroke-width="2"/>
    <text x="310" y="150" text-anchor="middle" font-weight="700">cvtColor</text>
    <text x="310" y="168" text-anchor="middle" fill="#6B7280">BGR → RGB/xám</text>

    <line x1="380" y1="155" x2="420" y2="155" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowO)"/>

    <rect x="430" y="120" width="140" height="70" rx="8" fill="#F97316" opacity="0.1" stroke="#F97316" stroke-width="2"/>
    <text x="500" y="150" text-anchor="middle" font-weight="700">GaussianBlur</text>
    <text x="500" y="168" text-anchor="middle" fill="#6B7280">giảm nhiễu</text>

    <line x1="570" y1="155" x2="610" y2="155" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowO)"/>

    <rect x="620" y="120" width="140" height="70" rx="8" fill="#DC2626" opacity="0.08" stroke="#DC2626" stroke-width="2"/>
    <text x="690" y="150" text-anchor="middle" font-weight="700">resize</text>
    <text x="690" y="168" text-anchor="middle" fill="#6B7280">đúng input AI</text>
  </g>
  <defs>
    <marker id="arrowO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"/>
    </marker>
  </defs>

  <rect x="90" y="250" width="620" height="60" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="275" text-anchor="middle" font-size="12" fill="#111827">Lưu ý: cv2.VideoCapture đọc ảnh theo BGR, không phải RGB</text>
  <text x="400" y="293" text-anchor="middle" font-size="12" fill="#111827">— quên đổi màu trước khi đưa vào mô hình AI là lỗi phổ biến nhất</text>
</svg>
