<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Arial, sans-serif">
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">V4L2 — lớp trung gian điều khiển camera</text>

  <rect x="80" y="90" width="160" height="80" rx="8" fill="#2563EB" opacity="0.1" stroke="#2563EB" stroke-width="2"/>
  <text x="160" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Camera</text>
  <text x="160" y="145" text-anchor="middle" font-size="10" fill="#6B7280">(UVC qua USB)</text>

  <line x1="240" y1="130" x2="310" y2="130" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arrowV)"/>
  <defs>
    <marker id="arrowV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"/>
    </marker>
  </defs>

  <rect x="320" y="80" width="160" height="100" rx="8" fill="#16A34A" opacity="0.1" stroke="#16A34A" stroke-width="2.5"/>
  <text x="400" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#16A34A">V4L2 API</text>
  <text x="400" y="135" text-anchor="middle" font-size="10" fill="#111827">/dev/video0</text>
  <text x="400" y="152" text-anchor="middle" font-size="10" fill="#111827">độ phân giải, FPS,</text>
  <text x="400" y="167" text-anchor="middle" font-size="10" fill="#111827">định dạng ảnh</text>

  <line x1="480" y1="110" x2="550" y2="110" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowV)"/>
  <line x1="480" y1="150" x2="550" y2="150" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowV)"/>

  <rect x="560" y="80" width="170" height="45" rx="6" fill="#F97316" opacity="0.1" stroke="#F97316" stroke-width="1.5"/>
  <text x="645" y="107" text-anchor="middle" font-size="11" fill="#111827">v4l2_camera (ROS2)</text>

  <rect x="560" y="135" width="170" height="45" rx="6" fill="#F97316" opacity="0.1" stroke="#F97316" stroke-width="1.5"/>
  <text x="645" y="162" text-anchor="middle" font-size="11" fill="#111827">v4l2-ctl (CLI)</text>

  <rect x="90" y="310" width="620" height="50" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="332" text-anchor="middle" font-size="12" fill="#111827">Mọi gói camera ROS2 đều gọi V4L2 phía dưới —</text>
  <text x="400" y="349" text-anchor="middle" font-size="12" fill="#111827">dùng v4l2-ctl để debug trực tiếp, không cần qua ROS2</text>
</svg>
