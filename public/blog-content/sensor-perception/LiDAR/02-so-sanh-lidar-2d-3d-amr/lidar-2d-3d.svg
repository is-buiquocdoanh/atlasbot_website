<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Arial, sans-serif">
  <rect width="800" height="450" fill="#FFFFFF"/>
  <text x="400" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">LiDAR 2D so với LiDAR 3D</text>

  <!-- 2D panel -->
  <rect x="60" y="70" width="320" height="330" rx="10" fill="#2563EB" opacity="0.06" stroke="#2563EB" stroke-width="2"/>
  <text x="220" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#2563EB">LiDAR 2D</text>
  <circle cx="220" cy="230" r="14" fill="#2563EB" opacity="0.2" stroke="#2563EB" stroke-width="2"/>
  <g stroke="#2563EB" stroke-width="1.5" opacity="0.7">
    <line x1="220" y1="230" x2="220" y2="140"/>
    <line x1="220" y1="230" x2="300" y2="180"/>
    <line x1="220" y1="230" x2="320" y2="230"/>
    <line x1="220" y1="230" x2="300" y2="280"/>
    <line x1="220" y1="230" x2="220" y2="320"/>
    <line x1="220" y1="230" x2="140" y2="280"/>
    <line x1="220" y1="230" x2="120" y2="230"/>
    <line x1="220" y1="230" x2="140" y2="180"/>
  </g>
  <ellipse cx="220" cy="230" rx="100" ry="100" fill="none" stroke="#2563EB" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>
  <text x="220" y="360" text-anchor="middle" font-size="11" fill="#111827">1 mặt phẳng quét</text>
  <text x="220" y="378" text-anchor="middle" font-size="11" fill="#6B7280">→ sensor_msgs/LaserScan</text>

  <!-- 3D panel -->
  <rect x="420" y="70" width="320" height="330" rx="10" fill="#16A34A" opacity="0.06" stroke="#16A34A" stroke-width="2"/>
  <text x="580" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#16A34A">LiDAR 3D</text>
  <circle cx="580" cy="235" r="12" fill="#16A34A" opacity="0.2" stroke="#16A34A" stroke-width="2"/>
  <g stroke="#16A34A" stroke-width="1.3" opacity="0.55">
    <ellipse cx="580" cy="200" rx="95" ry="30"/>
    <ellipse cx="580" cy="230" rx="95" ry="35"/>
    <ellipse cx="580" cy="265" rx="95" ry="40"/>
    <ellipse cx="580" cy="300" rx="95" ry="35"/>
  </g>
  <g fill="#DC2626" opacity="0.75">
    <circle cx="500" cy="195" r="2.2"/><circle cx="540" cy="180" r="2.2"/><circle cx="620" cy="185" r="2.2"/>
    <circle cx="660" cy="205" r="2.2"/><circle cx="490" cy="230" r="2.2"/><circle cx="670" cy="235" r="2.2"/>
    <circle cx="500" cy="270" r="2.2"/><circle cx="650" cy="280" r="2.2"/><circle cx="560" cy="300" r="2.2"/>
    <circle cx="610" cy="295" r="2.2"/>
  </g>
  <text x="580" y="360" text-anchor="middle" font-size="11" fill="#111827">Nhiều lớp quét chồng nhau</text>
  <text x="580" y="378" text-anchor="middle" font-size="11" fill="#6B7280">→ sensor_msgs/PointCloud2</text>

  <rect x="90" y="410" width="620" height="0" fill="none"/>
</svg>
