<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Arial, sans-serif">
  <rect width="800" height="420" fill="#FFFFFF"/>
  <text x="400" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Accelerometer: trọng lực → góc nghiêng</text>

  <!-- upright -->
  <g transform="translate(160,120)">
    <rect x="-30" y="-15" width="60" height="90" rx="8" fill="#2563EB" opacity="0.12" stroke="#2563EB" stroke-width="2"/>
    <line x1="0" y1="75" x2="0" y2="160" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arrowA)"/>
    <text x="15" y="140" font-size="10" fill="#DC2626">g ≈ 9.8 m/s²</text>
    <text x="0" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Đứng thẳng</text>
    <text x="0" y="218" text-anchor="middle" font-size="9" fill="#6B7280">Z ≈ 9.8, X ≈ 0</text>
  </g>

  <!-- tilted -->
  <g transform="translate(420,120) rotate(25)">
    <rect x="-30" y="-15" width="60" height="90" rx="8" fill="#16A34A" opacity="0.12" stroke="#16A34A" stroke-width="2"/>
  </g>
  <line x1="420" y1="195" x2="420" y2="280" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arrowA)"/>
  <line x1="420" y1="195" x2="470" y2="270" stroke="#F97316" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="420" y="330" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Nghiêng θ</text>
  <text x="420" y="348" text-anchor="middle" font-size="9" fill="#6B7280">trọng lực chia cả trục X và Z</text>

  <defs>
    <marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect x="600" y="90" width="150" height="230" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="675" y="115" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Lưu ý</text>
  <text x="675" y="145" text-anchor="middle" font-size="10" fill="#111827">Rung động/tăng tốc</text>
  <text x="675" y="163" text-anchor="middle" font-size="10" fill="#111827">làm nhiễu góc tính</text>
  <text x="675" y="181" text-anchor="middle" font-size="10" fill="#111827">được từ accelerometer</text>
  <text x="675" y="215" text-anchor="middle" font-size="10" fill="#111827">→ kết hợp gyroscope</text>
  <text x="675" y="233" text-anchor="middle" font-size="10" fill="#111827">qua bộ lọc để bù trừ</text>
</svg>
