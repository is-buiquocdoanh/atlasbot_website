<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Arial, sans-serif">
  <rect width="800" height="420" fill="#FFFFFF"/>
  <text x="400" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">IMU: accelerometer + gyroscope</text>

  <rect x="320" y="90" width="160" height="90" rx="10" fill="#2563EB" opacity="0.1" stroke="#2563EB" stroke-width="2.5"/>
  <text x="400" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">IMU</text>
  <text x="400" y="150" text-anchor="middle" font-size="10" fill="#6B7280">(VD: MPU6050)</text>

  <line x1="320" y1="130" x2="180" y2="130" stroke="#16A34A" stroke-width="2" marker-end="url(#arrowIm)"/>
  <line x1="480" y1="130" x2="620" y2="130" stroke="#F97316" stroke-width="2" marker-end="url(#arrowIm)"/>
  <defs>
    <marker id="arrowIm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"/>
    </marker>
  </defs>

  <rect x="40" y="90" width="140" height="90" rx="8" fill="#16A34A" opacity="0.08" stroke="#16A34A" stroke-width="2"/>
  <text x="110" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#16A34A">Accelerometer</text>
  <text x="110" y="140" text-anchor="middle" font-size="9" fill="#111827">gia tốc 3 trục</text>
  <text x="110" y="156" text-anchor="middle" font-size="9" fill="#6B7280">→ góc nghiêng tĩnh</text>

  <rect x="620" y="90" width="140" height="90" rx="8" fill="#F97316" opacity="0.08" stroke="#F97316" stroke-width="2"/>
  <text x="690" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#F97316">Gyroscope</text>
  <text x="690" y="140" text-anchor="middle" font-size="9" fill="#111827">vận tốc góc 3 trục</text>
  <text x="690" y="156" text-anchor="middle" font-size="9" fill="#6B7280">→ tốc độ quay</text>

  <!-- robot with wheels vs imu comparison -->
  <rect x="90" y="250" width="620" height="110" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="275" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Kết hợp với encoder bánh xe (EKF) cho odometry chính xác hơn</text>
  <text x="400" y="298" text-anchor="middle" font-size="11" fill="#111827">Encoder: có thể sai khi bánh trượt trên sàn trơn</text>
  <text x="400" y="318" text-anchor="middle" font-size="11" fill="#111827">Gyroscope: đo góc quay thực, không bị ảnh hưởng bởi trượt bánh</text>
  <text x="400" y="340" text-anchor="middle" font-size="11" fill="#6B7280">→ EKF hợp nhất 2 nguồn dữ liệu thành ước lượng vị trí đáng tin cậy hơn</text>
</svg>
