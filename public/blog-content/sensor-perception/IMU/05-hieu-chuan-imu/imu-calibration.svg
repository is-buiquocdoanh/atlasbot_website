<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Arial, sans-serif">
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Hiệu chuẩn IMU: đo và trừ bias</text>

  <rect x="80" y="90" width="280" height="180" rx="8" fill="#DC2626" opacity="0.06" stroke="#DC2626" stroke-width="2"/>
  <text x="220" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#DC2626">Chưa hiệu chuẩn</text>
  <line x1="100" y1="200" x2="340" y2="200" stroke="#E5E9EF" stroke-width="1"/>
  <path d="M 100 200 Q 150 195 200 202 T 340 198" fill="none" stroke="#DC2626" stroke-width="2"/>
  <text x="220" y="240" text-anchor="middle" font-size="10" fill="#111827">Gyro báo lệch dù đứng yên</text>
  <text x="220" y="256" text-anchor="middle" font-size="10" fill="#6B7280">(bias chưa trừ)</text>

  <rect x="440" y="90" width="280" height="180" rx="8" fill="#16A34A" opacity="0.06" stroke="#16A34A" stroke-width="2"/>
  <text x="580" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#16A34A">Đã hiệu chuẩn</text>
  <line x1="460" y1="200" x2="700" y2="200" stroke="#16A34A" stroke-width="2"/>
  <text x="580" y="240" text-anchor="middle" font-size="10" fill="#111827">Gyro báo ≈ 0 khi đứng yên</text>
  <text x="580" y="256" text-anchor="middle" font-size="10" fill="#6B7280">(đã trừ bias trung bình)</text>

  <rect x="90" y="310" width="620" height="55" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="332" text-anchor="middle" font-size="12" fill="#111827">Giữ cảm biến hoàn toàn yên vài giây, lấy trung bình nhiều mẫu</text>
  <text x="400" y="349" text-anchor="middle" font-size="12" fill="#111827">→ trừ giá trị này khỏi mọi lần đọc dữ liệu sau đó</text>
</svg>
