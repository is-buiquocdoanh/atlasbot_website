<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Arial, sans-serif">
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Gyroscope: đo vận tốc góc quay</text>

  <circle cx="220" cy="180" r="70" fill="#2563EB" opacity="0.08" stroke="#2563EB" stroke-width="2"/>
  <rect x="200" y="115" width="40" height="50" rx="6" fill="#2563EB" opacity="0.3"/>
  <path d="M 260 180 A 40 40 0 1 1 220 140" fill="none" stroke="#F97316" stroke-width="2.5" marker-end="url(#arrowG)"/>
  <text x="220" y="270" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Yaw (trục Z)</text>
  <text x="220" y="288" text-anchor="middle" font-size="10" fill="#6B7280">quay tại chỗ, °/giây</text>

  <defs>
    <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F97316"/>
    </marker>
  </defs>

  <rect x="450" y="90" width="280" height="200" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="590" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Tích phân theo thời gian</text>
  <text x="590" y="150" text-anchor="middle" font-size="11" font-family="monospace" fill="#111827">góc = góc_trước</text>
  <text x="590" y="168" text-anchor="middle" font-size="11" font-family="monospace" fill="#111827">  + vận_tốc_góc × Δt</text>
  <line x1="480" y1="195" x2="700" y2="195" stroke="#E5E9EF" stroke-width="1.5"/>
  <text x="590" y="220" text-anchor="middle" font-size="10" fill="#DC2626">Sai số nhỏ mỗi lần đo</text>
  <text x="590" y="238" text-anchor="middle" font-size="10" fill="#DC2626">cộng dồn dần → "drift"</text>
  <text x="590" y="265" text-anchor="middle" font-size="10" fill="#6B7280">Cần kết hợp accelerometer</text>
  <text x="590" y="280" text-anchor="middle" font-size="10" fill="#6B7280">để bù trừ theo thời gian dài</text>
</svg>
