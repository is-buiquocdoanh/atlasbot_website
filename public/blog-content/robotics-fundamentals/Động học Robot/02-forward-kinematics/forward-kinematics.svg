<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="Arial, sans-serif">
  <defs>
    <marker id="fkArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="800" height="440" fill="#FFFFFF"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Forward Kinematics — joint space → Cartesian space</text>

  <rect x="60" y="60" width="280" height="80" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="200" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A8A">Joint space (đã biết)</text>
  <text x="200" y="108" text-anchor="middle" font-size="10" fill="#374151">tốc độ bánh v_L, v_R</text>
  <text x="200" y="124" text-anchor="middle" font-size="10" fill="#374151">hoặc góc khớp θ1, θ2</text>

  <line x1="340" y1="100" x2="460" y2="100" stroke="#111827" stroke-width="2.5" marker-end="url(#fkArrow)"/>
  <text x="400" y="88" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Forward</text>

  <rect x="460" y="60" width="280" height="80" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="600" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Cartesian space (tính ra)</text>
  <text x="600" y="108" text-anchor="middle" font-size="10" fill="#374151">v, ω của robot</text>
  <text x="600" y="124" text-anchor="middle" font-size="10" fill="#374151">hoặc (x, y) đầu tay máy</text>

  <line x1="600" y1="160" x2="600" y2="130" stroke="#DC2626" stroke-width="2" marker-end="url(#fkArrow)" transform="rotate(180 600 145)"/>
  <text x="450" y="185" text-anchor="middle" font-size="9" fill="#DC2626">chiều ngược lại (khó hơn) = Inverse Kinematics</text>

  <text x="400" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Ví dụ: tay máy 2 khớp phẳng</text>

  <line x1="180" y1="360" x2="330" y2="290" stroke="#111827" stroke-width="4" stroke-linecap="round"/>
  <line x1="330" y1="290" x2="440" y2="330" stroke="#111827" stroke-width="4" stroke-linecap="round"/>
  <circle cx="180" cy="360" r="6" fill="#2563EB"/>
  <circle cx="330" cy="290" r="6" fill="#F97316"/>
  <circle cx="440" cy="330" r="6" fill="#16A34A"/>

  <text x="180" y="385" text-anchor="middle" font-size="10" fill="#2563EB">gốc</text>
  <path d="M 220 355 A 40 40 0 0 1 250 320" fill="none" stroke="#2563EB" stroke-width="1.5"/>
  <text x="240" y="345" font-size="10" fill="#2563EB">θ1</text>

  <text x="330" y="270" text-anchor="middle" font-size="10" fill="#F97316">khớp 2</text>
  <path d="M 350 300 A 25 25 0 0 1 370 320" fill="none" stroke="#F97316" stroke-width="1.5"/>
  <text x="378" y="325" font-size="10" fill="#F97316">θ2</text>

  <text x="470" y="335" font-size="10" font-weight="700" fill="#16A34A">(x, y)</text>

  <rect x="500" y="270" width="260" height="120" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="630" y="295" text-anchor="middle" font-size="11" font-family="monospace" fill="#111827">x = L1 cos(θ1)</text>
  <text x="630" y="313" text-anchor="middle" font-size="11" font-family="monospace" fill="#111827">    + L2 cos(θ1+θ2)</text>
  <text x="630" y="336" text-anchor="middle" font-size="11" font-family="monospace" fill="#111827">y = L1 sin(θ1)</text>
  <text x="630" y="354" text-anchor="middle" font-size="11" font-family="monospace" fill="#111827">    + L2 sin(θ1+θ2)</text>
  <text x="630" y="376" text-anchor="middle" font-size="8" fill="#6B7280">luôn ra đúng 1 kết quả</text>
</svg>
