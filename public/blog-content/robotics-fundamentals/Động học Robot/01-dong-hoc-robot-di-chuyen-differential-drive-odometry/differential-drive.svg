<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#FFFFFF"/>

  <!-- Top-down robot body -->
  <rect x="300" y="150" width="120" height="150" rx="16" fill="#F3F5F8" stroke="#111827" stroke-width="2"/>
  <!-- front direction indicator -->
  <polygon points="360,150 348,175 372,175" fill="#2563EB"/>

  <!-- Left wheel -->
  <rect x="270" y="170" width="26" height="60" rx="4" fill="#111827"/>
  <text x="230" y="205" text-anchor="middle" font-size="15" font-weight="600" fill="#2563EB">v_L</text>
  <line x1="245" y1="200" x2="270" y2="200" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- Right wheel -->
  <rect x="424" y="170" width="26" height="60" rx="4" fill="#111827"/>
  <text x="490" y="205" text-anchor="middle" font-size="15" font-weight="600" fill="#F97316">v_R</text>
  <line x1="475" y1="200" x2="450" y2="200" stroke="#F97316" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- Wheel separation dimension line -->
  <line x1="283" y1="250" x2="437" y2="250" stroke="#6B7280" stroke-width="1.5"/>
  <line x1="283" y1="242" x2="283" y2="258" stroke="#6B7280" stroke-width="1.5"/>
  <line x1="437" y1="242" x2="437" y2="258" stroke="#6B7280" stroke-width="1.5"/>
  <text x="360" y="270" text-anchor="middle" font-size="14" fill="#6B7280">L (khoảng cách 2 bánh)</text>

  <!-- Robot center point + resulting velocity vector v and angular omega -->
  <circle cx="360" cy="200" r="4" fill="#111827"/>
  <line x1="360" y1="200" x2="360" y2="120" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arrow4)"/>
  <text x="375" y="130" font-size="15" font-weight="600" fill="#16A34A">v</text>
  <path d="M 385 190 A 30 30 0 0 1 385 210" fill="none" stroke="#16A34A" stroke-width="2" marker-end="url(#arrow4)"/>
  <text x="400" y="205" font-size="14" fill="#16A34A">ω</text>

  <!-- ICC and turning radius -->
  <circle cx="630" cy="200" r="4" fill="#6B7280"/>
  <text x="630" y="185" text-anchor="middle" font-size="12" fill="#6B7280">ICC</text>
  <line x1="360" y1="200" x2="630" y2="200" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="495" y="190" text-anchor="middle" font-size="13" fill="#6B7280">R (bán kính quay)</text>

  <!-- Formulas -->
  <rect x="90" y="330" width="620" height="90" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="358" text-anchor="middle" font-size="15" fill="#111827" font-family="'JetBrains Mono', monospace">v = (v_R + v_L) / 2</text>
  <text x="400" y="382" text-anchor="middle" font-size="15" fill="#111827" font-family="'JetBrains Mono', monospace">ω = (v_R − v_L) / L</text>
  <text x="400" y="405" text-anchor="middle" font-size="12" fill="#6B7280">v: vận tốc dài tại tâm robot · ω: vận tốc góc (quay)</text>
</svg>
