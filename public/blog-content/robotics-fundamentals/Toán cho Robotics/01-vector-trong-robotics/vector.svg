<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="Arial, sans-serif">
  <defs>
    <marker id="vcArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="800" height="440" fill="#FFFFFF"/>
  <text x="400" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Vector vị trí, vận tốc và góc giữa hai vector</text>

  <!-- axes -->
  <line x1="100" y1="330" x2="700" y2="330" stroke="#9CA3AF" stroke-width="1.3"/>
  <line x1="100" y1="330" x2="100" y2="80" stroke="#9CA3AF" stroke-width="1.3"/>
  <text x="705" y="335" font-size="11" fill="#6B7280">x</text>
  <text x="90" y="75" font-size="11" fill="#6B7280">y</text>

  <!-- position vector p -->
  <line x1="100" y1="330" x2="380" y2="160" stroke="#2563EB" stroke-width="2.5" marker-end="url(#vcArrow)"/>
  <text x="395" y="155" font-size="14" font-weight="700" fill="#2563EB">p = (x, y)</text>
  <text x="395" y="172" font-size="10" fill="#6B7280">vector vị trí robot</text>

  <!-- velocity vector v, from tip of p -->
  <line x1="380" y1="160" x2="560" y2="100" stroke="#16A34A" stroke-width="2.5" marker-end="url(#vcArrow)"/>
  <text x="575" y="100" font-size="14" font-weight="700" fill="#16A34A">v = (vx, vy)</text>
  <text x="575" y="118" font-size="10" fill="#6B7280">vector vận tốc</text>

  <!-- angle theta at origin between p and x-axis reference vector b -->
  <line x1="100" y1="330" x2="500" y2="330" stroke="#F97316" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#vcArrow)"/>
  <text x="510" y="335" font-size="12" fill="#F97316">b (hướng tới đích)</text>

  <path d="M 220 300 A 100 100 0 0 0 260 240" fill="none" stroke="#DC2626" stroke-width="2"/>
  <text x="255" y="290" font-size="13" font-weight="700" fill="#DC2626">θ</text>

  <rect x="90" y="365" width="620" height="60" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="388" text-anchor="middle" font-size="13" font-family="monospace" fill="#111827">|v| = √(vx² + vy²)     θ = arccos((a·b) / (|a||b|))</text>
  <text x="400" y="408" text-anchor="middle" font-size="10" fill="#6B7280">độ lớn = định lý Pythagoras · góc giữa 2 vector = dot product</text>
</svg>
