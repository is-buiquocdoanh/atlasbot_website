<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Arial, sans-serif">
  <defs>
    <marker id="mxArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="800" height="420" fill="#FFFFFF"/>
  <text x="400" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Một matrix áp dụng cho mọi điểm giống nhau</text>

  <!-- Before: scattered points -->
  <rect x="60" y="70" width="280" height="220" rx="10" fill="#F3F5F8" stroke="#6B7280" stroke-width="1.5"/>
  <text x="200" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Trước — đám mây điểm LiDAR</text>
  <g fill="#2563EB">
    <circle cx="120" cy="130" r="3"/><circle cx="160" cy="150" r="3"/><circle cx="200" cy="120" r="3"/>
    <circle cx="240" cy="160" r="3"/><circle cx="280" cy="135" r="3"/><circle cx="140" cy="190" r="3"/>
    <circle cx="190" cy="210" r="3"/><circle cx="240" cy="200" r="3"/><circle cx="280" cy="225" r="3"/>
    <circle cx="130" cy="250" r="3"/><circle cx="220" cy="255" r="3"/><circle cx="300" cy="180" r="3"/>
  </g>

  <rect x="330" y="150" width="140" height="70" rx="8" fill="#EDE9FE" stroke="#9333EA" stroke-width="2"/>
  <text x="400" y="178" text-anchor="middle" font-size="11" font-weight="700" font-family="monospace" fill="#6B21A8">M (rotation 15°)</text>
  <text x="400" y="196" text-anchor="middle" font-size="9" fill="#6B7280">áp dụng cho từng điểm</text>

  <line x1="340" y1="180" x2="330" y2="180" stroke="#111827" stroke-width="2"/>
  <line x1="200" y1="290" x2="330" y2="220" stroke="#111827" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="470" y1="180" x2="500" y2="180" stroke="#111827" stroke-width="2" marker-end="url(#mxArrow)"/>

  <!-- After: rotated points -->
  <rect x="500" y="70" width="240" height="220" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="620" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">Sau — đã xoay cùng 1 góc</text>
  <g fill="#16A34A">
    <circle cx="560" cy="140" r="3"/><circle cx="600" cy="120" r="3"/><circle cx="640" cy="140" r="3"/>
    <circle cx="670" cy="170" r="3"/><circle cx="695" cy="150" r="3"/><circle cx="550" cy="190" r="3"/>
    <circle cx="590" cy="220" r="3"/><circle cx="630" cy="230" r="3"/><circle cx="670" cy="245" r="3"/>
    <circle cx="540" cy="245" r="3"/><circle cx="610" cy="260" r="3"/><circle cx="700" cy="200" r="3"/>
  </g>

  <rect x="90" y="320" width="620" height="80" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="345" text-anchor="middle" font-size="13" font-family="monospace" fill="#111827">| cos θ  −sin θ |   | x |     | x' |</text>
  <text x="400" y="365" text-anchor="middle" font-size="13" font-family="monospace" fill="#111827">| sin θ   cos θ | × | y |  =  | y' |</text>
  <text x="400" y="388" text-anchor="middle" font-size="10" fill="#6B7280">cùng 1 phép nhân matrix, áp dụng cho mọi điểm trong tập</text>
</svg>
