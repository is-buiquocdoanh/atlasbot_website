<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="Arial, sans-serif">
  <defs>
    <marker id="csArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="800" height="440" fill="#FFFFFF"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">4 hệ toạ độ trong một robot di động</text>

  <rect x="60" y="60" width="200" height="90" rx="10" fill="#EDE9FE" stroke="#9333EA" stroke-width="2"/>
  <text x="160" y="85" text-anchor="middle" font-size="12" font-weight="700" font-family="monospace" fill="#6B21A8">map</text>
  <text x="160" y="105" text-anchor="middle" font-size="9" fill="#374151">tuyệt đối, chính xác dài hạn</text>
  <text x="160" y="120" text-anchor="middle" font-size="9" fill="#374151">hiệu chỉnh bằng AMCL/SLAM</text>
  <text x="160" y="135" text-anchor="middle" font-size="8" fill="#6B7280">cập nhật không liên tục</text>

  <line x1="160" y1="150" x2="160" y2="180" stroke="#111827" stroke-width="2" marker-end="url(#csArrow)"/>
  <text x="175" y="168" font-size="8" fill="#6B7280">transform</text>

  <rect x="60" y="185" width="200" height="90" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="160" y="210" text-anchor="middle" font-size="12" font-weight="700" font-family="monospace" fill="#92400E">odom</text>
  <text x="160" y="230" text-anchor="middle" font-size="9" fill="#374151">mượt, tần số cao</text>
  <text x="160" y="245" text-anchor="middle" font-size="9" fill="#374151">cập nhật bằng odometry</text>
  <text x="160" y="260" text-anchor="middle" font-size="8" fill="#7F1D1D">trôi dần theo thời gian</text>

  <line x1="160" y1="275" x2="160" y2="305" stroke="#111827" stroke-width="2" marker-end="url(#csArrow)"/>
  <text x="175" y="293" font-size="8" fill="#6B7280">transform</text>

  <rect x="60" y="310" width="200" height="90" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="160" y="335" text-anchor="middle" font-size="12" font-weight="700" font-family="monospace" fill="#1E3A8A">base_link</text>
  <text x="160" y="355" text-anchor="middle" font-size="9" fill="#374151">gắn chết vào thân robot</text>
  <text x="160" y="370" text-anchor="middle" font-size="9" fill="#374151">gốc tại tâm robot</text>
  <text x="160" y="385" text-anchor="middle" font-size="8" fill="#6B7280">x hướng về phía trước</text>

  <line x1="260" y1="355" x2="330" y2="355" stroke="#111827" stroke-width="1.5" marker-end="url(#csArrow)"/>

  <rect x="335" y="310" width="220" height="90" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="445" y="335" text-anchor="middle" font-size="12" font-weight="700" font-family="monospace" fill="#166534">lidar_link</text>
  <text x="445" y="355" text-anchor="middle" font-size="9" fill="#374151">gắn tại vị trí LiDAR thật</text>
  <text x="445" y="370" text-anchor="middle" font-size="9" fill="#374151">cố định so với base_link</text>

  <rect x="580" y="150" width="180" height="250" rx="10" fill="#F3F5F8" stroke="#6B7280" stroke-width="1.5"/>
  <text x="670" y="175" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Câu hỏi mỗi hệ</text>
  <text x="670" y="195" text-anchor="middle" font-size="10" fill="#374151">map: đang ở đâu</text>
  <text x="670" y="211" text-anchor="middle" font-size="10" fill="#374151">trên bản đồ?</text>
  <text x="670" y="235" text-anchor="middle" font-size="10" fill="#374151">odom: vừa di chuyển</text>
  <text x="670" y="251" text-anchor="middle" font-size="10" fill="#374151">bao xa, hướng nào?</text>
  <text x="670" y="275" text-anchor="middle" font-size="10" fill="#374151">base_link: cảm biến</text>
  <text x="670" y="291" text-anchor="middle" font-size="10" fill="#374151">gắn ở đâu trên robot?</text>
  <text x="670" y="315" text-anchor="middle" font-size="10" fill="#374151">lidar_link: dữ liệu</text>
  <text x="670" y="331" text-anchor="middle" font-size="10" fill="#374151">quét nhìn từ góc nào?</text>

</svg>
