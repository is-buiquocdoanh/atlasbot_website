<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Arial, sans-serif">
  <defs>
    <marker id="tfArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="800" height="420" fill="#FFFFFF"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Chuỗi transform nối tiếp = nhân matrix liên tiếp</text>

  <rect x="40" y="70" width="150" height="55" rx="8" fill="#EDE9FE" stroke="#9333EA" stroke-width="2"/>
  <text x="115" y="102" text-anchor="middle" font-size="13" font-weight="700" font-family="monospace" fill="#6B21A8">map</text>

  <line x1="190" y1="97" x2="240" y2="97" stroke="#111827" stroke-width="2" marker-end="url(#tfArrow)"/>
  <text x="215" y="85" text-anchor="middle" font-size="9" fill="#6B7280">T1</text>

  <rect x="245" y="70" width="150" height="55" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="320" y="102" text-anchor="middle" font-size="13" font-weight="700" font-family="monospace" fill="#92400E">odom</text>

  <line x1="395" y1="97" x2="445" y2="97" stroke="#111827" stroke-width="2" marker-end="url(#tfArrow)"/>
  <text x="420" y="85" text-anchor="middle" font-size="9" fill="#6B7280">T2</text>

  <rect x="450" y="70" width="150" height="55" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="525" y="102" text-anchor="middle" font-size="13" font-weight="700" font-family="monospace" fill="#1E3A8A">base_link</text>

  <line x1="600" y1="97" x2="650" y2="97" stroke="#111827" stroke-width="2" marker-end="url(#tfArrow)"/>
  <text x="625" y="85" text-anchor="middle" font-size="9" fill="#6B7280">T3</text>

  <rect x="655" y="70" width="120" height="55" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="715" y="102" text-anchor="middle" font-size="12" font-weight="700" font-family="monospace" fill="#166534">lidar_link</text>

  <rect x="90" y="155" width="620" height="70" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="180" text-anchor="middle" font-size="12" font-family="monospace" fill="#111827">T_map→lidar = T1 × T2 × T3</text>
  <text x="400" y="200" text-anchor="middle" font-size="10" fill="#6B7280">= T_map→odom × T_odom→base_link × T_base_link→lidar</text>

  <text x="400" y="255" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Ba tầng tần số cập nhật khác nhau</text>

  <rect x="60" y="270" width="220" height="65" rx="8" fill="#FFFFFF" stroke="#9333EA" stroke-width="1.5"/>
  <text x="170" y="292" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">map → odom</text>
  <text x="170" y="310" text-anchor="middle" font-size="9" fill="#6B7280">AMCL/SLAM — cập nhật thưa</text>

  <rect x="290" y="270" width="220" height="65" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <text x="400" y="292" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">odom → base_link</text>
  <text x="400" y="310" text-anchor="middle" font-size="9" fill="#6B7280">odometry — cập nhật liên tục</text>

  <rect x="520" y="270" width="220" height="65" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
  <text x="630" y="292" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">base_link → lidar_link</text>
  <text x="630" y="310" text-anchor="middle" font-size="9" fill="#6B7280">static — đo 1 lần, cố định</text>
</svg>
