<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Arial, sans-serif">
  <defs>
    <marker id="qtArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="800" height="420" fill="#FFFFFF"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Quaternion — một trục, một góc</text>

  <ellipse cx="380" cy="200" rx="160" ry="90" fill="#F3F5F8" stroke="#9CA3AF" stroke-width="1.3" stroke-dasharray="4 3"/>

  <!-- rotation axis -->
  <line x1="250" y1="270" x2="500" y2="130" stroke="#DC2626" stroke-width="2.5" marker-end="url(#qtArrow)"/>
  <text x="510" y="120" font-size="12" font-weight="700" fill="#DC2626">trục xoay (x, y, z)</text>

  <!-- object before/after rotation -->
  <rect x="330" y="185" width="60" height="35" rx="6" fill="#2563EB" opacity="0.85"/>
  <text x="360" y="235" text-anchor="middle" font-size="9" fill="#6B7280">vị trí ban đầu</text>

  <path d="M 390 202 A 70 70 0 0 1 420 260" fill="none" stroke="#16A34A" stroke-width="2" marker-end="url(#qtArrow)"/>
  <rect x="410" y="255" width="60" height="35" rx="6" fill="#16A34A" opacity="0.85" transform="rotate(35 440 272)"/>
  <text x="440" y="315" text-anchor="middle" font-size="12" font-weight="700" fill="#16A34A">θ — góc xoay quanh trục</text>

  <rect x="90" y="330" width="620" height="80" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="356" text-anchor="middle" font-size="13" font-family="monospace" fill="#111827">q = (trục × sin(θ/2), cos(θ/2)) = (x, y, z, w)</text>
  <text x="400" y="378" text-anchor="middle" font-size="12" font-family="monospace" fill="#111827">ràng buộc: x² + y² + z² + w² = 1</text>
  <text x="400" y="398" text-anchor="middle" font-size="9" fill="#6B7280">1 phép xoay duy nhất — không có điểm kỳ dị như Euler angles</text>
</svg>
