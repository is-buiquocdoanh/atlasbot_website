<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#FFFFFF"/>

  <!-- Sense (top) -->
  <circle cx="400" cy="110" r="80" fill="#2563EB" opacity="0.08" stroke="#2563EB" stroke-width="2.5"/>
  <text x="400" y="105" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Cảm biến</text>
  <text x="400" y="128" text-anchor="middle" font-size="12" fill="#6B7280">Sense</text>

  <!-- Think (bottom-left) -->
  <circle cx="230" cy="320" r="80" fill="#F97316" opacity="0.08" stroke="#F97316" stroke-width="2.5"/>
  <text x="230" y="315" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Xử lý</text>
  <text x="230" y="338" text-anchor="middle" font-size="12" fill="#6B7280">Think</text>

  <!-- Act (bottom-right) -->
  <circle cx="570" cy="320" r="80" fill="#16A34A" opacity="0.08" stroke="#16A34A" stroke-width="2.5"/>
  <text x="570" y="315" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Điều khiển</text>
  <text x="570" y="338" text-anchor="middle" font-size="12" fill="#6B7280">Act</text>

  <!-- Arrows forming the loop -->
  <path d="M 345 165 A 250 250 0 0 0 250 245" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow3)"/>
  <path d="M 310 320 L 490 320" fill="none" stroke="#F97316" stroke-width="3" marker-end="url(#arrow3)"/>
  <path d="M 550 245 A 250 250 0 0 0 455 165" fill="none" stroke="#16A34A" stroke-width="3" marker-end="url(#arrow3)"/>

  <text x="255" y="200" font-size="12" fill="#6B7280">encoder, IMU,</text>
  <text x="255" y="215" font-size="12" fill="#6B7280">LiDAR đọc dữ liệu</text>

  <text x="400" y="305" text-anchor="middle" font-size="12" fill="#6B7280">tính toán, ra quyết định</text>

  <text x="500" y="200" text-anchor="end" font-size="12" fill="#6B7280">gửi lệnh xuống</text>
  <text x="500" y="215" text-anchor="end" font-size="12" fill="#6B7280">động cơ / cơ cấu chấp hành</text>

  <!-- center loop frequency note -->
  <text x="400" y="405" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Vòng lặp lặp lại liên tục, thường vài chục–vài trăm Hz</text>
  <text x="400" y="425" text-anchor="middle" font-size="12" fill="#6B7280">Loop rate càng cao → robot phản ứng càng nhanh, mượt</text>
</svg>
