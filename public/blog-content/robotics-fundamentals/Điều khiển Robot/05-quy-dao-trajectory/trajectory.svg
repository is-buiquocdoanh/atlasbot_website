<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Arial, sans-serif">
  <rect width="800" height="420" fill="#FFFFFF"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Path (chỉ vị trí) vs Trajectory (vị trí + thời gian)</text>

  <text x="205" y="65" text-anchor="middle" font-size="13" font-weight="700" fill="#9A3412">Path — planner_server</text>
  <g fill="#F97316">
    <circle cx="80" cy="150" r="5"/><circle cx="160" cy="140" r="5"/><circle cx="240" cy="160" r="5"/>
    <circle cx="300" cy="130" r="5"/><circle cx="360" cy="150" r="5"/>
  </g>
  <path d="M 80 150 L 160 140 L 240 160 L 300 130 L 360 150" fill="none" stroke="#F97316" stroke-width="2"/>
  <text x="80" y="180" font-size="9" fill="#6B7280">(0,0)</text>
  <text x="330" y="180" font-size="9" fill="#6B7280">(4,1)</text>
  <text x="220" y="210" text-anchor="middle" font-size="10" fill="#7C2D12">chỉ chuỗi vị trí — không biết đi qua đâu vào lúc nào</text>

  <text x="600" y="65" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Trajectory — controller_server</text>
  <g fill="#16A34A">
    <circle cx="470" cy="150" r="5"/><circle cx="550" cy="140" r="5"/><circle cx="630" cy="160" r="5"/>
    <circle cx="690" cy="130" r="5"/><circle cx="750" cy="150" r="5"/>
  </g>
  <path d="M 470 150 L 550 140 L 630 160 L 690 130 L 750 150" fill="none" stroke="#16A34A" stroke-width="2"/>
  <text x="470" y="115" font-size="9" fill="#166534">t=0</text>
  <text x="550" y="115" font-size="9" fill="#166534">t=1.2s</text>
  <text x="630" y="180" font-size="9" fill="#166534">t=2.8s</text>
  <text x="690" y="115" font-size="9" fill="#166534">t=4.1s</text>
  <text x="750" y="180" font-size="9" fill="#166534">t=5.5s</text>

  <rect x="80" y="250" width="640" height="60" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="400" y="285" text-anchor="middle" font-size="11" fill="#1E3A8A">Cùng 1 path → vô số trajectory khác nhau (đi nhanh/chậm dọc path đó)</text>

  <rect x="90" y="330" width="620" height="70" rx="8" fill="#FFEDD5" stroke="#F97316" stroke-width="1.3"/>
  <text x="400" y="355" text-anchor="middle" font-size="11" font-weight="700" fill="#9A3412">Vì sao cần chiều thời gian?</text>
  <text x="400" y="375" text-anchor="middle" font-size="10" fill="#7C2D12">Né vật cản động (người đi bộ) cần biết robot ở điểm nào VÀO LÚC NÀO</text>
  <text x="400" y="391" text-anchor="middle" font-size="9" fill="#7C2D12">để so khớp với vị trí dự đoán của vật cản tại đúng thời điểm đó</text>
</svg>
