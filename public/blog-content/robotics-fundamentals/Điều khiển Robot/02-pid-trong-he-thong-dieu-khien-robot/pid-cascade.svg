<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Arial, sans-serif">
  <defs>
    <marker id="ccArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="800" height="420" fill="#FFFFFF"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Cascade control — vòng ngoài ra lệnh cho vòng trong</text>

  <rect x="120" y="60" width="560" height="90" rx="10" fill="#EDE9FE" stroke="#9333EA" stroke-width="2"/>
  <text x="400" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#6B21A8">Nav2 controller_server — 10-50Hz</text>
  <text x="400" y="110" text-anchor="middle" font-size="10" fill="#374151">tính v, ω mong muốn để bám path, né vật cản</text>
  <text x="400" y="128" text-anchor="middle" font-size="9" fill="#6B7280">không cần biết PWM hay đặc tính động cơ</text>

  <line x1="400" y1="150" x2="400" y2="185" stroke="#111827" stroke-width="2.5" marker-end="url(#ccArrow)"/>
  <text x="420" y="172" font-size="10" font-weight="700" fill="#111827">/cmd_vel (v, ω)</text>

  <rect x="120" y="190" width="560" height="90" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="400" y="218" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A8A">PID velocity control (MCU) — 100Hz-1kHz</text>
  <text x="400" y="240" text-anchor="middle" font-size="10" fill="#374151">giữ tốc độ từng bánh bám đúng v, ω vừa nhận</text>
  <text x="400" y="258" text-anchor="middle" font-size="9" fill="#6B7280">không cần biết path planning hay costmap</text>

  <line x1="400" y1="280" x2="400" y2="315" stroke="#111827" stroke-width="2.5" marker-end="url(#ccArrow)"/>
  <text x="440" y="302" font-size="10" font-weight="700" fill="#111827">PWM</text>

  <rect x="280" y="320" width="240" height="55" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="400" y="353" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Motor + Driver</text>

</svg>
