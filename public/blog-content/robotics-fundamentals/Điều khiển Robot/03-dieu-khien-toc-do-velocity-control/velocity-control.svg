<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Arial, sans-serif">
  <defs>
    <marker id="vlArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Vòng lặp closed-loop velocity control</text>

  <rect x="40" y="150" width="160" height="60" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="120" y="175" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">tốc độ mong muốn</text>
  <text x="120" y="193" text-anchor="middle" font-size="9" fill="#374151">từ /cmd_vel</text>

  <line x1="200" y1="180" x2="255" y2="180" stroke="#111827" stroke-width="2" marker-end="url(#vlArrow)"/>
  <text x="225" y="168" text-anchor="middle" font-size="9" fill="#6B7280">error</text>

  <circle cx="260" cy="180" r="18" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
  <text x="260" y="185" text-anchor="middle" font-size="14" fill="#DC2626">−</text>

  <line x1="278" y1="180" x2="330" y2="180" stroke="#111827" stroke-width="2" marker-end="url(#vlArrow)"/>

  <rect x="335" y="150" width="140" height="60" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="405" y="175" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">PID</text>
  <text x="405" y="193" text-anchor="middle" font-size="9" fill="#374151">tính PWM</text>

  <line x1="475" y1="180" x2="530" y2="180" stroke="#111827" stroke-width="2" marker-end="url(#vlArrow)"/>

  <rect x="535" y="150" width="140" height="60" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="605" y="175" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">Motor + Driver</text>
  <text x="605" y="193" text-anchor="middle" font-size="9" fill="#374151">quay theo PWM</text>

  <line x1="605" y1="210" x2="605" y2="280" stroke="#111827" stroke-width="2"/>
  <line x1="605" y1="280" x2="260" y2="280" stroke="#111827" stroke-width="2"/>
  <line x1="260" y1="280" x2="260" y2="200" stroke="#111827" stroke-width="2" marker-end="url(#vlArrow)"/>

  <rect x="470" y="255" width="140" height="50" rx="8" fill="#F3F5F8" stroke="#6B7280" stroke-width="1.5"/>
  <text x="540" y="285" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Encoder</text>
  <text x="150" y="298" text-anchor="middle" font-size="9" fill="#6B7280">tốc độ thực tế đo được — phản hồi liên tục về vòng so sánh</text>

  <rect x="90" y="330" width="620" height="55" rx="8" fill="#FFEDD5" stroke="#F97316" stroke-width="1.3"/>
  <text x="400" y="353" text-anchor="middle" font-size="11" font-weight="700" fill="#9A3412">Không có encoder = open-loop</text>
  <text x="400" y="372" text-anchor="middle" font-size="10" fill="#7C2D12">PWM cố định không tự bù được khi tải nặng/nhẹ, sàn nghiêng, pin yếu dần</text>
</svg>
