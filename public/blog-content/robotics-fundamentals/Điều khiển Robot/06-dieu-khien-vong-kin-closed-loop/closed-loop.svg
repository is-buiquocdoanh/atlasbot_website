<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Arial, sans-serif">
  <defs>
    <marker id="clArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="800" height="380" fill="#FFFFFF"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Open-loop vs Closed-loop</text>

  <text x="185" y="65" text-anchor="middle" font-size="13" font-weight="700" fill="#9A3412">Open-loop</text>
  <rect x="60" y="80" width="120" height="55" rx="8" fill="#FFEDD5" stroke="#F97316" stroke-width="2"/>
  <text x="120" y="112" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Lệnh</text>

  <line x1="180" y1="107" x2="220" y2="107" stroke="#111827" stroke-width="2" marker-end="url(#clArrow)"/>

  <rect x="225" y="80" width="120" height="55" rx="8" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  <text x="285" y="112" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Hệ thống</text>

  <line x1="345" y1="107" x2="385" y2="107" stroke="#111827" stroke-width="2" marker-end="url(#clArrow)"/>
  <text x="365" y="150" text-anchor="middle" font-size="9" fill="#7C2D12">không đo lại</text>

  <rect x="90" y="155" width="270" height="30" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.3"/>
  <text x="225" y="175" text-anchor="middle" font-size="9" fill="#7F1D1D">không tự sửa sai khi thực tế khác giả định</text>

  <text x="605" y="65" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Closed-loop</text>
  <rect x="480" y="80" width="120" height="55" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="540" y="112" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Lệnh</text>

  <line x1="600" y1="107" x2="640" y2="107" stroke="#111827" stroke-width="2" marker-end="url(#clArrow)"/>

  <rect x="645" y="80" width="120" height="55" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/>
  <text x="705" y="112" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Hệ thống</text>

  <path d="M 705 135 L 705 220 L 540 220 L 540 200" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#clArrow)"/>
  <text x="620" y="240" text-anchor="middle" font-size="9" fill="#166534">đo kết quả thực tế, phản hồi ngược</text>

  <rect x="480" y="175" width="120" height="35" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.3"/>
  <text x="540" y="197" text-anchor="middle" font-size="9" font-weight="700" fill="#1E3A8A">So sánh + sửa</text>

  <rect x="90" y="270" width="620" height="90" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="295" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Cùng 1 cấu trúc — khác đại lượng đo, khác tần số</text>
  <text x="400" y="315" text-anchor="middle" font-size="9" fill="#374151">Velocity control: encoder, ~1kHz · Nav2: odometry/AMCL, ~10-50Hz</text>
  <text x="400" y="333" text-anchor="middle" font-size="9" fill="#374151">AMCL: laser scan, vài Hz · Sạc pin: điện áp, liên tục nhưng chậm</text>
  <text x="400" y="351" text-anchor="middle" font-size="8" fill="#6B7280">tune sai → dao động thay vì ổn định</text>
</svg>
