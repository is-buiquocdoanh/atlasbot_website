<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Arial, sans-serif">
  <rect width="800" height="460" fill="#FFFFFF"/>
  <text x="400" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">AMCL — particle filter hội tụ dần</text>

  <rect x="30" y="65" width="230" height="220" rx="10" fill="#F3F5F8" stroke="#6B7280" stroke-width="1.5"/>
  <text x="145" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">1. Predict</text>
  <text x="145" y="338" text-anchor="middle" font-size="10" fill="#6B7280">hạt rải đều, di chuyển</text>
  <text x="145" y="352" text-anchor="middle" font-size="10" fill="#6B7280">theo odometry</text>
  <g fill="#DC2626" opacity="0.65">
    <circle cx="60" cy="90" r="3"/><circle cx="95" cy="110" r="3"/><circle cx="140" cy="80" r="3"/>
    <circle cx="180" cy="105" r="3"/><circle cx="220" cy="95" r="3"/><circle cx="75" cy="140" r="3"/>
    <circle cx="120" cy="150" r="3"/><circle cx="165" cy="135" r="3"/><circle cx="210" cy="150" r="3"/>
    <circle cx="50" cy="180" r="3"/><circle cx="100" cy="190" r="3"/><circle cx="150" cy="200" r="3"/>
    <circle cx="195" cy="185" r="3"/><circle cx="230" cy="200" r="3"/><circle cx="70" cy="230" r="3"/>
    <circle cx="130" cy="240" r="3"/><circle cx="175" cy="255" r="3"/><circle cx="215" cy="240" r="3"/>
  </g>

  <rect x="285" y="65" width="230" height="220" rx="10" fill="#F3F5F8" stroke="#6B7280" stroke-width="1.5"/>
  <text x="400" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">2. Update</text>
  <text x="400" y="338" text-anchor="middle" font-size="10" fill="#6B7280">so khớp scan dự đoán</text>
  <text x="400" y="352" text-anchor="middle" font-size="10" fill="#6B7280">với scan LiDAR thật</text>
  <g fill="#DC2626" opacity="0.5">
    <circle cx="315" cy="100" r="2.5"/><circle cx="480" cy="110" r="2.5"/><circle cx="325" cy="250" r="2.5"/>
    <circle cx="470" cy="240" r="2.5"/><circle cx="305" cy="180" r="2.5"/>
  </g>
  <g fill="#F97316" opacity="0.85">
    <circle cx="375" cy="160" r="3.5"/><circle cx="410" cy="150" r="3.5"/><circle cx="395" cy="180" r="3.5"/>
    <circle cx="420" cy="170" r="3.5"/><circle cx="370" cy="185" r="3.5"/>
  </g>
  <text x="400" y="200" text-anchor="middle" font-size="8" fill="#9A3412">trọng số cao hơn = khớp tốt hơn</text>

  <rect x="540" y="65" width="230" height="220" rx="10" fill="#F3F5F8" stroke="#6B7280" stroke-width="1.5"/>
  <text x="655" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">3. Resample</text>
  <text x="655" y="338" text-anchor="middle" font-size="10" fill="#6B7280">loại hạt yếu, nhân bản</text>
  <text x="655" y="352" text-anchor="middle" font-size="10" fill="#6B7280">hạt mạnh — hội tụ</text>
  <g fill="#16A34A" opacity="0.85">
    <circle cx="650" cy="170" r="3"/><circle cx="657" cy="165" r="3"/><circle cx="653" cy="178" r="3"/>
    <circle cx="660" cy="172" r="3"/><circle cx="645" cy="175" r="3"/><circle cx="655" cy="160" r="3"/>
  </g>
  <circle cx="655" cy="170" r="7" fill="#2563EB"/>
  <text x="655" y="200" text-anchor="middle" font-size="9" fill="#2563EB">vị trí ước lượng</text>

  <rect x="90" y="395" width="620" height="55" rx="8" fill="#EDE9DE" stroke="#9333EA" stroke-width="1.3"/>
  <text x="400" y="418" text-anchor="middle" font-size="10" font-weight="700" fill="#6B21A8">Adaptive (KLD-sampling): nhiều hạt khi chưa chắc chắn, ít hạt dần khi đã hội tụ</text>
  <text x="400" y="436" text-anchor="middle" font-size="9" fill="#6B7280">tải tính toán biến thiên — quan trọng khi chạy trên Raspberry Pi 4 / Jetson Orin Nano</text>
</svg>
