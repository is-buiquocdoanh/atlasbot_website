<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Arial, sans-serif">
  <defs>
    <marker id="sfArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Sensor Fusion — cân trọng số theo độ tin cậy</text>

  <rect x="40" y="70" width="220" height="90" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="150" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A8A">Odometry</text>
  <text x="150" y="115" text-anchor="middle" font-size="9" fill="#374151">x, y đáng tin</text>
  <text x="150" y="132" text-anchor="middle" font-size="9" fill="#7F1D1D">yaw kém tin (trượt bánh)</text>

  <rect x="40" y="180" width="220" height="90" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="150" y="205" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">IMU (gyroscope)</text>
  <text x="150" y="225" text-anchor="middle" font-size="9" fill="#374151">yaw, vyaw đáng tin</text>
  <text x="150" y="242" text-anchor="middle" font-size="9" fill="#7F1D1D">vị trí kém tin (tích phân kép)</text>

  <line x1="260" y1="115" x2="330" y2="180" stroke="#111827" stroke-width="2" marker-end="url(#sfArrow)"/>
  <line x1="260" y1="225" x2="330" y2="200" stroke="#111827" stroke-width="2" marker-end="url(#sfArrow)"/>

  <rect x="335" y="140" width="200" height="90" rx="10" fill="#EDE9FE" stroke="#9333EA" stroke-width="2"/>
  <text x="435" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#6B21A8">EKF / UKF</text>
  <text x="435" y="192" text-anchor="middle" font-size="9" fill="#374151">robot_localization</text>
  <text x="435" y="208" text-anchor="middle" font-size="9" fill="#374151">tự cân trọng số theo config</text>

  <line x1="535" y1="185" x2="600" y2="185" stroke="#111827" stroke-width="2" marker-end="url(#sfArrow)"/>

  <rect x="605" y="150" width="155" height="70" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="682" y="180" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">Ước lượng tốt hơn</text>
  <text x="682" y="198" text-anchor="middle" font-size="9" fill="#374151">mỗi nguồn riêng lẻ</text>

  <rect x="90" y="300" width="620" height="75" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="325" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">odom0_config: [x, y ✓]  [yaw ✗]     imu0_config: [yaw ✓, vyaw ✓]</text>
  <text x="400" y="347" text-anchor="middle" font-size="10" fill="#6B7280">chỉ tin đúng trường dữ liệu nguồn đó đáng tin nhất, không cộng trung bình tất cả</text>
  <text x="400" y="365" text-anchor="middle" font-size="9" fill="#6B7280">có thể mở rộng thêm GPS, visual odometry, AMCL — cùng nguyên tắc</text>
</svg>
