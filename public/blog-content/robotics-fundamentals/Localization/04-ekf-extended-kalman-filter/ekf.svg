<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Arial, sans-serif">
  <defs>
    <marker id="ekfArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="800" height="420" fill="#FFFFFF"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Vòng lặp Predict — Update</text>

  <!-- ellipse sequence showing growing/shrinking uncertainty -->
  <ellipse cx="130" cy="180" rx="22" ry="16" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="130" y="215" text-anchor="middle" font-size="9" fill="#166534">tự tin cao</text>

  <line x1="160" y1="180" x2="220" y2="180" stroke="#111827" stroke-width="2" marker-end="url(#ekfArrow)"/>
  <text x="190" y="168" text-anchor="middle" font-size="9" font-weight="700" fill="#2563EB">PREDICT</text>

  <ellipse cx="290" cy="180" rx="42" ry="30" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="290" y="225" text-anchor="middle" font-size="9" fill="#92400E">phình to (dead reckoning)</text>

  <line x1="335" y1="180" x2="400" y2="180" stroke="#111827" stroke-width="2" marker-end="url(#ekfArrow)"/>
  <text x="368" y="168" text-anchor="middle" font-size="9" font-weight="700" fill="#DC2626">UPDATE</text>

  <ellipse cx="470" cy="180" rx="26" ry="19" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="470" y="215" text-anchor="middle" font-size="9" fill="#1E3A8A">co lại (đo mới)</text>

  <line x1="500" y1="180" x2="560" y2="180" stroke="#111827" stroke-width="2" marker-end="url(#ekfArrow)"/>
  <text x="530" y="168" text-anchor="middle" font-size="9" font-weight="700" fill="#2563EB">PREDICT</text>

  <ellipse cx="640" cy="180" rx="40" ry="28" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="640" y="222" text-anchor="middle" font-size="9" fill="#92400E">phình to lại...</text>

  <path d="M 660 210 A 60 60 0 0 1 690 260" stroke="#6B7280" stroke-width="1.3" fill="none" stroke-dasharray="3 3"/>
  <text x="720" y="260" font-size="9" fill="#6B7280">lặp lại</text>

  <rect x="90" y="290" width="620" height="115" rx="10" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="315" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Kalman Gain — trọng số tính động, không cố định</text>
  <text x="400" y="337" text-anchor="middle" font-size="10" fill="#374151">Phép đo mới càng ít nhiễu so với độ không chắc chắn hiện tại</text>
  <text x="400" y="354" text-anchor="middle" font-size="10" fill="#374151">→ trọng số dành cho nó càng cao khi cập nhật ước lượng</text>
  <text x="400" y="378" text-anchor="middle" font-size="9" fill="#6B7280">EKF = Kalman Filter + tuyến tính hoá cục bộ (Jacobian) cho hệ phi tuyến</text>
  <text x="400" y="394" text-anchor="middle" font-size="9" fill="#6B7280">UKF = cách xấp xỉ khác, không cần đạo hàm — cả hai đều có trong robot_localization</text>
</svg>
