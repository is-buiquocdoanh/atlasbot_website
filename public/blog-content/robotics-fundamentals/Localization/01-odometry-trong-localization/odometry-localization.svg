<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Arial, sans-serif">
  <defs>
    <marker id="odArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="800" height="420" fill="#FFFFFF"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Dead Reckoning — sai số tích luỹ theo thời gian</text>

  <line x1="60" y1="200" x2="740" y2="200" stroke="#E5E9EF" stroke-width="1"/>

  <!-- true path -->
  <path d="M 80 200 Q 250 130 420 160 T 720 100" fill="none" stroke="#16A34A" stroke-width="2.5"/>
  <text x="720" y="90" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">quỹ đạo thật</text>

  <!-- estimated path drifting away -->
  <path d="M 80 200 Q 250 140 420 190 T 700 260" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="700" y="285" text-anchor="middle" font-size="10" font-weight="700" fill="#7F1D1D">ước lượng odometry (trôi dần)</text>

  <circle cx="80" cy="200" r="6" fill="#111827"/>
  <text x="80" y="225" text-anchor="middle" font-size="9" fill="#111827">xuất phát (đã biết)</text>

  <path d="M 720 100 L 700 260" stroke="#F97316" stroke-width="1.3" stroke-dasharray="3 3"/>
  <text x="770" y="180" text-anchor="middle" font-size="9" font-weight="700" fill="#F97316">sai số</text>
  <text x="770" y="195" text-anchor="middle" font-size="9" font-weight="700" fill="#F97316">tích luỹ</text>

  <rect x="90" y="320" width="620" height="80" rx="10" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="345" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Đặc điểm chung của mọi dead reckoning</text>
  <text x="400" y="367" text-anchor="middle" font-size="10" fill="#374151">Không cần landmark/tín hiệu ngoài — nhưng sai số luôn cộng dồn không giới hạn</text>
  <text x="400" y="386" text-anchor="middle" font-size="9" fill="#6B7280">cần một nguồn "neo" tuyệt đối bên ngoài (AMCL/SLAM) để triệt tiêu sai số này</text>
</svg>
