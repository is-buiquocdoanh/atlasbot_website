<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Arial, sans-serif">
  <rect width="800" height="450" fill="#FFFFFF"/>
  <line x1="400" y1="20" x2="400" y2="430" stroke="#E5E9EF" stroke-width="2"/>

  <!-- PULL-UP -->
  <text x="200" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Pull-up</text>
  <text x="200" y="60" text-anchor="middle" font-size="12" fill="#6B7280">điện trở nối lên VCC</text>

  <text x="200" y="90" text-anchor="middle" font-size="13" font-weight="600" fill="#2563EB">VCC (3.3V)</text>
  <line x1="200" y1="100" x2="200" y2="140" stroke="#111827" stroke-width="2"/>
  <rect x="180" y="140" width="40" height="50" fill="#F3F5F8" stroke="#111827" stroke-width="2"/>
  <text x="200" y="170" text-anchor="middle" font-size="10" fill="#111827">R</text>
  <line x1="200" y1="190" x2="200" y2="230" stroke="#111827" stroke-width="2"/>
  <circle cx="200" cy="230" r="5" fill="#2563EB"/>
  <text x="240" y="234" font-size="12" fill="#2563EB">chân MCU đọc tại đây</text>
  <line x1="200" y1="230" x2="200" y2="300" stroke="#111827" stroke-width="2"/>
  <rect x="180" y="300" width="40" height="30" fill="#F3F5F8" stroke="#111827" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="200" y="320" text-anchor="middle" font-size="9" fill="#111827">nút</text>
  <line x1="200" y1="330" x2="200" y2="360" stroke="#111827" stroke-width="2"/>
  <text x="200" y="378" text-anchor="middle" font-size="13" font-weight="600" fill="#6B7280">GND</text>

  <rect x="90" y="395" width="220" height="40" rx="6" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="200" y="412" text-anchor="middle" font-size="11" fill="#111827">Không nhấn → đọc HIGH (1)</text>
  <text x="200" y="427" text-anchor="middle" font-size="11" fill="#111827">Nhấn → nối GND → đọc LOW (0)</text>

  <!-- PULL-DOWN -->
  <text x="600" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Pull-down</text>
  <text x="600" y="60" text-anchor="middle" font-size="12" fill="#6B7280">điện trở nối xuống GND</text>

  <text x="600" y="90" text-anchor="middle" font-size="13" font-weight="600" fill="#2563EB">VCC (3.3V)</text>
  <line x1="600" y1="100" x2="600" y2="130" stroke="#111827" stroke-width="2"/>
  <rect x="580" y="130" width="40" height="30" fill="#F3F5F8" stroke="#111827" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="600" y="150" text-anchor="middle" font-size="9" fill="#111827">nút</text>
  <line x1="600" y1="160" x2="600" y2="230" stroke="#111827" stroke-width="2"/>
  <circle cx="600" cy="230" r="5" fill="#F97316"/>
  <text x="640" y="234" font-size="12" fill="#F97316">chân MCU đọc tại đây</text>
  <line x1="600" y1="230" x2="600" y2="270" stroke="#111827" stroke-width="2"/>
  <rect x="580" y="270" width="40" height="50" fill="#F3F5F8" stroke="#111827" stroke-width="2"/>
  <text x="600" y="300" text-anchor="middle" font-size="10" fill="#111827">R</text>
  <line x1="600" y1="320" x2="600" y2="360" stroke="#111827" stroke-width="2"/>
  <text x="600" y="378" text-anchor="middle" font-size="13" font-weight="600" fill="#6B7280">GND</text>

  <rect x="490" y="395" width="220" height="40" rx="6" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="600" y="412" text-anchor="middle" font-size="11" fill="#111827">Không nhấn → đọc LOW (0)</text>
  <text x="600" y="427" text-anchor="middle" font-size="11" fill="#111827">Nhấn → nối VCC → đọc HIGH (1)</text>
</svg>
