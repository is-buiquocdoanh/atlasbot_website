<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#FFFFFF"/>

  <!-- MCU chip -->
  <rect x="320" y="150" width="160" height="150" rx="8" fill="#2563EB" opacity="0.08" stroke="#2563EB" stroke-width="2.5"/>
  <text x="400" y="220" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">MCU</text>
  <text x="400" y="240" text-anchor="middle" font-size="11" fill="#6B7280">chân GPIO</text>

  <!-- pin stubs -->
  <line x1="320" y1="180" x2="270" y2="180" stroke="#111827" stroke-width="2"/>
  <line x1="320" y1="270" x2="270" y2="270" stroke="#111827" stroke-width="2"/>
  <line x1="480" y1="180" x2="530" y2="180" stroke="#111827" stroke-width="2"/>
  <line x1="480" y1="270" x2="530" y2="270" stroke="#111827" stroke-width="2"/>

  <!-- INPUT side: button -->
  <text x="150" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#16A34A">Chế độ INPUT</text>
  <rect x="120" y="160" width="60" height="40" rx="4" fill="#F3F5F8" stroke="#16A34A" stroke-width="2"/>
  <text x="150" y="185" text-anchor="middle" font-size="11" fill="#111827">Nút nhấn</text>
  <line x1="180" y1="180" x2="270" y2="180" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arrowG)"/>
  <text x="200" y="165" text-anchor="middle" font-size="11" fill="#16A34A">đọc trạng thái</text>

  <!-- OUTPUT side: LED -->
  <text x="650" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#F97316">Chế độ OUTPUT</text>
  <circle cx="650" cy="180" r="22" fill="#F97316" opacity="0.15" stroke="#F97316" stroke-width="2"/>
  <text x="650" y="185" text-anchor="middle" font-size="11" fill="#111827">LED</text>
  <line x1="530" y1="180" x2="620" y2="180" stroke="#F97316" stroke-width="2.5" marker-end="url(#arrowG)"/>
  <text x="575" y="165" text-anchor="middle" font-size="11" fill="#F97316">xuất tín hiệu</text>

  <!-- bidirectional note pin bottom -->
  <text x="150" y="300" text-anchor="middle" font-size="11" fill="#6B7280">MCU đọc: nhấn = 0/1?</text>
  <text x="650" y="300" text-anchor="middle" font-size="11" fill="#6B7280">MCU ghi: bật/tắt LED</text>

  <text x="400" y="360" text-anchor="middle" font-size="13" fill="#111827">GPIO = General Purpose Input/Output</text>
  <text x="400" y="382" text-anchor="middle" font-size="12" fill="#6B7280">Một chân, lập trình được là INPUT (đọc) hoặc OUTPUT (ghi)</text>
</svg>
