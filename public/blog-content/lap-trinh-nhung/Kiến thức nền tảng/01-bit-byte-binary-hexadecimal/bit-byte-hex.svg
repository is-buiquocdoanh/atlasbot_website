<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Arial, sans-serif">
  <rect width="800" height="450" fill="#FFFFFF"/>
  <text x="400" y="60" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">1 Byte = 8 Bit</text>

  <!-- 8 bit boxes, grouped into 2 nibbles of 4 -->
  <g font-family="'JetBrains Mono', monospace">
    <!-- nibble 1 (bits 7-4) -->
    <rect x="120" y="140" width="60" height="60" rx="6" fill="#2563EB" opacity="0.08" stroke="#2563EB" stroke-width="2"/>
    <text x="150" y="178" text-anchor="middle" font-size="22" fill="#111827">1</text>
    <rect x="188" y="140" width="60" height="60" rx="6" fill="#2563EB" opacity="0.08" stroke="#2563EB" stroke-width="2"/>
    <text x="218" y="178" text-anchor="middle" font-size="22" fill="#111827">1</text>
    <rect x="256" y="140" width="60" height="60" rx="6" fill="#2563EB" opacity="0.08" stroke="#2563EB" stroke-width="2"/>
    <text x="286" y="178" text-anchor="middle" font-size="22" fill="#111827">0</text>
    <rect x="324" y="140" width="60" height="60" rx="6" fill="#2563EB" opacity="0.08" stroke="#2563EB" stroke-width="2"/>
    <text x="354" y="178" text-anchor="middle" font-size="22" fill="#111827">1</text>

    <!-- nibble 2 (bits 3-0) -->
    <rect x="416" y="140" width="60" height="60" rx="6" fill="#F97316" opacity="0.08" stroke="#F97316" stroke-width="2"/>
    <text x="446" y="178" text-anchor="middle" font-size="22" fill="#111827">0</text>
    <rect x="484" y="140" width="60" height="60" rx="6" fill="#F97316" opacity="0.08" stroke="#F97316" stroke-width="2"/>
    <text x="514" y="178" text-anchor="middle" font-size="22" fill="#111827">1</text>
    <rect x="552" y="140" width="60" height="60" rx="6" fill="#F97316" opacity="0.08" stroke="#F97316" stroke-width="2"/>
    <text x="582" y="178" text-anchor="middle" font-size="22" fill="#111827">1</text>
    <rect x="620" y="140" width="60" height="60" rx="6" fill="#F97316" opacity="0.08" stroke="#F97316" stroke-width="2"/>
    <text x="650" y="178" text-anchor="middle" font-size="22" fill="#111827">0</text>
  </g>

  <text x="252" y="222" text-anchor="middle" font-size="12" fill="#2563EB">nibble cao → D</text>
  <text x="548" y="222" text-anchor="middle" font-size="12" fill="#F97316">nibble thấp → 6</text>

  <text x="120" y="128" font-size="11" fill="#6B7280">bit 7</text>
  <text x="648" y="128" font-size="11" fill="#6B7280">bit 0</text>

  <rect x="220" y="290" width="360" height="90" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="322" text-anchor="middle" font-size="16" font-family="'JetBrains Mono', monospace" fill="#111827">1101 0110 (nhị phân)</text>
  <text x="400" y="350" text-anchor="middle" font-size="16" font-family="'JetBrains Mono', monospace" fill="#111827">= 0xD6 (hex) = 214 (thập phân)</text>

  <text x="400" y="415" text-anchor="middle" font-size="12" fill="#6B7280">Mỗi nhóm 4 bit (nibble) đổi trực tiếp sang 1 chữ số hex</text>
</svg>
