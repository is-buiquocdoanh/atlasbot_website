<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowI" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#FFFFFF"/>
  <text x="400" y="45" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Chương trình chính bị "ngắt" tạm thời</text>

  <!-- main program timeline -->
  <line x1="60" y1="180" x2="740" y2="180" stroke="#2563EB" stroke-width="4"/>
  <text x="90" y="160" font-size="13" fill="#2563EB">Chương trình chính đang chạy...</text>

  <!-- interrupt event -->
  <line x1="380" y1="180" x2="380" y2="120" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="4 3"/>
  <circle cx="380" cy="180" r="6" fill="#DC2626"/>
  <text x="380" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#DC2626">Sự kiện ngắt!</text>
  <text x="380" y="122" text-anchor="middle" font-size="10" fill="#DC2626">(VD: nhấn nút, timer, UART...)</text>

  <!-- jump to ISR -->
  <path d="M 380 180 C 380 240, 420 260, 460 260" fill="none" stroke="#111827" stroke-width="2" marker-end="url(#arrowI)"/>
  <rect x="460" y="230" width="220" height="60" rx="8" fill="#F97316" opacity="0.10" stroke="#F97316" stroke-width="2.5"/>
  <text x="570" y="255" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">ISR</text>
  <text x="570" y="272" text-anchor="middle" font-size="10" fill="#6B7280">Interrupt Service Routine</text>

  <!-- return to main -->
  <path d="M 680 260 C 720 260, 720 200, 500 180" fill="none" stroke="#16A34A" stroke-width="2" marker-end="url(#arrowI)"/>
  <text x="600" y="330" text-anchor="middle" font-size="12" fill="#16A34A">Xử lý xong → quay lại đúng chỗ đang chạy dở</text>

  <!-- resumed main program -->
  <line x1="500" y1="180" x2="740" y2="180" stroke="#2563EB" stroke-width="4"/>

  <rect x="130" y="370" width="540" height="55" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="392" text-anchor="middle" font-size="12" fill="#111827">Không cần liên tục kiểm tra (polling) — CPU chỉ phản ứng</text>
  <text x="400" y="410" text-anchor="middle" font-size="12" fill="#111827">khi sự kiện thực sự xảy ra, tiết kiệm thời gian xử lý</text>
</svg>
