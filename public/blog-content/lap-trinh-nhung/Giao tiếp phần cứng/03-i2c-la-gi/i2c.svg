<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Arial, sans-serif">
  <rect width="800" height="450" fill="#FFFFFF"/>
  <text x="400" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">I2C — nhiều thiết bị chung 2 dây, phân biệt bằng địa chỉ</text>

  <!-- master -->
  <rect x="330" y="65" width="140" height="60" rx="8" fill="#2563EB" opacity="0.10" stroke="#2563EB" stroke-width="2"/>
  <text x="400" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Master</text>
  <text x="400" y="108" text-anchor="middle" font-size="10" fill="#6B7280">(MCU — tạo SCL)</text>

  <!-- pull-up resistors -->
  <text x="240" y="150" font-size="9" fill="#6B7280">4.7kΩ pull-up</text>
  <text x="560" y="150" font-size="9" fill="#6B7280">4.7kΩ pull-up</text>

  <!-- bus lines -->
  <line x1="140" y1="180" x2="660" y2="180" stroke="#2563EB" stroke-width="3"/>
  <text x="150" y="172" font-size="10" fill="#2563EB">SDA (dữ liệu)</text>
  <line x1="140" y1="210" x2="660" y2="210" stroke="#F97316" stroke-width="3"/>
  <text x="150" y="230" font-size="10" fill="#F97316">SCL (clock)</text>

  <line x1="400" y1="125" x2="400" y2="180" stroke="#2563EB" stroke-width="2"/>
  <line x1="415" y1="125" x2="415" y2="210" stroke="#F97316" stroke-width="2"/>

  <!-- devices -->
  <rect x="140" y="270" width="150" height="70" rx="8" fill="#16A34A" opacity="0.10" stroke="#16A34A" stroke-width="2"/>
  <text x="215" y="295" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">IMU</text>
  <text x="215" y="313" text-anchor="middle" font-size="10" fill="#6B7280">địa chỉ 0x68</text>
  <line x1="180" y1="180" x2="180" y2="270" stroke="#2563EB" stroke-width="1.5"/>
  <line x1="200" y1="210" x2="200" y2="270" stroke="#F97316" stroke-width="1.5"/>

  <rect x="325" y="270" width="150" height="70" rx="8" fill="#F97316" opacity="0.10" stroke="#F97316" stroke-width="2"/>
  <text x="400" y="295" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Cảm biến K.cách</text>
  <text x="400" y="313" text-anchor="middle" font-size="10" fill="#6B7280">địa chỉ 0x29</text>
  <line x1="365" y1="180" x2="365" y2="270" stroke="#2563EB" stroke-width="1.5"/>
  <line x1="385" y1="210" x2="385" y2="270" stroke="#F97316" stroke-width="1.5"/>

  <rect x="510" y="270" width="150" height="70" rx="8" fill="#6B7280" opacity="0.10" stroke="#6B7280" stroke-width="2"/>
  <text x="585" y="295" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Màn hình OLED</text>
  <text x="585" y="313" text-anchor="middle" font-size="10" fill="#6B7280">địa chỉ 0x3C</text>
  <line x1="550" y1="180" x2="550" y2="270" stroke="#2563EB" stroke-width="1.5"/>
  <line x1="570" y1="210" x2="570" y2="270" stroke="#F97316" stroke-width="1.5"/>

  <rect x="90" y="380" width="620" height="45" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="407" text-anchor="middle" font-size="12" fill="#111827">Master gửi địa chỉ trước — chỉ thiết bị khớp địa chỉ mới phản hồi</text>
</svg>
