<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Arial, sans-serif">
  <rect width="800" height="450" fill="#FFFFFF"/>
  <text x="400" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">SPI — dây chung + 1 dây CS riêng cho mỗi slave</text>

  <rect x="330" y="65" width="140" height="60" rx="8" fill="#2563EB" opacity="0.10" stroke="#2563EB" stroke-width="2"/>
  <text x="400" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Master</text>
  <text x="400" y="108" text-anchor="middle" font-size="10" fill="#6B7280">(MCU)</text>

  <!-- shared lines -->
  <line x1="140" y1="160" x2="660" y2="160" stroke="#F97316" stroke-width="3"/>
  <text x="150" y="152" font-size="10" fill="#F97316">SCLK</text>
  <line x1="140" y1="185" x2="660" y2="185" stroke="#2563EB" stroke-width="3"/>
  <text x="150" y="203" font-size="10" fill="#2563EB">MOSI (master → slave)</text>
  <line x1="140" y1="215" x2="660" y2="215" stroke="#16A34A" stroke-width="3"/>
  <text x="500" y="233" font-size="10" fill="#16A34A">MISO (slave → master)</text>

  <!-- CS lines individual -->
  <line x1="255" y1="125" x2="255" y2="270" stroke="#DC2626" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="200" y="255" font-size="10" fill="#DC2626">CS1</text>
  <line x1="545" y1="125" x2="545" y2="270" stroke="#DC2626" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="580" y="255" font-size="10" fill="#DC2626">CS2</text>

  <!-- slaves -->
  <rect x="140" y="270" width="230" height="80" rx="8" fill="#16A34A" opacity="0.10" stroke="#16A34A" stroke-width="2"/>
  <text x="255" y="300" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Cảm biến IMU</text>
  <text x="255" y="320" text-anchor="middle" font-size="10" fill="#6B7280">được chọn khi CS1 = 0</text>
  <text x="255" y="338" text-anchor="middle" font-size="10" fill="#6B7280">các thiết bị khác bỏ qua bus</text>

  <rect x="430" y="270" width="230" height="80" rx="8" fill="#F97316" opacity="0.10" stroke="#F97316" stroke-width="2"/>
  <text x="545" y="300" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Màn hình TFT</text>
  <text x="545" y="320" text-anchor="middle" font-size="10" fill="#6B7280">được chọn khi CS2 = 0</text>
  <text x="545" y="338" text-anchor="middle" font-size="10" fill="#6B7280">CS1 vẫn = 1 → bỏ qua</text>

  <rect x="90" y="385" width="620" height="45" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="412" text-anchor="middle" font-size="12" fill="#111827">Full-duplex: MOSI và MISO truyền đồng thời trong cùng 1 lệnh</text>
</svg>
