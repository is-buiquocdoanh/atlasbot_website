<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Arial, sans-serif">
  <rect width="800" height="450" fill="#FFFFFF"/>
  <text x="400" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Băng thông: các bus nhúng vs Ethernet</text>

  <!-- bar chart -->
  <text x="90" y="90" font-size="11" fill="#111827">UART</text>
  <rect x="160" y="75" width="4" height="18" fill="#2563EB"/>
  <text x="175" y="90" font-size="10" fill="#6B7280">~1 Mbps</text>

  <text x="90" y="125" font-size="11" fill="#111827">I2C</text>
  <rect x="160" y="110" width="8" height="18" fill="#2563EB"/>
  <text x="180" y="125" font-size="10" fill="#6B7280">~1-3.4 Mbps</text>

  <text x="90" y="160" font-size="11" fill="#111827">CAN</text>
  <rect x="160" y="145" width="4" height="18" fill="#2563EB"/>
  <text x="175" y="160" font-size="10" fill="#6B7280">~1 Mbps</text>

  <text x="90" y="195" font-size="11" fill="#111827">SPI</text>
  <rect x="160" y="180" width="30" height="18" fill="#2563EB"/>
  <text x="200" y="195" font-size="10" fill="#6B7280">~10-50 Mbps</text>

  <text x="90" y="240" font-size="12" font-weight="700" fill="#111827">Ethernet</text>
  <rect x="160" y="220" width="500" height="30" fill="#16A34A" opacity="0.7"/>
  <text x="670" y="240" font-size="11" font-weight="700" fill="#16A34A">100 Mbps – 1 Gbps+</text>

  <!-- architecture -->
  <rect x="90" y="300" width="170" height="60" rx="8" fill="#F97316" opacity="0.10" stroke="#F97316" stroke-width="2"/>
  <text x="175" y="325" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Camera / LiDAR</text>
  <text x="175" y="343" text-anchor="middle" font-size="10" fill="#6B7280">(Ethernet)</text>

  <rect x="315" y="300" width="150" height="60" rx="8" fill="#6B7280" opacity="0.10" stroke="#6B7280" stroke-width="2"/>
  <text x="390" y="335" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Switch</text>

  <rect x="520" y="300" width="200" height="60" rx="8" fill="#16A34A" opacity="0.10" stroke="#16A34A" stroke-width="2"/>
  <text x="620" y="325" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Máy tính ROS2</text>
  <text x="620" y="343" text-anchor="middle" font-size="10" fill="#6B7280">SLAM, Nav2</text>

  <line x1="260" y1="330" x2="315" y2="330" stroke="#6B7280" stroke-width="2"/>
  <line x1="465" y1="330" x2="520" y2="330" stroke="#6B7280" stroke-width="2"/>

  <text x="400" y="405" text-anchor="middle" font-size="12" fill="#111827">Dùng ở tầng dữ liệu lớn — tầng điều khiển thời gian thực vẫn dùng UART/I2C/SPI/CAN</text>
</svg>
