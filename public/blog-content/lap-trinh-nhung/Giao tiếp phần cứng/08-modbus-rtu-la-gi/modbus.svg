<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowMB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#FFFFFF"/>
  <text x="400" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Modbus RTU — master hỏi lần lượt, chạy trên nền RS485</text>

  <rect x="330" y="65" width="140" height="60" rx="8" fill="#2563EB" opacity="0.10" stroke="#2563EB" stroke-width="2"/>
  <text x="400" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Master</text>
  <text x="400" y="108" text-anchor="middle" font-size="10" fill="#6B7280">(PLC / máy tính)</text>

  <!-- RS485 bus -->
  <line x1="120" y1="160" x2="680" y2="160" stroke="#6B7280" stroke-width="3"/>
  <text x="130" y="152" font-size="10" fill="#6B7280">Bus vật lý RS485 (A/B)</text>
  <line x1="400" y1="125" x2="400" y2="160" stroke="#6B7280" stroke-width="2"/>

  <!-- slaves -->
  <rect x="130" y="200" width="150" height="65" rx="8" fill="#16A34A" opacity="0.10" stroke="#16A34A" stroke-width="2"/>
  <text x="205" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Slave #1</text>
  <text x="205" y="246" text-anchor="middle" font-size="9" fill="#6B7280">Driver động cơ</text>
  <line x1="205" y1="160" x2="205" y2="200" stroke="#6B7280" stroke-width="1.5"/>

  <rect x="325" y="200" width="150" height="65" rx="8" fill="#F97316" opacity="0.10" stroke="#F97316" stroke-width="2"/>
  <text x="400" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Slave #2</text>
  <text x="400" y="246" text-anchor="middle" font-size="9" fill="#6B7280">Biến tần</text>
  <line x1="400" y1="160" x2="400" y2="200" stroke="#6B7280" stroke-width="1.5"/>

  <rect x="520" y="200" width="150" height="65" rx="8" fill="#DC2626" opacity="0.08" stroke="#DC2626" stroke-width="2"/>
  <text x="595" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Slave #3</text>
  <text x="595" y="246" text-anchor="middle" font-size="9" fill="#6B7280">Cảm biến</text>
  <line x1="595" y1="160" x2="595" y2="200" stroke="#6B7280" stroke-width="1.5"/>

  <!-- polling sequence -->
  <rect x="90" y="300" width="620" height="110" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="110" y="325" font-size="12" font-family="monospace" fill="#111827">1. Master → Slave #1: "Đọc thanh ghi 40001?"   → Slave #1 trả lời</text>
  <text x="110" y="350" font-size="12" font-family="monospace" fill="#111827">2. Master → Slave #2: "Đọc thanh ghi 40001?"   → Slave #2 trả lời</text>
  <text x="110" y="375" font-size="12" font-family="monospace" fill="#111827">3. Master → Slave #3: "Đọc thanh ghi 40001?"   → Slave #3 trả lời</text>
  <text x="400" y="398" text-anchor="middle" font-size="10" fill="#6B7280">Tuần tự, đúng lượt — không slave nào tự ý chen ngang</text>
</svg>
