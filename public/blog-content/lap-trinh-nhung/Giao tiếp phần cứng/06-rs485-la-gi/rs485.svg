<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Arial, sans-serif">
  <rect width="800" height="450" fill="#FFFFFF"/>
  <text x="400" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Tín hiệu vi sai — nhiễu tác động như nhau lên A và B</text>

  <!-- differential waveform -->
  <text x="150" y="75" font-size="11" fill="#2563EB">Dây A</text>
  <polyline points="90,90 140,90 140,70 220,70 220,90 300,90 300,70 380,70 380,90 460,90" fill="none" stroke="#2563EB" stroke-width="2.5"/>

  <text x="150" y="130" font-size="11" fill="#F97316">Dây B (đảo pha A)</text>
  <polyline points="90,145 140,145 140,165 220,165 220,145 300,145 300,165 380,165 380,145 460,145" fill="none" stroke="#F97316" stroke-width="2.5"/>

  <text x="530" y="120" font-size="11" fill="#DC2626">Hiệu A-B → tín hiệu đọc được,</text>
  <text x="530" y="138" font-size="11" fill="#DC2626">nhiễu chung bị triệt tiêu</text>

  <!-- bus with nodes -->
  <line x1="90" y1="230" x2="710" y2="230" stroke="#2563EB" stroke-width="3"/>
  <text x="100" y="222" font-size="10" fill="#2563EB">A</text>
  <line x1="90" y1="255" x2="710" y2="255" stroke="#F97316" stroke-width="3"/>
  <text x="100" y="273" font-size="10" fill="#F97316">B</text>

  <rect x="130" y="300" width="140" height="60" rx="8" fill="#16A34A" opacity="0.10" stroke="#16A34A" stroke-width="2"/>
  <text x="200" y="330" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Node 1</text>
  <text x="200" y="348" text-anchor="middle" font-size="9" fill="#6B7280">Driver động cơ</text>
  <line x1="170" y1="230" x2="170" y2="300" stroke="#2563EB" stroke-width="1.5"/>
  <line x1="190" y1="255" x2="190" y2="300" stroke="#F97316" stroke-width="1.5"/>

  <rect x="330" y="300" width="140" height="60" rx="8" fill="#F97316" opacity="0.10" stroke="#F97316" stroke-width="2"/>
  <text x="400" y="330" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Node 2</text>
  <text x="400" y="348" text-anchor="middle" font-size="9" fill="#6B7280">Cảm biến</text>
  <line x1="370" y1="230" x2="370" y2="300" stroke="#2563EB" stroke-width="1.5"/>
  <line x1="390" y1="255" x2="390" y2="300" stroke="#F97316" stroke-width="1.5"/>

  <rect x="530" y="300" width="140" height="60" rx="8" fill="#6B7280" opacity="0.10" stroke="#6B7280" stroke-width="2"/>
  <text x="600" y="330" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Node...32</text>
  <text x="600" y="348" text-anchor="middle" font-size="9" fill="#6B7280">Tối đa 32 node</text>
  <line x1="570" y1="230" x2="570" y2="300" stroke="#2563EB" stroke-width="1.5"/>
  <line x1="590" y1="255" x2="590" y2="300" stroke="#F97316" stroke-width="1.5"/>

  <rect x="90" y="390" width="620" height="45" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="417" text-anchor="middle" font-size="12" fill="#111827">Đi xa tới ~1200m, cần chuyển DE/RE giữa chế độ gửi/nhận</text>
</svg>
