<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#FFFFFF"/>
  <text x="400" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Cùng khung dữ liệu, khác hẳn mức điện áp</text>

  <!-- MCU side -->
  <rect x="60" y="80" width="180" height="100" rx="8" fill="#2563EB" opacity="0.08" stroke="#2563EB" stroke-width="2"/>
  <text x="150" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">MCU (TTL)</text>
  <text x="150" y="135" text-anchor="middle" font-size="11" fill="#6B7280">Bit 0 = 0V</text>
  <text x="150" y="155" text-anchor="middle" font-size="11" fill="#6B7280">Bit 1 = 3.3V / 5V</text>

  <!-- MAX232 -->
  <rect x="310" y="90" width="180" height="80" rx="8" fill="#F97316" opacity="0.10" stroke="#F97316" stroke-width="2.5"/>
  <text x="400" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">MAX232</text>
  <text x="400" y="140" text-anchor="middle" font-size="10" fill="#6B7280">IC chuyển mức điện áp</text>
  <text x="400" y="156" text-anchor="middle" font-size="10" fill="#6B7280">(bắt buộc phải có)</text>

  <line x1="240" y1="130" x2="305" y2="130" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowR)"/>
  <line x1="305" y1="150" x2="240" y2="150" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowR)"/>

  <!-- RS232 side -->
  <rect x="560" y="80" width="180" height="100" rx="8" fill="#DC2626" opacity="0.06" stroke="#DC2626" stroke-width="2"/>
  <text x="650" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">RS232 (DB9)</text>
  <text x="650" y="135" text-anchor="middle" font-size="11" fill="#6B7280">Bit 0 = +3V…+15V</text>
  <text x="650" y="155" text-anchor="middle" font-size="11" fill="#6B7280">Bit 1 = -3V…-15V</text>

  <line x1="490" y1="130" x2="555" y2="130" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowR)"/>
  <line x1="555" y1="150" x2="490" y2="150" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowR)"/>

  <!-- warning -->
  <rect x="90" y="220" width="620" height="60" rx="8" fill="#DC2626" opacity="0.06" stroke="#DC2626" stroke-width="1.5"/>
  <text x="400" y="245" text-anchor="middle" font-size="12" font-weight="700" fill="#DC2626">Tuyệt đối không nối thẳng chân UART của MCU vào cổng RS232</text>
  <text x="400" y="264" text-anchor="middle" font-size="11" fill="#111827">±15V có thể phá hỏng chân MCU chỉ chịu được 3.3V/5V</text>

  <rect x="90" y="310" width="620" height="60" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="335" text-anchor="middle" font-size="12" fill="#111827">UART = giao thức đóng khung dữ liệu (logic)</text>
  <text x="400" y="355" text-anchor="middle" font-size="12" fill="#111827">RS232 = chuẩn điện áp vật lý — hai tầng khác nhau</text>
</svg>
