<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowU" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#FFFFFF"/>
  <text x="400" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">UART — chỉ 2 dây, chéo TX/RX</text>

  <!-- device A -->
  <rect x="70" y="70" width="150" height="90" rx="8" fill="#2563EB" opacity="0.08" stroke="#2563EB" stroke-width="2"/>
  <text x="145" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Thiết bị A</text>
  <text x="145" y="122" text-anchor="middle" font-size="11" fill="#6B7280">(VD: STM32)</text>
  <text x="100" y="145" font-size="11" fill="#16A34A">TX ●</text>
  <text x="100" y="163" font-size="11" fill="#F97316">RX ●</text>

  <!-- device B -->
  <rect x="580" y="70" width="150" height="90" rx="8" fill="#16A34A" opacity="0.08" stroke="#16A34A" stroke-width="2"/>
  <text x="655" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Thiết bị B</text>
  <text x="655" y="122" text-anchor="middle" font-size="11" fill="#6B7280">(VD: máy tính)</text>
  <text x="640" y="145" font-size="11" fill="#F97316">RX ●</text>
  <text x="640" y="163" font-size="11" fill="#16A34A">TX ●</text>

  <!-- crossed lines -->
  <path d="M 220 140 L 640 158" fill="none" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arrowU)"/>
  <path d="M 580 140 L 220 158" fill="none" stroke="#F97316" stroke-width="2.5" marker-end="url(#arrowU)"/>
  <text x="400" y="128" text-anchor="middle" font-size="10" fill="#16A34A">TX → RX</text>
  <text x="400" y="185" text-anchor="middle" font-size="10" fill="#F97316">RX ← TX</text>

  <!-- framing -->
  <text x="400" y="240" text-anchor="middle" font-size="12" fill="#6B7280">Khung truyền 1 byte</text>
  <g font-family="monospace" font-size="12">
    <rect x="90" y="255" width="55" height="40" fill="#DC2626" opacity="0.12" stroke="#DC2626"/>
    <text x="117" y="279" text-anchor="middle" fill="#111827">Start</text>
    <rect x="145" y="255" width="440" height="40" fill="#2563EB" opacity="0.10" stroke="#2563EB"/>
    <text x="365" y="279" text-anchor="middle" fill="#111827">D0  D1  D2  D3  D4  D5  D6  D7</text>
    <rect x="585" y="255" width="55" height="40" fill="#16A34A" opacity="0.12" stroke="#16A34A"/>
    <text x="612" y="279" text-anchor="middle" fill="#111827">Stop</text>
  </g>

  <rect x="90" y="340" width="550" height="60" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="365" y="365" text-anchor="middle" font-size="12" fill="#111827">Không có dây clock — hai bên tự đếm thời gian theo</text>
  <text x="365" y="383" text-anchor="middle" font-size="12" fill="#111827">baud rate đã thống nhất trước (VD: 115200 bit/giây)</text>
</svg>
