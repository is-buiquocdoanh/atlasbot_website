<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Arial, sans-serif">
  <rect width="800" height="450" fill="#FFFFFF"/>
  <text x="400" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Arduino Uno — các thành phần chính</text>

  <!-- board outline -->
  <rect x="130" y="80" width="540" height="300" rx="14" fill="#2563EB" opacity="0.06" stroke="#2563EB" stroke-width="2.5"/>

  <!-- USB port -->
  <rect x="150" y="100" width="70" height="45" rx="4" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
  <text x="185" y="126" text-anchor="middle" font-size="11" fill="#111827">USB</text>
  <text x="185" y="160" text-anchor="middle" font-size="10" fill="#6B7280">Nạp code + nguồn</text>

  <!-- MCU chip -->
  <rect x="350" y="180" width="100" height="70" rx="6" fill="#F97316" opacity="0.12" stroke="#F97316" stroke-width="2.5"/>
  <text x="400" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">ATmega328P</text>
  <text x="400" y="228" text-anchor="middle" font-size="10" fill="#6B7280">CPU AVR 8-bit</text>
  <text x="400" y="242" text-anchor="middle" font-size="9" fill="#6B7280">16MHz · 2KB RAM · 32KB Flash</text>

  <!-- power jack -->
  <rect x="150" y="300" width="70" height="45" rx="4" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
  <text x="185" y="326" text-anchor="middle" font-size="11" fill="#111827">Jack DC</text>
  <text x="185" y="360" text-anchor="middle" font-size="10" fill="#6B7280">Nguồn ngoài 7-12V</text>

  <!-- reset button -->
  <circle cx="280" cy="322" r="14" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
  <text x="280" y="326" text-anchor="middle" font-size="9" fill="#111827">RST</text>

  <!-- digital pins -->
  <rect x="490" y="95" width="160" height="30" rx="4" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
  <text x="570" y="115" text-anchor="middle" font-size="11" fill="#111827">Digital Pin 0–13</text>
  <text x="570" y="145" text-anchor="middle" font-size="10" fill="#6B7280">digitalWrite / interrupt</text>

  <!-- analog pins -->
  <rect x="490" y="330" width="160" height="30" rx="4" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  <text x="570" y="350" text-anchor="middle" font-size="11" fill="#111827">Analog A0–A5</text>
  <text x="570" y="315" text-anchor="middle" font-size="10" fill="#6B7280">analogRead (10-bit ADC)</text>

  <text x="400" y="415" text-anchor="middle" font-size="12" fill="#111827">Cắm USB → nhấn Upload → code chạy ngay, không cần mạch nạp rời</text>
</svg>
