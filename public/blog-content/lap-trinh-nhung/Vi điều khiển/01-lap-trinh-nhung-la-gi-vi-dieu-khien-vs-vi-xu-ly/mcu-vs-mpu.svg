<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#FFFFFF"/>
  <line x1="400" y1="20" x2="400" y2="430" stroke="#E5E9EF" stroke-width="2"/>

  <!-- LEFT: MCU -->
  <text x="200" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Vi điều khiển (MCU)</text>
  <rect x="90" y="70" width="220" height="220" rx="10" fill="#2563EB" opacity="0.06" stroke="#2563EB" stroke-width="2.5"/>
  <text x="200" y="95" text-anchor="middle" font-size="12" fill="#6B7280">1 chip duy nhất</text>

  <rect x="115" y="110" width="80" height="50" rx="6" fill="#FFFFFF" stroke="#2563EB"/>
  <text x="155" y="140" text-anchor="middle" font-size="13" fill="#111827">CPU</text>

  <rect x="205" y="110" width="80" height="50" rx="6" fill="#FFFFFF" stroke="#2563EB"/>
  <text x="245" y="132" text-anchor="middle" font-size="12" fill="#111827">Flash</text>
  <text x="245" y="148" text-anchor="middle" font-size="10" fill="#6B7280">(bộ nhớ chương trình)</text>

  <rect x="115" y="175" width="80" height="50" rx="6" fill="#FFFFFF" stroke="#2563EB"/>
  <text x="155" y="205" text-anchor="middle" font-size="13" fill="#111827">RAM</text>

  <rect x="205" y="175" width="80" height="50" rx="6" fill="#FFFFFF" stroke="#2563EB"/>
  <text x="245" y="200" text-anchor="middle" font-size="11" fill="#111827">GPIO /</text>
  <text x="245" y="215" text-anchor="middle" font-size="11" fill="#111827">Ngoại vi</text>

  <text x="200" y="255" text-anchor="middle" font-size="11" fill="#6B7280">Chạy trực tiếp, không cần HĐH</text>
  <text x="200" y="272" text-anchor="middle" font-size="11" fill="#6B7280">(bare-metal / RTOS)</text>

  <text x="200" y="330" text-anchor="middle" font-size="12" fill="#111827">→ STM32, ESP32, AVR...</text>
  <text x="200" y="352" text-anchor="middle" font-size="12" fill="#111827">→ Điều khiển realtime, giá rẻ,</text>
  <text x="200" y="370" text-anchor="middle" font-size="12" fill="#111827">tiêu thụ điện thấp</text>

  <!-- RIGHT: MPU -->
  <text x="600" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Vi xử lý (MPU)</text>
  <rect x="530" y="90" width="140" height="90" rx="10" fill="#F97316" opacity="0.08" stroke="#F97316" stroke-width="2.5"/>
  <text x="600" y="130" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">CPU</text>
  <text x="600" y="150" text-anchor="middle" font-size="10" fill="#6B7280">(nhiều nhân, xung cao)</text>

  <rect x="480" y="220" width="110" height="50" rx="6" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="535" y="240" text-anchor="middle" font-size="11" fill="#111827">RAM rời</text>
  <text x="535" y="256" text-anchor="middle" font-size="9" fill="#6B7280">(DDR, bên ngoài)</text>
  <line x1="560" y1="180" x2="545" y2="218" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="610" y="220" width="110" height="50" rx="6" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="665" y="240" text-anchor="middle" font-size="11" fill="#111827">eMMC / SSD</text>
  <text x="665" y="256" text-anchor="middle" font-size="9" fill="#6B7280">(lưu trữ ngoài)</text>
  <line x1="640" y1="180" x2="655" y2="218" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="545" y="290" width="110" height="46" rx="6" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="600" y="317" text-anchor="middle" font-size="11" fill="#111827">Hệ điều hành</text>
  <line x1="600" y1="270" x2="600" y2="288" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <text x="600" y="365" text-anchor="middle" font-size="12" fill="#111827">→ Jetson, Raspberry Pi...</text>
  <text x="600" y="387" text-anchor="middle" font-size="12" fill="#111827">→ Chạy Linux/ROS2, xử lý AI,</text>
  <text x="600" y="405" text-anchor="middle" font-size="12" fill="#111827">SLAM nặng tính toán</text>
</svg>
