<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowS" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#FFFFFF"/>
  <text x="400" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Từ CubeMX đến thanh ghi phần cứng</text>

  <!-- CubeMX -->
  <rect x="60" y="90" width="190" height="80" rx="8" fill="#2563EB" opacity="0.08" stroke="#2563EB" stroke-width="2"/>
  <text x="155" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">STM32CubeMX</text>
  <text x="155" y="140" text-anchor="middle" font-size="10" fill="#6B7280">Chọn chân, clock,</text>
  <text x="155" y="155" text-anchor="middle" font-size="10" fill="#6B7280">ngoại vi bằng UI</text>

  <line x1="250" y1="130" x2="300" y2="130" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowS)"/>

  <!-- HAL -->
  <rect x="305" y="90" width="190" height="80" rx="8" fill="#F97316" opacity="0.10" stroke="#F97316" stroke-width="2"/>
  <text x="400" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">HAL Library</text>
  <text x="400" y="140" text-anchor="middle" font-size="10" fill="#6B7280">HAL_TIM_PWM_Start()</text>
  <text x="400" y="155" text-anchor="middle" font-size="10" fill="#6B7280">HAL_GPIO_WritePin()</text>

  <line x1="495" y1="130" x2="545" y2="130" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowS)"/>

  <!-- Registers -->
  <rect x="550" y="90" width="190" height="80" rx="8" fill="#16A34A" opacity="0.08" stroke="#16A34A" stroke-width="2"/>
  <text x="645" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Thanh ghi</text>
  <text x="645" y="140" text-anchor="middle" font-size="10" fill="#6B7280">TIM3-&gt;CCR1</text>
  <text x="645" y="155" text-anchor="middle" font-size="10" fill="#6B7280">GPIOA-&gt;ODR</text>

  <!-- Peripherals row -->
  <text x="400" y="215" text-anchor="middle" font-size="12" fill="#6B7280">Ngoại vi phần cứng mạnh, chạy song song CPU chính</text>

  <rect x="80" y="240" width="150" height="60" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="155" y="265" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Timer</text>
  <text x="155" y="282" text-anchor="middle" font-size="10" fill="#6B7280">PWM, đo encoder</text>

  <rect x="250" y="240" width="150" height="60" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="325" y="265" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">DMA</text>
  <text x="325" y="282" text-anchor="middle" font-size="10" fill="#6B7280">Truyền dữ liệu tự động</text>

  <rect x="420" y="240" width="150" height="60" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="495" y="265" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">UART/SPI/I2C</text>
  <text x="495" y="282" text-anchor="middle" font-size="10" fill="#6B7280">Nhiều bus song song</text>

  <rect x="590" y="240" width="150" height="60" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="665" y="265" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">CAN</text>
  <text x="665" y="282" text-anchor="middle" font-size="10" fill="#6B7280">Giao tiếp công nghiệp</text>

  <rect x="150" y="345" width="500" height="55" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="368" text-anchor="middle" font-size="12" fill="#111827">Nạp/debug qua ST-Link (SWD) — xem được biến khi chip</text>
  <text x="400" y="386" text-anchor="middle" font-size="12" fill="#111827">đang chạy thật, không có ở Arduino</text>
</svg>
