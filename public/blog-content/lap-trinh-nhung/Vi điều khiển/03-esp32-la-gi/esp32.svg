<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowE" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#FFFFFF"/>
  <text x="400" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Kiến trúc ESP32 — dual-core + radio tích hợp</text>

  <rect x="120" y="70" width="560" height="230" rx="12" fill="#2563EB" opacity="0.05" stroke="#2563EB" stroke-width="2.5"/>
  <text x="400" y="95" text-anchor="middle" font-size="12" fill="#6B7280">1 chip ESP32</text>

  <!-- Core 0 -->
  <rect x="150" y="115" width="220" height="90" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="260" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Core 0</text>
  <text x="260" y="160" text-anchor="middle" font-size="10" fill="#6B7280">WiFi / Bluetooth stack</text>
  <text x="260" y="178" text-anchor="middle" font-size="10" fill="#6B7280">(FreeRTOS task riêng)</text>

  <!-- Core 1 -->
  <rect x="430" y="115" width="220" height="90" rx="8" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  <text x="540" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Core 1</text>
  <text x="540" y="160" text-anchor="middle" font-size="10" fill="#6B7280">Logic điều khiển chính</text>
  <text x="540" y="178" text-anchor="middle" font-size="10" fill="#6B7280">(cảm biến, motor, PID)</text>

  <!-- shared bus -->
  <rect x="200" y="235" width="400" height="40" rx="6" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="260" text-anchor="middle" font-size="11" fill="#111827">RAM 520KB + ngoại vi dùng chung (GPIO, ADC, PWM)</text>
  <line x1="260" y1="205" x2="300" y2="233" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrowE)"/>
  <line x1="540" y1="205" x2="500" y2="233" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrowE)"/>

  <!-- radio -->
  <rect x="150" y="330" width="220" height="55" rx="8" fill="#16A34A" opacity="0.10" stroke="#16A34A" stroke-width="2"/>
  <text x="260" y="355" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">WiFi 802.11 b/g/n</text>
  <text x="260" y="372" text-anchor="middle" font-size="10" fill="#6B7280">Bluetooth Classic / BLE</text>

  <rect x="430" y="330" width="220" height="55" rx="8" fill="#F97316" opacity="0.10" stroke="#F97316" stroke-width="2"/>
  <text x="540" y="355" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">240MHz · Dual-core</text>
  <text x="540" y="372" text-anchor="middle" font-size="10" fill="#6B7280">so với 16MHz 1 nhân của Uno</text>

  <text x="400" y="425" text-anchor="middle" font-size="12" fill="#111827">Một nhân lo mạng, một nhân lo điều khiển — không làm nghẽn nhau</text>
</svg>
