<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Arial, sans-serif">
  <rect width="800" height="450" fill="#FFFFFF"/>
  <text x="400" y="45" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Optocoupler — cách ly bằng ánh sáng</text>

  <rect x="260" y="120" width="280" height="180" rx="10" fill="#F3F5F8" stroke="#E5E9EF" stroke-width="2"/>
  <text x="400" y="110" text-anchor="middle" font-size="12" fill="#6B7280">vỏ IC optocoupler</text>

  <!-- input LED side -->
  <circle cx="320" cy="210" r="30" fill="#F97316" opacity="0.12" stroke="#F97316" stroke-width="2.5"/>
  <text x="320" y="215" text-anchor="middle" font-size="11" fill="#111827">LED</text>
  <text x="200" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#F97316">Đầu vào</text>
  <text x="200" y="240" text-anchor="middle" font-size="11" fill="#6B7280">Tín hiệu MCU</text>
  <text x="200" y="256" text-anchor="middle" font-size="11" fill="#6B7280">làm LED sáng</text>
  <line x1="140" y1="210" x2="288" y2="210" stroke="#F97316" stroke-width="2.5"/>

  <!-- light rays crossing gap -->
  <line x1="350" y1="200" x2="450" y2="200" stroke="#FBBF24" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="350" y1="210" x2="450" y2="210" stroke="#FBBF24" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="350" y1="220" x2="450" y2="220" stroke="#FBBF24" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="400" y="255" text-anchor="middle" font-size="11" fill="#B45309">ánh sáng truyền qua khe hở —</text>
  <text x="400" y="270" text-anchor="middle" font-size="11" fill="#B45309">KHÔNG có dây dẫn điện nối 2 bên</text>

  <!-- output phototransistor side -->
  <circle cx="480" cy="210" r="30" fill="#2563EB" opacity="0.12" stroke="#2563EB" stroke-width="2.5"/>
  <text x="480" y="215" text-anchor="middle" font-size="9" fill="#111827">Photo-</text>
  <text x="480" y="226" text-anchor="middle" font-size="9" fill="#111827">transistor</text>
  <text x="600" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#2563EB">Đầu ra</text>
  <text x="600" y="240" text-anchor="middle" font-size="11" fill="#6B7280">Ánh sáng làm phototransistor</text>
  <text x="600" y="256" text-anchor="middle" font-size="11" fill="#6B7280">dẫn → tạo tín hiệu ra</text>
  <line x1="512" y1="210" x2="660" y2="210" stroke="#2563EB" stroke-width="2.5"/>

  <rect x="150" y="340" width="500" height="70" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="365" text-anchor="middle" font-size="12" fill="#111827">Bảo vệ MCU khỏi nhiễu, chênh áp, hoặc sự cố điện</text>
  <text x="400" y="384" text-anchor="middle" font-size="12" fill="#111827">từ mạch bên kia — vì 2 phía không hề nối điện trực tiếp</text>
</svg>
