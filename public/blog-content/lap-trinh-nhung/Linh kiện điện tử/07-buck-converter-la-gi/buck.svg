<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Arial, sans-serif">
  <rect width="800" height="450" fill="#FFFFFF"/>
  <text x="400" y="45" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Buck Converter — hạ áp kiểu đóng/cắt, hiệu suất cao</text>

  <text x="130" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#2563EB">Vin (VD 12V)</text>
  <line x1="130" y1="110" x2="130" y2="150" stroke="#111827" stroke-width="2"/>

  <!-- switch -->
  <rect x="95" y="150" width="70" height="40" rx="4" fill="#F97316" opacity="0.12" stroke="#F97316" stroke-width="2"/>
  <text x="130" y="175" text-anchor="middle" font-size="11" fill="#111827">Switch</text>
  <text x="130" y="205" text-anchor="middle" font-size="10" fill="#6B7280">đóng/cắt nhanh (PWM)</text>

  <line x1="165" y1="170" x2="260" y2="170" stroke="#111827" stroke-width="2"/>

  <!-- switching waveform -->
  <path d="M 260 170 L 260 130 L 290 130 L 290 170 L 320 170 L 320 130 L 350 130 L 350 170"
        fill="none" stroke="#F97316" stroke-width="2.5"/>
  <text x="305" y="115" text-anchor="middle" font-size="10" fill="#F97316">xung vuông</text>

  <!-- inductor + cap smoothing -->
  <line x1="350" y1="170" x2="420" y2="170" stroke="#111827" stroke-width="2"/>
  <path d="M 420 170 q 10 -18 20 0 q 10 -18 20 0 q 10 -18 20 0" fill="none" stroke="#2563EB" stroke-width="2.5"/>
  <text x="460" y="150" text-anchor="middle" font-size="10" fill="#2563EB">cuộn cảm (L)</text>
  <line x1="480" y1="170" x2="540" y2="170" stroke="#111827" stroke-width="2"/>
  <line x1="540" y1="150" x2="540" y2="190" stroke="#16A34A" stroke-width="3"/>
  <line x1="555" y1="150" x2="555" y2="190" stroke="#16A34A" stroke-width="3"/>
  <text x="547" y="205" text-anchor="middle" font-size="10" fill="#16A34A">tụ lọc (C)</text>

  <!-- smoothed output -->
  <line x1="560" y1="170" x2="650" y2="170" stroke="#111827" stroke-width="2"/>
  <line x1="650" y1="170" x2="650" y2="130" stroke="#16A34A" stroke-width="2.5"/>
  <line x1="650" y1="130" x2="720" y2="130" stroke="#16A34A" stroke-width="2.5"/>
  <text x="685" y="112" text-anchor="middle" font-size="12" font-weight="600" fill="#16A34A">Vout = 5V</text>
  <text x="685" y="150" text-anchor="middle" font-size="10" fill="#6B7280">(đã lọc phẳng)</text>

  <rect x="130" y="280" width="540" height="110" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Vì sao hiệu suất cao hơn LDO?</text>
  <text x="400" y="333" text-anchor="middle" font-size="12" fill="#111827">Thay vì "đốt" phần điện áp dư thành nhiệt như LDO, Buck đóng/cắt</text>
  <text x="400" y="352" text-anchor="middle" font-size="12" fill="#111827">nguồn cực nhanh rồi dùng cuộn cảm + tụ để "trung bình hoá" ra điện áp</text>
  <text x="400" y="371" text-anchor="middle" font-size="12" fill="#111827">thấp hơn mong muốn — ít lãng phí năng lượng hơn nhiều, đặc biệt khi dòng lớn.</text>
</svg>
