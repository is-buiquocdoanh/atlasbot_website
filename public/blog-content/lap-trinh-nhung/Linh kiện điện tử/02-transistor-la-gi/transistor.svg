<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#FFFFFF"/>
  <text x="400" y="45" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Transistor (BJT) — công tắc điều khiển bằng dòng nhỏ</text>

  <!-- transistor body -->
  <circle cx="400" cy="220" r="90" fill="#2563EB" opacity="0.06" stroke="#2563EB" stroke-width="2.5"/>
  <text x="400" y="225" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">NPN</text>

  <!-- Base (left, from MCU) -->
  <line x1="150" y1="220" x2="330" y2="220" stroke="#F97316" stroke-width="3" marker-end="url(#arrowT)"/>
  <text x="150" y="200" font-size="13" font-weight="600" fill="#F97316">B (Base)</text>
  <text x="150" y="245" font-size="11" fill="#6B7280">dòng nhỏ từ GPIO</text>
  <text x="150" y="262" font-size="11" fill="#6B7280">(qua điện trở)</text>

  <!-- Collector (top, load side) -->
  <line x1="400" y1="60" x2="400" y2="150" stroke="#2563EB" stroke-width="3" marker-end="url(#arrowT)"/>
  <text x="400" y="45" text-anchor="middle" font-size="13" font-weight="600" fill="#2563EB">C (Collector)</text>
  <rect x="360" y="10" width="80" height="35" rx="4" fill="#F3F5F8" stroke="#2563EB"/>
  <text x="400" y="32" text-anchor="middle" font-size="11" fill="#111827">+12V / tải</text>

  <!-- Emitter (bottom, to GND) -->
  <line x1="400" y1="290" x2="400" y2="380" stroke="#16A34A" stroke-width="3" marker-end="url(#arrowT)"/>
  <text x="400" y="410" text-anchor="middle" font-size="13" font-weight="600" fill="#16A34A">E (Emitter) → GND</text>

  <rect x="550" y="180" width="200" height="120" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="650" y="205" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Nguyên lý</text>
  <text x="650" y="230" text-anchor="middle" font-size="11" fill="#111827">Dòng nhỏ ở B</text>
  <text x="650" y="248" text-anchor="middle" font-size="11" fill="#111827">"mở khoá" cho dòng</text>
  <text x="650" y="266" text-anchor="middle" font-size="11" fill="#111827">lớn chạy từ C → E</text>
  <text x="650" y="288" text-anchor="middle" font-size="10" fill="#6B7280">(dùng làm công tắc điện tử)</text>
</svg>
