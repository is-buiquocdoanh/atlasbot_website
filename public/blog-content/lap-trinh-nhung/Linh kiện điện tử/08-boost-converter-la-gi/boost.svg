<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Arial, sans-serif">
  <rect width="800" height="450" fill="#FFFFFF"/>
  <text x="400" y="45" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Boost Converter — tăng áp bằng cách "tích rồi xả" năng lượng</text>

  <text x="130" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#2563EB">Vin (VD pin 3.7V)</text>
  <line x1="130" y1="110" x2="130" y2="160" stroke="#111827" stroke-width="2"/>

  <!-- inductor charging -->
  <path d="M 130 160 q 10 -18 20 0 q 10 -18 20 0 q 10 -18 20 0" fill="none" stroke="#2563EB" stroke-width="2.5"/>
  <text x="170" y="140" text-anchor="middle" font-size="10" fill="#2563EB">cuộn cảm (L)</text>
  <text x="170" y="205" text-anchor="middle" font-size="10" fill="#6B7280">tích năng lượng khi switch đóng</text>

  <line x1="220" y1="160" x2="280" y2="160" stroke="#111827" stroke-width="2"/>

  <!-- switch to ground (charging path) -->
  <rect x="245" y="160" width="70" height="40" rx="4" fill="#F97316" opacity="0.12" stroke="#F97316" stroke-width="2"/>
  <text x="280" y="185" text-anchor="middle" font-size="11" fill="#111827">Switch</text>
  <line x1="280" y1="200" x2="280" y2="240" stroke="#6B7280" stroke-width="2"/>
  <text x="280" y="258" text-anchor="middle" font-size="10" fill="#6B7280">GND (khi tích năng lượng)</text>

  <!-- diode + output path -->
  <line x1="315" y1="160" x2="400" y2="160" stroke="#111827" stroke-width="2"/>
  <polygon points="400,145 400,175 430,160" fill="#DC2626" opacity="0.15" stroke="#111827" stroke-width="2"/>
  <text x="415" y="140" text-anchor="middle" font-size="10" fill="#DC2626">diode</text>

  <line x1="430" y1="160" x2="520" y2="160" stroke="#111827" stroke-width="2"/>
  <line x1="520" y1="140" x2="520" y2="180" stroke="#16A34A" stroke-width="3"/>
  <line x1="535" y1="140" x2="535" y2="180" stroke="#16A34A" stroke-width="3"/>
  <text x="527" y="198" text-anchor="middle" font-size="10" fill="#16A34A">tụ lọc (C)</text>

  <line x1="540" y1="160" x2="620" y2="160" stroke="#16A34A" stroke-width="2.5"/>
  <text x="660" y="150" text-anchor="middle" font-size="12" font-weight="600" fill="#16A34A">Vout = 5V</text>
  <text x="660" y="170" text-anchor="middle" font-size="10" fill="#6B7280">(cao hơn Vin)</text>

  <rect x="130" y="290" width="540" height="120" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="318" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Nguyên lý 2 bước lặp lại liên tục</text>
  <text x="400" y="343" text-anchor="middle" font-size="12" fill="#111827">1. Switch đóng: cuộn cảm tích luỹ năng lượng từ tù Vin</text>
  <text x="400" y="362" text-anchor="middle" font-size="12" fill="#111827">2. Switch mở: năng lượng tích luỹ CỘNG THÊM Vin, đẩy qua diode</text>
  <text x="400" y="381" text-anchor="middle" font-size="12" fill="#111827">ra tụ lọc → điện áp đầu ra cao hơn điện áp đầu vào</text>
</svg>
