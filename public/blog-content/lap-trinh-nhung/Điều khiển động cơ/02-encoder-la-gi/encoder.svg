<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Arial, sans-serif">
  <rect width="800" height="450" fill="#FFFFFF"/>
  <text x="400" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Tín hiệu vuông pha A/B — biết cả tốc độ lẫn chiều quay</text>

  <!-- disc illustration -->
  <circle cx="150" cy="130" r="55" fill="#F3F5F8" stroke="#6B7280" stroke-width="2"/>
  <circle cx="150" cy="130" r="8" fill="#6B7280"/>
  <g stroke="#2563EB" stroke-width="4">
    <line x1="150" y1="75" x2="150" y2="90"/>
    <line x1="188" y1="92" x2="178" y2="102"/>
    <line x1="205" y1="130" x2="190" y2="130"/>
    <line x1="188" y1="168" x2="178" y2="158"/>
    <line x1="150" y1="185" x2="150" y2="170"/>
    <line x1="112" y1="168" x2="122" y2="158"/>
    <line x1="95" y1="130" x2="110" y2="130"/>
    <line x1="112" y1="92" x2="122" y2="102"/>
  </g>
  <text x="150" y="220" text-anchor="middle" font-size="11" fill="#6B7280">Đĩa encoder gắn trên trục</text>

  <!-- quadrature waveforms -->
  <text x="500" y="80" text-anchor="middle" font-size="12" fill="#111827">Quay THUẬN — A lên trước B</text>
  <text x="330" y="105" font-size="11" fill="#2563EB">A</text>
  <polyline points="360,120 360,105 400,105 400,120 440,120 440,105 480,105 480,120 520,120 520,105 560,105" fill="none" stroke="#2563EB" stroke-width="2.5"/>
  <text x="330" y="150" font-size="11" fill="#F97316">B</text>
  <polyline points="370,165 370,150 410,150 410,165 450,165 450,150 490,150 490,165 530,165 530,150 570,150" fill="none" stroke="#F97316" stroke-width="2.5"/>

  <text x="500" y="215" text-anchor="middle" font-size="12" fill="#111827">Quay NGƯỢC — B lên trước A</text>
  <text x="330" y="240" font-size="11" fill="#2563EB">A</text>
  <polyline points="370,255 370,240 410,240 410,255 450,255 450,240 490,240 490,255 530,255 530,240 570,240" fill="none" stroke="#2563EB" stroke-width="2.5"/>
  <text x="330" y="280" font-size="11" fill="#F97316">B</text>
  <polyline points="360,295 360,280 400,280 400,295 440,295 440,280 480,280 480,295 520,295 520,280 560,280" fill="none" stroke="#F97316" stroke-width="2.5"/>

  <rect x="90" y="345" width="620" height="60" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="370" text-anchor="middle" font-size="12" fill="#111827">Đếm xung → tốc độ · Thứ tự A/B lên trước → chiều quay</text>
  <text x="400" y="390" text-anchor="middle" font-size="11" fill="#6B7280">STM32 Timer Encoder Mode tự làm việc này bằng phần cứng</text>
</svg>
