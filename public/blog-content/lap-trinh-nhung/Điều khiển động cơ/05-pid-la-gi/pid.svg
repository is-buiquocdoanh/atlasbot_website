<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowPID" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#FFFFFF"/>
  <text x="400" y="35" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Sơ đồ khối vòng điều khiển PID</text>

  <!-- setpoint -->
  <rect x="40" y="180" width="100" height="45" rx="6" fill="#F3F5F8" stroke="#6B7280"/>
  <text x="90" y="207" text-anchor="middle" font-size="11" fill="#111827">Setpoint</text>

  <!-- sum junction -->
  <circle cx="190" cy="202" r="18" fill="#FFFFFF" stroke="#111827" stroke-width="1.5"/>
  <text x="190" y="207" text-anchor="middle" font-size="12" fill="#111827">Σ</text>
  <line x1="140" y1="202" x2="172" y2="202" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowPID)"/>
  <text x="190" y="235" text-anchor="middle" font-size="10" fill="#6B7280">error</text>

  <!-- P I D branches -->
  <rect x="250" y="70" width="90" height="40" rx="6" fill="#2563EB" opacity="0.12" stroke="#2563EB" stroke-width="2"/>
  <text x="295" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">P</text>

  <rect x="250" y="185" width="90" height="40" rx="6" fill="#F97316" opacity="0.12" stroke="#F97316" stroke-width="2"/>
  <text x="295" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">I</text>

  <rect x="250" y="300" width="90" height="40" rx="6" fill="#16A34A" opacity="0.12" stroke="#16A34A" stroke-width="2"/>
  <text x="295" y="325" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">D</text>

  <line x1="208" y1="202" x2="250" y2="90" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrowPID)"/>
  <line x1="208" y1="202" x2="250" y2="205" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrowPID)"/>
  <line x1="208" y1="202" x2="250" y2="320" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrowPID)"/>

  <!-- sum2 -->
  <circle cx="420" cy="202" r="18" fill="#FFFFFF" stroke="#111827" stroke-width="1.5"/>
  <text x="420" y="207" text-anchor="middle" font-size="12" fill="#111827">Σ</text>
  <line x1="340" y1="90" x2="420" y2="190" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrowPID)"/>
  <line x1="340" y1="205" x2="402" y2="202" stroke="#F97316" stroke-width="1.5" marker-end="url(#arrowPID)"/>
  <line x1="340" y1="320" x2="420" y2="214" stroke="#16A34A" stroke-width="1.5" marker-end="url(#arrowPID)"/>

  <!-- motor -->
  <rect x="480" y="180" width="110" height="45" rx="6" fill="#DC2626" opacity="0.08" stroke="#DC2626" stroke-width="2"/>
  <text x="535" y="207" text-anchor="middle" font-size="11" fill="#111827">PWM → Motor</text>
  <line x1="438" y1="202" x2="475" y2="202" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowPID)"/>

  <!-- feedback -->
  <rect x="480" y="330" width="130" height="45" rx="6" fill="#6B7280" opacity="0.10" stroke="#6B7280" stroke-width="2"/>
  <text x="545" y="357" text-anchor="middle" font-size="11" fill="#111827">Encoder đo tốc độ</text>

  <line x1="535" y1="225" x2="535" y2="330" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrowPID)"/>
  <path d="M 480 352 L 90 352 L 90 225" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowPID)"/>
  <text x="280" y="368" text-anchor="middle" font-size="10" fill="#6B7280">Phản hồi (feedback) — vòng lặp khép kín</text>
</svg>
