<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Arial, sans-serif">
  <rect width="800" height="450" fill="#FFFFFF"/>
  <text x="400" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">H-Bridge đứng giữa MCU và động cơ</text>

  <!-- wrong way -->
  <text x="200" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#DC2626">✕ Sai</text>
  <rect x="90" y="95" width="110" height="50" rx="6" fill="#F3F5F8" stroke="#6B7280"/>
  <text x="145" y="125" text-anchor="middle" font-size="11" fill="#111827">MCU (GPIO)</text>
  <line x1="200" y1="120" x2="270" y2="120" stroke="#DC2626" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="235" y="112" text-anchor="middle" font-size="9" fill="#DC2626">vài chục mA</text>
  <circle cx="310" cy="120" r="40" fill="#DC2626" opacity="0.08" stroke="#DC2626" stroke-width="2"/>
  <text x="310" y="125" text-anchor="middle" font-size="11" fill="#111827">Motor</text>
  <text x="310" y="180" text-anchor="middle" font-size="10" fill="#DC2626">Cần vài trăm mA – vài A</text>
  <text x="310" y="196" text-anchor="middle" font-size="10" fill="#DC2626">→ hỏng chân GPIO</text>

  <!-- right way -->
  <text x="600" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#16A34A">✓ Đúng</text>
  <rect x="480" y="95" width="100" height="50" rx="6" fill="#F3F5F8" stroke="#6B7280"/>
  <text x="530" y="125" text-anchor="middle" font-size="11" fill="#111827">MCU</text>
  <line x1="580" y1="120" x2="630" y2="120" stroke="#2563EB" stroke-width="2"/>
  <text x="605" y="112" text-anchor="middle" font-size="8" fill="#2563EB">tín hiệu</text>

  <rect x="630" y="90" width="110" height="60" rx="6" fill="#F97316" opacity="0.12" stroke="#F97316" stroke-width="2"/>
  <text x="685" y="115" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">H-Bridge</text>
  <text x="685" y="132" text-anchor="middle" font-size="9" fill="#6B7280">(driver)</text>

  <line x1="685" y1="150" x2="685" y2="185" stroke="#16A34A" stroke-width="3"/>
  <circle cx="685" cy="220" r="35" fill="#16A34A" opacity="0.10" stroke="#16A34A" stroke-width="2"/>
  <text x="685" y="225" text-anchor="middle" font-size="11" fill="#111827">Motor</text>

  <text x="740" y="115" font-size="9" fill="#6B7280">↑ nguồn riêng</text>
  <line x1="770" y1="70" x2="770" y2="120" stroke="#6B7280" stroke-width="1.5"/>
  <text x="770" y="60" text-anchor="middle" font-size="9" fill="#6B7280">12V</text>

  <!-- PWM waveform -->
  <rect x="90" y="290" width="620" height="120" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="110" y="315" font-size="12" fill="#111827">PWM (duty cycle) quyết định điện áp trung bình = tốc độ</text>
  <polyline points="120,340 120,325 155,325 155,340 190,340 190,325 225,325 225,340 260,340 260,325 295,325 295,340" fill="none" stroke="#2563EB" stroke-width="2.5"/>
  <text x="200" y="365" text-anchor="middle" font-size="10" fill="#6B7280">Duty cycle thấp → quay chậm</text>

  <polyline points="400,340 400,320 460,320 460,340 480,340 480,320 540,320 540,340 560,340 560,320 620,320 620,340" fill="none" stroke="#16A34A" stroke-width="2.5"/>
  <text x="510" y="365" text-anchor="middle" font-size="10" fill="#6B7280">Duty cycle cao → quay nhanh</text>
</svg>
