<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Arial, sans-serif">
  <rect width="800" height="450" fill="#FFFFFF"/>
  <text x="400" y="35" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Tốc độ thực khi gặp dốc: Open-loop vs Closed-loop</text>

  <!-- axes -->
  <line x1="90" y1="380" x2="740" y2="380" stroke="#111827" stroke-width="1.5"/>
  <text x="415" y="410" text-anchor="middle" font-size="11" fill="#6B7280">Thời gian (robot bắt đầu leo dốc ở giữa)</text>
  <line x1="90" y1="80" x2="90" y2="380" stroke="#111827" stroke-width="1.5"/>
  <text x="60" y="230" text-anchor="middle" font-size="11" fill="#6B7280" transform="rotate(-90,60,230)">Tốc độ</text>

  <!-- target line -->
  <line x1="90" y1="200" x2="740" y2="200" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="700" y="192" font-size="10" fill="#6B7280">Tốc độ mục tiêu</text>

  <!-- dốc marker -->
  <line x1="410" y1="80" x2="410" y2="380" stroke="#DC2626" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="410" y="70" text-anchor="middle" font-size="10" fill="#DC2626">Bắt đầu leo dốc</text>

  <!-- open loop line: drops after slope -->
  <polyline points="90,200 410,200 460,290 740,290" fill="none" stroke="#F97316" stroke-width="3"/>
  <text x="600" y="310" font-size="11" fill="#F97316" font-weight="700">Open-loop: tốc độ tụt, không tự bù</text>

  <!-- closed loop line: dips then recovers -->
  <polyline points="90,202 410,202 440,235 480,210 520,201 740,200" fill="none" stroke="#16A34A" stroke-width="3"/>
  <text x="600" y="185" font-size="11" fill="#16A34A" font-weight="700">Closed-loop (PID): tự bù, giữ tốc độ</text>

  <rect x="90" y="0" width="0" height="0"/>
</svg>
