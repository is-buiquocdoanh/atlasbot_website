<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#FFFFFF"/>
  <text x="400" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Call stack — mỗi lệnh gọi hàm thêm một tầng</text>

  <!-- stack tower -->
  <text x="230" y="80" text-anchor="middle" font-size="12" fill="#6B7280">Stack (RAM)</text>
  <line x1="330" y1="80" x2="330" y2="380" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrowF)"/>
  <text x="345" y="380" font-size="10" fill="#6B7280">tăng dần</text>

  <rect x="110" y="330" width="200" height="50" fill="#2563EB" opacity="0.12" stroke="#2563EB" stroke-width="2"/>
  <text x="210" y="360" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">main()</text>

  <rect x="110" y="270" width="200" height="50" fill="#16A34A" opacity="0.12" stroke="#16A34A" stroke-width="2"/>
  <text x="210" y="300" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">read_sensor()</text>

  <rect x="110" y="210" width="200" height="50" fill="#F97316" opacity="0.12" stroke="#F97316" stroke-width="2"/>
  <text x="210" y="240" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">convert_to_celsius()</text>

  <text x="450" y="230" font-size="11" fill="#111827">← đỉnh stack hiện tại</text>
  <text x="450" y="248" font-size="10" fill="#6B7280">(return address + biến cục bộ)</text>

  <!-- function pointer callout -->
  <rect x="450" y="300" width="270" height="80" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="465" y="325" font-size="11" font-family="monospace" fill="#111827">handler = on_button_press;</text>
  <text x="465" y="345" font-size="11" font-family="monospace" fill="#111827">handler();</text>
  <text x="465" y="365" font-size="10" fill="#6B7280">con trỏ hàm → gọi gián tiếp</text>

  <!-- warning box -->
  <rect x="90" y="400" width="620" height="40" rx="8" fill="#DC2626" opacity="0.06" stroke="#DC2626" stroke-width="1.5"/>
  <text x="400" y="425" text-anchor="middle" font-size="12" fill="#111827">Gọi hàm quá sâu (đệ quy, mảng cục bộ lớn) có thể làm tràn stack</text>
</svg>
