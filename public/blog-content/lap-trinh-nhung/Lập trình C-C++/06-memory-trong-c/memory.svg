<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowM1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrowM2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#FFFFFF"/>
  <text x="400" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Bản đồ bộ nhớ: Stack và Heap chia nhau vùng trống</text>

  <text x="90" y="70" font-size="11" fill="#6B7280">Flash (không mất khi tắt nguồn)</text>
  <rect x="90" y="80" width="180" height="60" fill="#6B7280" opacity="0.12" stroke="#6B7280" stroke-width="1.5"/>
  <text x="180" y="105" text-anchor="middle" font-size="11" fill="#111827">.text (code)</text>
  <text x="180" y="123" text-anchor="middle" font-size="11" fill="#111827">.rodata (const)</text>

  <text x="450" y="70" font-size="11" fill="#6B7280">RAM (mất khi tắt nguồn)</text>
  <rect x="290" y="80" width="480" height="60" fill="#F3F5F8" stroke="#E5E9EF" stroke-width="1.5"/>

  <rect x="300" y="88" width="90" height="44" fill="#2563EB" opacity="0.15" stroke="#2563EB"/>
  <text x="345" y="114" text-anchor="middle" font-size="10" fill="#111827">.data</text>

  <rect x="395" y="88" width="90" height="44" fill="#16A34A" opacity="0.15" stroke="#16A34A"/>
  <text x="440" y="114" text-anchor="middle" font-size="10" fill="#111827">.bss</text>

  <!-- heap growing right -->
  <rect x="90" y="220" width="230" height="60" fill="#F97316" opacity="0.12" stroke="#F97316" stroke-width="2"/>
  <text x="205" y="245" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Heap</text>
  <text x="205" y="263" text-anchor="middle" font-size="10" fill="#6B7280">malloc() — tăng dần →</text>
  <line x1="320" y1="250" x2="360" y2="250" stroke="#F97316" stroke-width="2" marker-end="url(#arrowM1)"/>

  <text x="400" y="250" text-anchor="middle" font-size="11" fill="#DC2626" font-weight="700">vùng trống</text>
  <text x="400" y="266" text-anchor="middle" font-size="10" fill="#DC2626">(va chạm = stack overflow)</text>

  <!-- stack growing left -->
  <line x1="440" y1="250" x2="480" y2="250" stroke="#DC2626" stroke-width="2" marker-end="url(#arrowM2)"/>
  <rect x="480" y="220" width="230" height="60" fill="#DC2626" opacity="0.10" stroke="#DC2626" stroke-width="2"/>
  <text x="595" y="245" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Stack</text>
  <text x="595" y="263" text-anchor="middle" font-size="10" fill="#6B7280">← biến cục bộ, giảm dần</text>

  <rect x="90" y="340" width="620" height="60" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="363" text-anchor="middle" font-size="12" fill="#111827">Code nhúng chạy dài hạn ưu tiên cấp phát tĩnh (mảng cố định)</text>
  <text x="400" y="383" text-anchor="middle" font-size="12" fill="#111827">thay vì malloc — tránh phân mảnh và va chạm stack/heap</text>
</svg>
