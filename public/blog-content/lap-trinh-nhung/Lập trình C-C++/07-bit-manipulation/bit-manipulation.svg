<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Arial, sans-serif">
  <rect width="800" height="450" fill="#FFFFFF"/>
  <text x="400" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Set bit 3 mà không đụng các bit khác</text>

  <!-- before register -->
  <text x="150" y="80" text-anchor="middle" font-size="12" fill="#6B7280">Trước (REG)</text>
  <g font-family="monospace" font-size="16" font-weight="700">
    <rect x="60" y="90" width="40" height="40" fill="#F3F5F8" stroke="#E5E9EF"/>
    <text x="80" y="116" text-anchor="middle" fill="#111827">0</text>
    <rect x="100" y="90" width="40" height="40" fill="#F3F5F8" stroke="#E5E9EF"/>
    <text x="120" y="116" text-anchor="middle" fill="#111827">0</text>
    <rect x="140" y="90" width="40" height="40" fill="#F3F5F8" stroke="#E5E9EF"/>
    <text x="160" y="116" text-anchor="middle" fill="#111827">0</text>
    <rect x="180" y="90" width="40" height="40" fill="#F3F5F8" stroke="#E5E9EF"/>
    <text x="200" y="116" text-anchor="middle" fill="#111827">0</text>
    <rect x="220" y="90" width="40" height="40" fill="#2563EB" opacity="0.15" stroke="#2563EB" stroke-width="2"/>
    <text x="240" y="116" text-anchor="middle" fill="#111827">1</text>
    <rect x="260" y="90" width="40" height="40" fill="#F3F5F8" stroke="#E5E9EF"/>
    <text x="280" y="116" text-anchor="middle" fill="#111827">0</text>
    <rect x="300" y="90" width="40" height="40" fill="#F3F5F8" stroke="#E5E9EF"/>
    <text x="320" y="116" text-anchor="middle" fill="#111827">1</text>
    <rect x="340" y="90" width="40" height="40" fill="#F3F5F8" stroke="#E5E9EF"/>
    <text x="360" y="116" text-anchor="middle" fill="#111827">1</text>
  </g>
  <text x="200" y="150" text-anchor="middle" font-size="9" fill="#6B7280">bit 7 ... bit 3 ... bit 0</text>

  <text x="400" y="115" text-anchor="middle" font-size="20" fill="#6B7280">|</text>

  <!-- mask -->
  <text x="490" y="80" text-anchor="middle" font-size="12" fill="#6B7280">Mask (1 &lt;&lt; 3)</text>
  <g font-family="monospace" font-size="16" font-weight="700">
    <rect x="400" y="90" width="40" height="40" fill="#F3F5F8" stroke="#E5E9EF"/>
    <text x="420" y="116" text-anchor="middle" fill="#6B7280">0</text>
    <rect x="440" y="90" width="40" height="40" fill="#F3F5F8" stroke="#E5E9EF"/>
    <text x="460" y="116" text-anchor="middle" fill="#6B7280">0</text>
    <rect x="480" y="90" width="40" height="40" fill="#F3F5F8" stroke="#E5E9EF"/>
    <text x="500" y="116" text-anchor="middle" fill="#6B7280">0</text>
    <rect x="520" y="90" width="40" height="40" fill="#F3F5F8" stroke="#E5E9EF"/>
    <text x="540" y="116" text-anchor="middle" fill="#6B7280">0</text>
    <rect x="560" y="90" width="40" height="40" fill="#16A34A" opacity="0.18" stroke="#16A34A" stroke-width="2"/>
    <text x="580" y="116" text-anchor="middle" fill="#111827">1</text>
    <rect x="600" y="90" width="40" height="40" fill="#F3F5F8" stroke="#E5E9EF"/>
    <text x="620" y="116" text-anchor="middle" fill="#6B7280">0</text>
    <rect x="640" y="90" width="40" height="40" fill="#F3F5F8" stroke="#E5E9EF"/>
    <text x="660" y="116" text-anchor="middle" fill="#6B7280">0</text>
    <rect x="680" y="90" width="40" height="40" fill="#F3F5F8" stroke="#E5E9EF"/>
    <text x="700" y="116" text-anchor="middle" fill="#6B7280">0</text>
  </g>

  <line x1="60" y1="170" x2="720" y2="170" stroke="#111827" stroke-width="1.5"/>
  <text x="400" y="190" text-anchor="middle" font-size="14" fill="#6B7280">↓</text>

  <!-- result -->
  <text x="400" y="225" text-anchor="middle" font-size="12" fill="#6B7280">Kết quả (REG |= (1 &lt;&lt; 3))</text>
  <g font-family="monospace" font-size="16" font-weight="700" transform="translate(60,0)">
    <rect x="170" y="235" width="40" height="40" fill="#F3F5F8" stroke="#E5E9EF"/>
    <text x="190" y="261" text-anchor="middle" fill="#111827">0</text>
    <rect x="210" y="235" width="40" height="40" fill="#F3F5F8" stroke="#E5E9EF"/>
    <text x="230" y="261" text-anchor="middle" fill="#111827">0</text>
    <rect x="250" y="235" width="40" height="40" fill="#F3F5F8" stroke="#E5E9EF"/>
    <text x="270" y="261" text-anchor="middle" fill="#111827">0</text>
    <rect x="290" y="235" width="40" height="40" fill="#F3F5F8" stroke="#E5E9EF"/>
    <text x="310" y="261" text-anchor="middle" fill="#111827">0</text>
    <rect x="330" y="235" width="40" height="40" fill="#DC2626" opacity="0.15" stroke="#DC2626" stroke-width="2.5"/>
    <text x="350" y="261" text-anchor="middle" fill="#111827">1</text>
    <rect x="370" y="235" width="40" height="40" fill="#F3F5F8" stroke="#E5E9EF"/>
    <text x="390" y="261" text-anchor="middle" fill="#111827">0</text>
    <rect x="410" y="235" width="40" height="40" fill="#F3F5F8" stroke="#E5E9EF"/>
    <text x="430" y="261" text-anchor="middle" fill="#111827">1</text>
    <rect x="450" y="235" width="40" height="40" fill="#F3F5F8" stroke="#E5E9EF"/>
    <text x="470" y="261" text-anchor="middle" fill="#111827">1</text>
  </g>
  <text x="460" y="300" text-anchor="middle" font-size="11" fill="#DC2626">bit 3 mới thành 1 — các bit khác giữ nguyên như trước</text>

  <rect x="90" y="345" width="620" height="60" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="370" text-anchor="middle" font-size="12" fill="#111827">Set: REG |= (1&lt;&lt;n) · Clear: REG &amp;= ~(1&lt;&lt;n)</text>
  <text x="400" y="390" text-anchor="middle" font-size="12" fill="#111827">Toggle: REG ^= (1&lt;&lt;n) · Check: REG &amp; (1&lt;&lt;n)</text>
</svg>
