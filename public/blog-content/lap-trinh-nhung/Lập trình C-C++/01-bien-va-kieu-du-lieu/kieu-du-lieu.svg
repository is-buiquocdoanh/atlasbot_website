<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Arial, sans-serif">
  <rect width="800" height="450" fill="#FFFFFF"/>
  <text x="400" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Cùng là "số nguyên", kích thước rất khác nhau</text>

  <!-- uint8_t -->
  <text x="90" y="95" font-size="12" font-weight="700" fill="#111827">uint8_t</text>
  <rect x="90" y="105" width="30" height="30" fill="#2563EB" opacity="0.15" stroke="#2563EB"/>
  <text x="130" y="125" font-size="11" fill="#6B7280">1 byte · 0 – 255</text>

  <!-- uint16_t -->
  <text x="90" y="165" font-size="12" font-weight="700" fill="#111827">uint16_t</text>
  <rect x="90" y="175" width="30" height="30" fill="#16A34A" opacity="0.15" stroke="#16A34A"/>
  <rect x="120" y="175" width="30" height="30" fill="#16A34A" opacity="0.15" stroke="#16A34A"/>
  <text x="160" y="195" font-size="11" fill="#6B7280">2 byte · 0 – 65.535</text>

  <!-- uint32_t -->
  <text x="90" y="235" font-size="12" font-weight="700" fill="#111827">uint32_t</text>
  <rect x="90" y="245" width="30" height="30" fill="#F97316" opacity="0.15" stroke="#F97316"/>
  <rect x="120" y="245" width="30" height="30" fill="#F97316" opacity="0.15" stroke="#F97316"/>
  <rect x="150" y="245" width="30" height="30" fill="#F97316" opacity="0.15" stroke="#F97316"/>
  <rect x="180" y="245" width="30" height="30" fill="#F97316" opacity="0.15" stroke="#F97316"/>
  <text x="220" y="265" font-size="11" fill="#6B7280">4 byte · 0 – 4,29 tỷ</text>

  <!-- overflow example -->
  <rect x="450" y="90" width="290" height="190" rx="10" fill="#DC2626" opacity="0.05" stroke="#DC2626" stroke-width="2"/>
  <text x="595" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Tràn số (overflow)</text>
  <text x="470" y="145" font-size="12" fill="#111827">uint8_t counter = 250;</text>
  <text x="470" y="165" font-size="12" fill="#111827">counter += 10;</text>
  <line x1="470" y1="180" x2="700" y2="180" stroke="#DC2626" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="470" y="205" font-size="12" font-weight="700" fill="#DC2626">→ kết quả = 4, không phải 260</text>
  <text x="470" y="230" font-size="10" fill="#6B7280">Vì uint8_t chỉ chứa tối đa 255,</text>
  <text x="470" y="248" font-size="10" fill="#6B7280">giá trị "vòng lại" từ đầu</text>

  <rect x="90" y="340" width="650" height="60" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="415" y="365" text-anchor="middle" font-size="12" fill="#111827">Chọn kích thước vừa đủ để tiết kiệm RAM, nhưng đủ rộng</text>
  <text x="415" y="383" text-anchor="middle" font-size="12" fill="#111827">để không bao giờ tràn số trong tính toán trung gian</text>
</svg>
