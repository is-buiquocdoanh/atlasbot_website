<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#FFFFFF"/>
  <text x="400" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Con trỏ lưu địa chỉ, không lưu giá trị</text>

  <!-- memory strip -->
  <text x="90" y="90" font-size="12" fill="#6B7280">Bộ nhớ RAM</text>
  <rect x="90" y="100" width="620" height="50" fill="#F3F5F8" stroke="#E5E9EF"/>
  <line x1="180" y1="100" x2="180" y2="150" stroke="#E5E9EF"/>
  <line x1="270" y1="100" x2="270" y2="150" stroke="#E5E9EF"/>
  <line x1="360" y1="100" x2="360" y2="150" stroke="#E5E9EF"/>
  <line x1="450" y1="100" x2="450" y2="150" stroke="#E5E9EF"/>
  <line x1="540" y1="100" x2="540" y2="150" stroke="#E5E9EF"/>
  <line x1="630" y1="100" x2="630" y2="150" stroke="#E5E9EF"/>

  <!-- sensor_value cell -->
  <rect x="360" y="100" width="90" height="50" fill="#16A34A" opacity="0.15" stroke="#16A34A" stroke-width="2"/>
  <text x="405" y="90" text-anchor="middle" font-size="11" font-weight="700" fill="#16A34A">sensor_value</text>
  <text x="405" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">42</text>
  <text x="405" y="170" text-anchor="middle" font-size="10" fill="#6B7280">địa chỉ: 0x2000001c</text>

  <!-- p cell -->
  <rect x="540" y="100" width="90" height="50" fill="#2563EB" opacity="0.15" stroke="#2563EB" stroke-width="2"/>
  <text x="585" y="90" text-anchor="middle" font-size="11" font-weight="700" fill="#2563EB">p (con trỏ)</text>
  <text x="585" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">0x2000001c</text>
  <text x="585" y="170" text-anchor="middle" font-size="10" fill="#6B7280">địa chỉ: 0x20000030</text>

  <!-- arrow from p to sensor_value -->
  <path d="M 585 195 C 585 240, 405 240, 405 155" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowP)"/>
  <text x="495" y="250" text-anchor="middle" font-size="11" fill="#2563EB">p trỏ tới sensor_value</text>

  <rect x="150" y="290" width="500" height="110" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="175" y="315" font-size="12" font-family="monospace" fill="#111827">uint8_t sensor_value = 42;</text>
  <text x="175" y="338" font-size="12" font-family="monospace" fill="#111827">uint8_t *p = &amp;sensor_value;  // &amp; = lấy địa chỉ</text>
  <text x="175" y="361" font-size="12" font-family="monospace" fill="#111827">*p;  // = 42 — * = "đi tới" địa chỉ để đọc giá trị</text>
</svg>
