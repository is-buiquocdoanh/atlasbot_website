<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Arial, sans-serif">
  <rect width="800" height="480" fill="#FFFFFF"/>
  <text x="400" y="35" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">AMCL — hội tụ dần bằng bộ lọc hạt (particle filter)</text>

  <!-- Panel 1: initial -->
  <g>
    <rect x="30" y="65" width="220" height="220" rx="10" fill="#F3F5F8" stroke="#6B7280" stroke-width="1.5"/>
    <text x="140" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">1. Khởi tạo</text>
    <text x="140" y="338" text-anchor="middle" font-size="10" fill="#6B7280">Hạt rải đều toàn bản đồ</text>
    <!-- scattered particles -->
    <g fill="#DC2626" opacity="0.65">
      <circle cx="60" cy="90" r="3"/><circle cx="95" cy="110" r="3"/><circle cx="140" cy="80" r="3"/>
      <circle cx="180" cy="105" r="3"/><circle cx="220" cy="95" r="3"/><circle cx="75" cy="140" r="3"/>
      <circle cx="120" cy="150" r="3"/><circle cx="165" cy="135" r="3"/><circle cx="210" cy="150" r="3"/>
      <circle cx="50" cy="180" r="3"/><circle cx="100" cy="190" r="3"/><circle cx="150" cy="200" r="3"/>
      <circle cx="195" cy="185" r="3"/><circle cx="230" cy="200" r="3"/><circle cx="70" cy="230" r="3"/>
      <circle cx="130" cy="240" r="3"/><circle cx="175" cy="255" r="3"/><circle cx="215" cy="240" r="3"/>
      <circle cx="45" cy="260" r="3"/><circle cx="105" cy="265" r="3"/>
    </g>
  </g>

  <!-- Panel 2: converging -->
  <g>
    <rect x="290" y="65" width="220" height="220" rx="10" fill="#F3F5F8" stroke="#6B7280" stroke-width="1.5"/>
    <text x="400" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">2. Cập nhật trọng số</text>
    <text x="400" y="338" text-anchor="middle" font-size="10" fill="#6B7280">So khớp scan LiDAR với bản đồ</text>
    <g fill="#DC2626" opacity="0.5">
      <circle cx="320" cy="100" r="2.5"/><circle cx="480" cy="110" r="2.5"/><circle cx="330" cy="250" r="2.5"/>
      <circle cx="470" cy="240" r="2.5"/><circle cx="310" cy="180" r="2.5"/>
    </g>
    <g fill="#F97316" opacity="0.8">
      <circle cx="380" cy="160" r="3.5"/><circle cx="410" cy="150" r="3.5"/><circle cx="395" cy="180" r="3.5"/>
      <circle cx="420" cy="170" r="3.5"/><circle cx="370" cy="185" r="3.5"/>
    </g>
    <g fill="#16A34A">
      <circle cx="400" cy="170" r="5"/>
    </g>
  </g>

  <!-- Panel 3: converged -->
  <g>
    <rect x="550" y="65" width="220" height="220" rx="10" fill="#F3F5F8" stroke="#6B7280" stroke-width="1.5"/>
    <text x="660" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">3. Hội tụ</text>
    <text x="660" y="338" text-anchor="middle" font-size="10" fill="#6B7280">Hạt tập trung quanh vị trí thật</text>
    <g fill="#16A34A" opacity="0.85">
      <circle cx="655" cy="170" r="3"/><circle cx="662" cy="165" r="3"/><circle cx="658" cy="178" r="3"/>
      <circle cx="665" cy="172" r="3"/><circle cx="650" cy="175" r="3"/><circle cx="660" cy="160" r="3"/>
    </g>
    <circle cx="660" cy="170" r="7" fill="#2563EB"/>
    <line x1="660" y1="170" x2="660" y2="150" stroke="#2563EB" stroke-width="2"/>
    <text x="700" y="150" font-size="10" fill="#2563EB">Vị trí ước lượng</text>
  </g>

  <rect x="90" y="400" width="620" height="55" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="423" text-anchor="middle" font-size="12" fill="#111827">Mỗi hạt = 1 giả thuyết vị trí (x, y, θ) · trọng số càng cao khi scan dự đoán càng khớp scan thật</text>
  <text x="400" y="443" text-anchor="middle" font-size="11" fill="#6B7280">Lặp lại mỗi khi robot di chuyển — quá trình resampling loại dần các hạt có trọng số thấp</text>
</svg>
