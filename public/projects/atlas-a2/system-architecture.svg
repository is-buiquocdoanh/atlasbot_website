<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" font-family="Arial, sans-serif">
  <defs>
    <marker id="a2Arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="800" height="700" fill="#FFFFFF"/>
  <text x="400" y="35" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Kiến trúc hệ thống Atlas A2</text>

  <!-- Layer 3: PC control layer (top) -->
  <rect x="120" y="65" width="560" height="115" rx="14" fill="#EDE9FE" stroke="#9333EA" stroke-width="2"/>
  <text x="400" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#6B21A8">PC — ĐIỀU KHIỂN &amp; GIÁM SÁT</text>

  <rect x="150" y="105" width="240" height="60" rx="8" fill="#FFFFFF" stroke="#9333EA" stroke-width="1.5"/>
  <text x="270" y="127" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">atlas_api (Flask)</text>
  <text x="270" y="144" text-anchor="middle" font-size="9" fill="#6B7280">REST :8080 · WebSocket :8081</text>
  <text x="270" y="158" text-anchor="middle" font-size="9" fill="#6B7280">cầu nối ROS2 ↔ HTTP/WS</text>

  <rect x="410" y="105" width="220" height="60" rx="8" fill="#FFFFFF" stroke="#9333EA" stroke-width="1.5"/>
  <text x="520" y="127" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">atlas_app (PyQt5)</text>
  <text x="520" y="144" text-anchor="middle" font-size="9" fill="#6B7280">bản đồ realtime, Nav Goal,</text>
  <text x="520" y="158" text-anchor="middle" font-size="9" fill="#6B7280">waypoints, tường ảo</text>

  <line x1="400" y1="180" x2="400" y2="215" stroke="#111827" stroke-width="2" marker-end="url(#a2Arrow)" marker-start="url(#a2Arrow)"/>
  <text x="416" y="202" font-size="9" fill="#374151">DDS / ROS2 topics — cùng ROS_DOMAIN_ID</text>

  <!-- Layer 2: Jetson Orin Nano compute -->
  <rect x="120" y="220" width="560" height="185" rx="14" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="400" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">JETSON ORIN NANO — ROS2 HUMBLE</text>

  <rect x="145" y="260" width="165" height="55" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
  <text x="227" y="281" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">slam_toolbox / AMCL</text>
  <text x="227" y="298" text-anchor="middle" font-size="9" fill="#6B7280">dựng bản đồ, định vị</text>

  <rect x="320" y="260" width="160" height="55" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
  <text x="400" y="281" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Nav2 (DWB/MPPI)</text>
  <text x="400" y="298" text-anchor="middle" font-size="9" fill="#6B7280">lập &amp; bám đường đi</text>

  <rect x="490" y="260" width="165" height="55" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
  <text x="572" y="281" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">YOLOv8</text>
  <text x="572" y="298" text-anchor="middle" font-size="9" fill="#6B7280">nhận diện vật thể realtime</text>

  <rect x="145" y="325" width="510" height="60" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
  <text x="400" y="348" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">line_follow.py — auto-docking state machine</text>
  <text x="400" y="365" text-anchor="middle" font-size="9" fill="#6B7280">INIT → SEARCH → FOLLOW → STOPPED (xem sơ đồ riêng)</text>

  <line x1="400" y1="405" x2="400" y2="440" stroke="#111827" stroke-width="2" marker-end="url(#a2Arrow)" marker-start="url(#a2Arrow)"/>
  <text x="416" y="427" font-size="9" fill="#374151">USB-CAN · Modbus RTU · USB (v4l2)</text>

  <!-- Layer 1: hardware / sensors -->
  <rect x="120" y="445" width="560" height="140" rx="14" fill="#FFEDD5" stroke="#F97316" stroke-width="2"/>
  <text x="400" y="470" text-anchor="middle" font-size="13" font-weight="700" fill="#9A3412">PHẦN CỨNG &amp; CẢM BIẾN</text>

  <rect x="140" y="485" width="130" height="80" rx="8" fill="#FFFFFF" stroke="#F97316" stroke-width="1.5"/>
  <text x="205" y="508" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">TSDA-C12D</text>
  <text x="205" y="524" text-anchor="middle" font-size="9" fill="#6B7280">motor driver</text>
  <text x="205" y="539" text-anchor="middle" font-size="9" fill="#6B7280">4x mecanum</text>
  <text x="205" y="554" text-anchor="middle" font-size="9" fill="#6B7280">(USB-CAN)</text>

  <rect x="280" y="485" width="130" height="80" rx="8" fill="#FFFFFF" stroke="#F97316" stroke-width="1.5"/>
  <text x="345" y="508" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">RPlidar A2M12</text>
  <text x="345" y="524" text-anchor="middle" font-size="9" fill="#6B7280">quét 360°</text>
  <text x="345" y="539" text-anchor="middle" font-size="9" fill="#6B7280">SLAM + Nav2</text>

  <rect x="420" y="485" width="130" height="80" rx="8" fill="#FFFFFF" stroke="#F97316" stroke-width="1.5"/>
  <text x="485" y="508" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Cảm biến từ 16-kênh</text>
  <text x="485" y="524" text-anchor="middle" font-size="9" fill="#6B7280">Modbus RTU</text>
  <text x="485" y="539" text-anchor="middle" font-size="9" fill="#6B7280">bám vạch để docking</text>

  <rect x="560" y="485" width="120" height="80" rx="8" fill="#FFFFFF" stroke="#F97316" stroke-width="1.5"/>
  <text x="620" y="508" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">ESP32</text>
  <text x="620" y="524" text-anchor="middle" font-size="9" fill="#6B7280">cảm biến va chạm</text>
  <text x="620" y="539" text-anchor="middle" font-size="9" fill="#6B7280">+ nút E-Stop</text>

  <!-- Side: touchscreen app on robot, connects to PC layer over wifi -->
  <rect x="655" y="65" width="115" height="120" rx="10" fill="#F3F5F8" stroke="#6B7280" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="712" y="88" text-anchor="middle" font-size="10" font-weight="700" fill="#374151">Trên robot</text>
  <rect x="668" y="100" width="90" height="70" rx="6" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.2"/>
  <text x="712" y="121" text-anchor="middle" font-size="9" font-weight="700" fill="#111827">atlas_app_robot</text>
  <text x="712" y="136" text-anchor="middle" font-size="8" fill="#6B7280">PyQt5 cảm ứng</text>
  <text x="712" y="148" text-anchor="middle" font-size="8" fill="#6B7280">nút lớn,</text>
  <text x="712" y="159" text-anchor="middle" font-size="8" fill="#6B7280">xác nhận</text>

  <rect x="90" y="600" width="620" height="70" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="400" y="623" text-anchor="middle" font-size="11" fill="#111827">atlas_app_robot (trên Jetson) và atlas_app (trên PC) đều là client của atlas_api</text>
  <text x="400" y="641" text-anchor="middle" font-size="10" fill="#6B7280">— cùng gọi REST/WebSocket, không giao tiếp trực tiếp với nhau. AP client isolation phải tắt để DDS hoạt động cross-machine.</text>
  <text x="400" y="658" text-anchor="middle" font-size="10" fill="#6B7280">Base URL: http://&lt;PC_IP&gt;:8080 · WebSocket ws://&lt;PC_IP&gt;:8081 (broadcast trạng thái 5Hz)</text>
</svg>
