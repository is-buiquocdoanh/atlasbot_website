<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="Arial, sans-serif">
  <defs>
    <marker id="kmArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <marker id="kmArrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
  </defs>
  <rect width="800" height="560" fill="#FFFFFF"/>
  <text x="400" y="35" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Mô hình động học robot 4 bánh Mecanum</text>

  <!-- chassis -->
  <rect x="280" y="110" width="240" height="300" rx="12" fill="#2563EB" opacity="0.05" stroke="#2563EB" stroke-width="2"/>

  <!-- body frame axes at center -->
  <circle cx="400" cy="260" r="4" fill="#111827"/>
  <line x1="400" y1="260" x2="400" y2="190" stroke="#111827" stroke-width="2.5" marker-end="url(#kmArrow)"/>
  <text x="410" y="195" font-size="12" font-weight="700" fill="#111827">x (v_x)</text>
  <line x1="400" y1="260" x2="330" y2="260" stroke="#111827" stroke-width="2.5" marker-end="url(#kmArrow)"/>
  <text x="285" y="250" font-size="12" font-weight="700" fill="#111827">y (v_y)</text>
  <path d="M 425 260 A 25 25 0 1 1 400 235" fill="none" stroke="#111827" stroke-width="2" marker-end="url(#kmArrow)"/>
  <text x="432" y="245" font-size="12" font-weight="700" fill="#111827">ω</text>

  <!-- wheels at 4 corners -->
  <g>
    <rect x="255" y="118" width="50" height="26" rx="5" fill="#16A34A" opacity="0.15" stroke="#16A34A" stroke-width="2"/>
    <text x="280" y="136" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">FL (1)</text>
    <line x1="280" y1="118" x2="245" y2="83" stroke="#2563EB" stroke-width="2.5" marker-end="url(#kmArrowBlue)"/>
    <text x="205" y="78" font-size="10" fill="#2563EB">v₁</text>
  </g>
  <g>
    <rect x="495" y="118" width="50" height="26" rx="5" fill="#16A34A" opacity="0.15" stroke="#16A34A" stroke-width="2"/>
    <text x="520" y="136" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">FR (2)</text>
    <line x1="520" y1="118" x2="555" y2="83" stroke="#2563EB" stroke-width="2.5" marker-end="url(#kmArrowBlue)"/>
    <text x="560" y="78" font-size="10" fill="#2563EB">v₂</text>
  </g>
  <g>
    <rect x="255" y="376" width="50" height="26" rx="5" fill="#F97316" opacity="0.15" stroke="#F97316" stroke-width="2"/>
    <text x="280" y="394" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">RL (3)</text>
    <line x1="280" y1="402" x2="245" y2="437" stroke="#2563EB" stroke-width="2.5" marker-end="url(#kmArrowBlue)"/>
    <text x="200" y="450" font-size="10" fill="#2563EB">v₃</text>
  </g>
  <g>
    <rect x="495" y="376" width="50" height="26" rx="5" fill="#F97316" opacity="0.15" stroke="#F97316" stroke-width="2"/>
    <text x="520" y="394" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">RR (4)</text>
    <line x1="520" y1="402" x2="555" y2="437" stroke="#2563EB" stroke-width="2.5" marker-end="url(#kmArrowBlue)"/>
    <text x="558" y="450" font-size="10" fill="#2563EB">v₄</text>
  </g>

  <!-- dimension lines -->
  <line x1="400" y1="120" x2="400" y2="260" stroke="#6B7280" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="405" y="150" font-size="10" fill="#6B7280">l_x</text>
  <line x1="400" y1="260" x2="290" y2="260" stroke="#6B7280" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="335" y="275" font-size="10" fill="#6B7280">l_y</text>

  <text x="400" y="440" text-anchor="middle" font-size="10" fill="#6B7280">l_x: nửa chiều dài trục bánh trước–sau · l_y: nửa chiều rộng vệt bánh trái–phải · r: bán kính bánh</text>

  <!-- equations -->
  <rect x="90" y="465" width="620" height="80" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="110" y="488" font-size="12" font-family="monospace" fill="#111827">v₁ = vx − vy − (lx+ly)ω    v₂ = vx + vy + (lx+ly)ω</text>
  <text x="110" y="510" font-size="12" font-family="monospace" fill="#111827">v₃ = vx + vy − (lx+ly)ω    v₄ = vx − vy + (lx+ly)ω</text>
  <text x="110" y="534" font-size="11" fill="#6B7280">Tốc độ góc mỗi bánh: ωᵢ = vᵢ / r  (r = bán kính bánh xe)</text>
</svg>
