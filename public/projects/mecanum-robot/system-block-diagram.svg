<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" font-family="Arial, sans-serif">
  <defs>
    <marker id="sbRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DC2626"/>
    </marker>
    <marker id="sbDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="900" height="780" fill="#FFFFFF"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Sơ đồ khối hệ thống</text>

  <!-- ===== KHỐI NGUỒN (yellow) ===== -->
  <rect x="300" y="55" width="300" height="150" rx="16" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="450" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">KHỐI NGUỒN</text>
  <rect x="340" y="88" width="220" height="44" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
  <text x="450" y="106" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Nguồn 3S2P</text>
  <text x="450" y="122" text-anchor="middle" font-size="11" fill="#111827">(11,1V – 12,6V)</text>
  <line x1="450" y1="132" x2="450" y2="158" stroke="#111827" stroke-width="2" marker-end="url(#sbDark)"/>
  <rect x="400" y="158" width="100" height="34" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
  <text x="450" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Switch</text>

  <!-- ===== KHỐI XỬ LÝ TRUNG TÂM (green) ===== -->
  <rect x="250" y="230" width="400" height="285" rx="16" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="450" y="500" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">KHỐI XỬ LÝ TRUNG TÂM</text>

  <rect x="280" y="255" width="155" height="58" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
  <text x="357" y="278" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Buck DC-DC</text>
  <text x="357" y="295" text-anchor="middle" font-size="11" fill="#111827">XL4005 5V–5A</text>

  <rect x="465" y="255" width="155" height="58" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
  <text x="542" y="278" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Buck DC-DC</text>
  <text x="542" y="295" text-anchor="middle" font-size="11" fill="#111827">LM2596 5V–3A</text>

  <rect x="280" y="350" width="155" height="60" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/>
  <text x="357" y="385" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Raspberry Pi 4</text>

  <rect x="465" y="350" width="155" height="60" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/>
  <text x="542" y="385" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">ESP32</text>

  <line x1="357" y1="313" x2="357" y2="350" stroke="#111827" stroke-width="2" marker-end="url(#sbDark)"/>
  <line x1="542" y1="313" x2="542" y2="350" stroke="#111827" stroke-width="2" marker-end="url(#sbDark)"/>

  <line x1="435" y1="380" x2="463" y2="380" stroke="#111827" stroke-width="2.5" marker-end="url(#sbDark)" marker-start="url(#sbDark)"/>
  <text x="450" y="345" text-anchor="middle" font-size="9" fill="#374151">UART</text>

  <!-- ===== KHỐI TRUYỀN ĐỘNG — TRÁI (orange) ===== -->
  <rect x="20" y="230" width="200" height="345" rx="16" fill="#FFEDD5" stroke="#F97316" stroke-width="2"/>
  <text x="38" y="405" text-anchor="middle" font-size="13" font-weight="700" fill="#9A3412" transform="rotate(-90 38 405)">KHỐI TRUYỀN ĐỘNG</text>

  <circle cx="150" cy="280" r="38" fill="#FFFFFF" stroke="#C2410C" stroke-width="2"/>
  <text x="150" y="277" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Motor</text>
  <text x="150" y="291" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">GA25</text>

  <rect x="75" y="360" width="150" height="55" rx="8" fill="#FFFFFF" stroke="#C2410C" stroke-width="2"/>
  <text x="150" y="392" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Driver L298N</text>

  <circle cx="150" cy="500" r="38" fill="#FFFFFF" stroke="#C2410C" stroke-width="2"/>
  <text x="150" y="497" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Motor</text>
  <text x="150" y="511" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">GA25</text>

  <line x1="150" y1="318" x2="150" y2="358" stroke="#111827" stroke-width="2" marker-end="url(#sbDark)" marker-start="url(#sbDark)"/>
  <line x1="150" y1="417" x2="150" y2="460" stroke="#111827" stroke-width="2" marker-end="url(#sbDark)" marker-start="url(#sbDark)"/>

  <!-- ===== KHỐI TRUYỀN ĐỘNG — PHẢI (orange) ===== -->
  <rect x="680" y="230" width="200" height="345" rx="16" fill="#FFEDD5" stroke="#F97316" stroke-width="2"/>
  <text x="862" y="405" text-anchor="middle" font-size="13" font-weight="700" fill="#9A3412" transform="rotate(90 862 405)">KHỐI TRUYỀN ĐỘNG</text>

  <circle cx="750" cy="280" r="38" fill="#FFFFFF" stroke="#C2410C" stroke-width="2"/>
  <text x="750" y="277" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Motor</text>
  <text x="750" y="291" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">GA25</text>

  <rect x="675" y="360" width="150" height="55" rx="8" fill="#FFFFFF" stroke="#C2410C" stroke-width="2"/>
  <text x="750" y="392" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Driver L298N</text>

  <circle cx="750" cy="500" r="38" fill="#FFFFFF" stroke="#C2410C" stroke-width="2"/>
  <text x="750" y="497" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Motor</text>
  <text x="750" y="511" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">GA25</text>

  <line x1="750" y1="318" x2="750" y2="358" stroke="#111827" stroke-width="2" marker-end="url(#sbDark)" marker-start="url(#sbDark)"/>
  <line x1="750" y1="417" x2="750" y2="460" stroke="#111827" stroke-width="2" marker-end="url(#sbDark)" marker-start="url(#sbDark)"/>

  <!-- ===== KHỐI CẢM BIẾN (purple) ===== -->
  <rect x="250" y="615" width="400" height="130" rx="16" fill="#EDE9FE" stroke="#9333EA" stroke-width="2"/>
  <text x="450" y="730" text-anchor="middle" font-size="13" font-weight="700" fill="#6B21A8">KHỐI CẢM BIẾN</text>

  <rect x="280" y="645" width="160" height="55" rx="8" fill="#FFFFFF" stroke="#9333EA" stroke-width="1.5"/>
  <text x="360" y="678" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">YDLidar X3 Pro</text>

  <rect x="465" y="645" width="160" height="55" rx="8" fill="#FFFFFF" stroke="#9333EA" stroke-width="1.5"/>
  <text x="545" y="678" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Encoder</text>

  <!-- sensor -> processing wires -->
  <line x1="330" y1="645" x2="330" y2="412" stroke="#111827" stroke-width="1.8" marker-end="url(#sbDark)"/>
  <text x="336" y="530" font-size="9" fill="#374151">USB</text>
  <line x1="575" y1="645" x2="575" y2="412" stroke="#111827" stroke-width="1.8" marker-end="url(#sbDark)"/>
  <text x="581" y="530" font-size="9" fill="#374151">GPIO</text>

  <!-- ===== POWER wires (red): Switch -> Buck converters ===== -->
  <line x1="420" y1="192" x2="380" y2="253" stroke="#DC2626" stroke-width="2" marker-end="url(#sbRed)"/>
  <line x1="480" y1="192" x2="520" y2="253" stroke="#DC2626" stroke-width="2" marker-end="url(#sbRed)"/>

  <!-- ===== POWER wires (red): Switch -> Driver L298N (raw battery voltage) ===== -->
  <path d="M 400 175 C 260 175, 150 220, 150 358" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#sbRed)"/>
  <path d="M 500 175 C 640 175, 750 220, 750 358" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#sbRed)"/>

  <!-- ===== CONTROL wires (dark, elbowed): ESP32 -> Driver L298N ===== -->
  <polyline points="542,410 542,455 150,455 150,417" fill="none" stroke="#374151" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#sbDark)"/>
  <polyline points="542,410 542,455 750,455 750,417" fill="none" stroke="#374151" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#sbDark)"/>
  <text x="450" y="448" text-anchor="middle" font-size="9" fill="#374151">PWM / DIR</text>

  <!-- ===== legend ===== -->
  <rect x="20" y="600" width="200" height="70" rx="8" fill="#F9FAFB" stroke="#E5E9EF"/>
  <line x1="35" y1="620" x2="60" y2="620" stroke="#DC2626" stroke-width="2.5"/>
  <text x="68" y="624" font-size="11" fill="#111827">Đường nguồn điện</text>
  <line x1="35" y1="645" x2="60" y2="645" stroke="#374151" stroke-width="2"/>
  <text x="68" y="649" font-size="11" fill="#111827">Tín hiệu điều khiển / dữ liệu</text>
</svg>
