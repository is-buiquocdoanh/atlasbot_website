<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="Arial, sans-serif">
  <defs>
    <marker id="ldArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <marker id="ldArrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect width="800" height="560" fill="#FFFFFF"/>
  <text x="400" y="35" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Nguyên lý đo khoảng cách bằng tam giác đạc (Triangulation)</text>

  <!-- triangulation geometry -->
  <rect x="60" y="70" width="90" height="60" rx="6" fill="#2563EB" opacity="0.10" stroke="#2563EB" stroke-width="2"/>
  <text x="105" y="95" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Laser</text>
  <text x="105" y="112" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">diode</text>

  <rect x="60" y="230" width="90" height="60" rx="6" fill="#F97316" opacity="0.10" stroke="#F97316" stroke-width="2"/>
  <text x="105" y="255" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">Cảm biến</text>
  <text x="105" y="272" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">ảnh (PSD)</text>

  <line x1="150" y1="90" x2="600" y2="90" stroke="#DC2626" stroke-width="2" marker-end="url(#ldArrowRed)"/>
  <text x="360" y="80" text-anchor="middle" font-size="11" fill="#DC2626">Tia laser phát ra</text>

  <rect x="600" y="60" width="16" height="220" fill="#6B7280" opacity="0.5"/>
  <text x="650" y="90" font-size="10" fill="#6B7280">Vật thể</text>
  <text x="650" y="105" font-size="10" fill="#6B7280">(bức tường)</text>

  <line x1="605" y1="90" x2="150" y2="255" stroke="#DC2626" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#ldArrowRed)"/>
  <text x="330" y="200" text-anchor="middle" font-size="11" fill="#DC2626">Ánh sáng phản xạ về</text>

  <line x1="150" y1="255" x2="150" y2="90" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="120" y="175" font-size="10" fill="#6B7280">baseline b</text>

  <line x1="150" y1="90" x2="605" y2="90" stroke="#6B7280" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="380" y="130" text-anchor="middle" font-size="10" fill="#6B7280">khoảng cách D (cần tính)</text>

  <rect x="90" y="330" width="580" height="60" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="380" y="353" text-anchor="middle" font-size="12" font-family="monospace" fill="#111827">D = f · b / x</text>
  <text x="380" y="375" text-anchor="middle" font-size="10" fill="#6B7280">f: tiêu cự thấu kính · b: baseline · x: vị trí điểm sáng trên cảm biến ảnh</text>

  <line x1="30" y1="420" x2="770" y2="420" stroke="#E5E9EF" stroke-width="1.5"/>

  <!-- 360 scan -->
  <text x="400" y="450" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Motor xoay module 360° → mỗi vòng tạo 1 lần quét (scan) gồm nhiều cặp (góc, khoảng cách)</text>

  <circle cx="400" cy="500" r="8" fill="#2563EB"/>
  <g stroke="#DC2626" stroke-width="1" opacity="0.6">
    <line x1="400" y1="500" x2="400" y2="475"/>
    <line x1="400" y1="500" x2="422" y2="482"/>
    <line x1="400" y1="500" x2="435" y2="500"/>
    <line x1="400" y1="500" x2="422" y2="518"/>
    <line x1="400" y1="500" x2="400" y2="525"/>
    <line x1="400" y1="500" x2="378" y2="518"/>
    <line x1="400" y1="500" x2="365" y2="500"/>
    <line x1="400" y1="500" x2="378" y2="482"/>
  </g>
  <text x="500" y="504" font-size="10" fill="#6B7280">→ xuất bản dạng LaserScan (ROS2)</text>
</svg>
