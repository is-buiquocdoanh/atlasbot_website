<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" font-family="Arial, sans-serif">
  <defs>
    <marker id="mwArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <marker id="mwArrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="mwArrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F97316"/>
    </marker>
    <marker id="mwArrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16A34A"/>
    </marker>
  </defs>
  <rect width="800" height="700" fill="#FFFFFF"/>
  <text x="400" y="35" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Nguyên lý bánh xe Mecanum</text>

  <!-- Single wheel roller diagram -->
  <text x="200" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">1. Con lăn nghiêng 45° trên vành bánh</text>
  <circle cx="200" cy="180" r="90" fill="#F3F5F8" stroke="#6B7280" stroke-width="2"/>
  <!-- rollers at 45 deg around rim -->
  <g stroke="#2563EB" stroke-width="5" stroke-linecap="round">
    <line x1="185" y1="102" x2="215" y2="122"/>
    <line x1="255" y1="130" x2="235" y2="160"/>
    <line x1="278" y1="195" x2="242" y2="195"/>
    <line x1="255" y1="230" x2="235" y2="200"/>
    <line x1="215" y1="258" x2="185" y2="238"/>
    <line x1="145" y1="230" x2="165" y2="200"/>
    <line x1="122" y1="195" x2="158" y2="195"/>
    <line x1="145" y1="130" x2="165" y2="160"/>
  </g>
  <circle cx="200" cy="180" r="10" fill="#6B7280"/>
  <text x="200" y="290" text-anchor="middle" font-size="10" fill="#6B7280">Con lăn tự quay quanh trục 45°</text>
  <text x="200" y="306" text-anchor="middle" font-size="10" fill="#6B7280">(không do động cơ dẫn động)</text>

  <!-- force decomposition -->
  <text x="560" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">2. Phân tích lực tại điểm tiếp xúc</text>
  <line x1="560" y1="260" x2="560" y2="100" stroke="#111827" stroke-width="3" marker-end="url(#mwArrow)"/>
  <text x="600" y="100" font-size="11" fill="#111827">F: lực quay bánh (do motor)</text>

  <line x1="560" y1="260" x2="470" y2="170" stroke="#DC2626" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="430" y="160" font-size="10" fill="#DC2626">dọc trục con lăn</text>
  <text x="430" y="174" font-size="10" fill="#DC2626">→ không truyền lực</text>

  <line x1="560" y1="260" x2="650" y2="170" stroke="#16A34A" stroke-width="3" marker-end="url(#mwArrowGreen)"/>
  <text x="655" y="165" font-size="11" font-weight="700" fill="#16A34A">Lực đẩy thực</text>
  <text x="655" y="180" font-size="11" font-weight="700" fill="#16A34A">xuống sàn (45°)</text>

  <circle cx="560" cy="260" r="5" fill="#111827"/>
  <text x="560" y="300" text-anchor="middle" font-size="10" fill="#6B7280">Điểm tiếp xúc bánh với sàn</text>

  <rect x="330" y="330" width="460" height="55" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="560" y="353" text-anchor="middle" font-size="11" fill="#111827">Chỉ thành phần vuông góc trục con lăn mới sinh lực đẩy —</text>
  <text x="560" y="371" text-anchor="middle" font-size="11" fill="#111827">đây là lý do lực đẩy thực nghiêng 45° so với hướng quay bánh</text>

  <line x1="30" y1="420" x2="770" y2="420" stroke="#E5E9EF" stroke-width="1.5"/>

  <!-- 3 maneuver diagrams -->
  <text x="400" y="450" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">3. Kết hợp 4 bánh (hướng con lăn dạng chữ X) tạo các kiểu di chuyển</text>

  <!-- Forward -->
  <g transform="translate(90,480)">
    <rect x="0" y="0" width="140" height="160" rx="8" fill="#F3F5F8" stroke="#6B7280" stroke-width="1.5"/>
    <circle cx="25" cy="25" r="14" fill="#2563EB" opacity="0.6"/>
    <circle cx="115" cy="25" r="14" fill="#2563EB" opacity="0.6"/>
    <circle cx="25" cy="135" r="14" fill="#2563EB" opacity="0.6"/>
    <circle cx="115" cy="135" r="14" fill="#2563EB" opacity="0.6"/>
    <line x1="70" y1="130" x2="70" y2="40" stroke="#111827" stroke-width="3" marker-end="url(#mwArrow)"/>
    <text x="70" y="185" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Tiến thẳng</text>
    <text x="70" y="201" text-anchor="middle" font-size="9" fill="#6B7280">4 bánh quay cùng chiều</text>
  </g>

  <!-- Strafe -->
  <g transform="translate(330,480)">
    <rect x="0" y="0" width="140" height="160" rx="8" fill="#F3F5F8" stroke="#6B7280" stroke-width="1.5"/>
    <circle cx="25" cy="25" r="14" fill="#2563EB" opacity="0.6"/>
    <circle cx="115" cy="25" r="14" fill="#F97316" opacity="0.6"/>
    <circle cx="25" cy="135" r="14" fill="#F97316" opacity="0.6"/>
    <circle cx="115" cy="135" r="14" fill="#2563EB" opacity="0.6"/>
    <line x1="20" y1="80" x2="120" y2="80" stroke="#111827" stroke-width="3" marker-end="url(#mwArrow)"/>
    <text x="70" y="185" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Sang ngang</text>
    <text x="70" y="201" text-anchor="middle" font-size="9" fill="#6B7280">2 cặp bánh chéo ngược chiều</text>
  </g>

  <!-- Rotate -->
  <g transform="translate(570,480)">
    <rect x="0" y="0" width="140" height="160" rx="8" fill="#F3F5F8" stroke="#6B7280" stroke-width="1.5"/>
    <circle cx="25" cy="25" r="14" fill="#2563EB" opacity="0.6"/>
    <circle cx="115" cy="25" r="14" fill="#F97316" opacity="0.6"/>
    <circle cx="25" cy="135" r="14" fill="#2563EB" opacity="0.6"/>
    <circle cx="115" cy="135" r="14" fill="#F97316" opacity="0.6"/>
    <path d="M 70 40 A 40 40 0 1 1 40 65" fill="none" stroke="#111827" stroke-width="3" marker-end="url(#mwArrow)"/>
    <text x="70" y="185" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Xoay tại chỗ</text>
    <text x="70" y="201" text-anchor="middle" font-size="9" fill="#6B7280">bánh trái/phải ngược chiều</text>
  </g>
</svg>
