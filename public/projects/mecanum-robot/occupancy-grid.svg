<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Arial, sans-serif">
  <rect width="800" height="520" fill="#FFFFFF"/>
  <text x="400" y="35" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Occupancy Grid — biểu diễn bản đồ dạng lưới xác suất</text>

  <!-- grid -->
  <g transform="translate(90,60)">
    <!-- base unknown grid -->
    <g>
      <!-- draw 12x10 grid unknown -->
    </g>
    <!-- manually place cells -->
  </g>

  <!-- Build grid programmatically-ish by hand: 12 cols x 9 rows, cell 30px -->
  <g transform="translate(90,60)">
    <rect x="0" y="0" width="360" height="270" fill="#D1D5DB"/>
    <!-- free path cells (robot has seen through) -->
    <rect x="150" y="120" width="30" height="30" fill="#FFFFFF"/>
    <rect x="150" y="90" width="30" height="30" fill="#FFFFFF"/>
    <rect x="150" y="60" width="30" height="30" fill="#FFFFFF"/>
    <rect x="180" y="120" width="30" height="30" fill="#FFFFFF"/>
    <rect x="210" y="120" width="30" height="30" fill="#FFFFFF"/>
    <rect x="240" y="120" width="30" height="30" fill="#FFFFFF"/>
    <rect x="120" y="120" width="30" height="30" fill="#FFFFFF"/>
    <rect x="90" y="120" width="30" height="30" fill="#FFFFFF"/>
    <rect x="150" y="150" width="30" height="30" fill="#FFFFFF"/>
    <rect x="180" y="90" width="30" height="30" fill="#FFFFFF"/>
    <rect x="210" y="90" width="30" height="30" fill="#FFFFFF"/>
    <rect x="120" y="90" width="30" height="30" fill="#FFFFFF"/>
    <!-- occupied cells (walls/obstacle) -->
    <rect x="60" y="30" width="30" height="240" fill="#111827"/>
    <rect x="240" y="60" width="30" height="180" fill="#111827"/>
    <rect x="90" y="30" width="180" height="30" fill="#111827"/>
    <rect x="90" y="240" width="180" height="30" fill="#111827"/>
    <rect x="270" y="90" width="30" height="30" fill="#111827"/>

    <!-- robot -->
    <circle cx="165" cy="135" r="9" fill="#2563EB"/>
    <line x1="165" y1="135" x2="165" y2="118" stroke="#2563EB" stroke-width="2"/>

    <!-- lidar rays -->
    <g stroke="#DC2626" stroke-width="1.2" opacity="0.7" stroke-dasharray="3 2">
      <line x1="165" y1="135" x2="165" y2="45"/>
      <line x1="165" y1="135" x2="255" y2="105"/>
      <line x1="165" y1="135" x2="255" y2="135"/>
      <line x1="165" y1="135" x2="75" y2="105"/>
      <line x1="165" y1="135" x2="105" y2="255"/>
    </g>

    <rect x="0" y="0" width="360" height="270" fill="none" stroke="#6B7280" stroke-width="1.5"/>
  </g>

  <!-- legend -->
  <g transform="translate(490,80)">
    <rect x="0" y="0" width="22" height="22" fill="#FFFFFF" stroke="#6B7280"/>
    <text x="32" y="17" font-size="12" fill="#111827">Free — p ≈ 0 (đã quét qua, trống)</text>

    <rect x="0" y="35" width="22" height="22" fill="#111827"/>
    <text x="32" y="52" font-size="12" fill="#111827">Occupied — p ≈ 1 (có vật cản)</text>

    <rect x="0" y="70" width="22" height="22" fill="#D1D5DB"/>
    <text x="32" y="87" font-size="12" fill="#111827">Unknown — p = 0.5 (chưa quét tới)</text>

    <line x1="0" y1="115" x2="20" y2="115" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="32" y="119" font-size="12" fill="#111827">Tia quét LiDAR (ray casting)</text>

    <circle cx="10" cy="145" r="8" fill="#2563EB"/>
    <text x="32" y="149" font-size="12" fill="#111827">Vị trí robot</text>
  </g>

  <rect x="90" y="365" width="620" height="90" rx="8" fill="#F3F5F8" stroke="#E5E9EF"/>
  <text x="110" y="390" font-size="12" font-family="monospace" fill="#111827">l = log( p / (1−p) )   — biểu diễn log-odds</text>
  <text x="110" y="412" font-size="12" font-family="monospace" fill="#111827">l_new = l_old + l_measurement − l_prior</text>
  <text x="110" y="437" font-size="10" fill="#6B7280">Cập nhật Bayes theo log-odds tránh phải tính p trực tiếp mỗi lần đo — cộng dồn đơn giản, nhanh</text>

  <text x="400" y="490" text-anchor="middle" font-size="11" fill="#6B7280">Mỗi ô trên đường đi của tia laser → giảm xác suất occupied; ô tại điểm chạm vật cản → tăng xác suất occupied</text>
</svg>
